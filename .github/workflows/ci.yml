name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thesistrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Alembic's env.py reads DATABASE_URL (not TEST_DATABASE_URL) to build the
      # migration engine. These two addressed the SAME database until 2026-09-20,
      # which is the configuration `backend/tests/conftest.py` now refuses: the DB
      # fixtures drop every table, so a run where both variables point at one
      # database is the shape that destroys a dev store locally. CI has nothing to
      # lose, but exempting it would leave the guard untested on every push and let
      # the two environments disagree — so CI mirrors local instead: migrations
      # target their own database, tests own theirs.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/thesistrace_migrations
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/thesistrace_test
      EDGAR_CONTACT: "ThesisTrace CI ci@example.com"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install backend deps
        working-directory: backend
        run: uv sync --locked --all-groups

      - name: Create the migration-target database
        # The service container creates POSTGRES_DB (thesistrace_test) only.
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE thesistrace_migrations'

      - name: Run migrations
        # alembic.ini lives at repo root (script_location = db/migrations,
        # prepend_sys_path = backend) so this must run from there, per README.
        run: uv run --project backend alembic upgrade head

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Run tests
        working-directory: backend
        run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      # Runs BEFORE the build: a failing assertion should report as a failing test,
      # not as a slower build. Until 2026-08-13 this job was lint + build only, so
      # every pure function in the app shipped untested.
      - name: Test (vitest)
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build
