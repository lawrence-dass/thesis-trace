      altman:
        z_score: 2.699877
        band: "Grey"
      beneish:
        m_score: -2.884422
        band: "No manipulation flag"
      # Story 5.6, hand-verified 2026-08-04: 10,000,000 / 2,614,878,000.
      # OTEX switched its maturity-ladder near-term tag twice mid-history, which
      # Story 5.6 asked to be handled. It is handled by not reading the ladder at
      # all: LongTermDebtCurrent covers FY2010-2025 without a gap.
      near_term_debt_share:
        share: 0.003824
        band: "Well spread"
        near_term_debt: 10000000
        total_debt: 2614878000
        near_term_source: LongTermDebtCurrent
        total_source: LongTermDebt
      # Story 5.7: OTEX yields NO profile, and live it does so for TWO distinct
      # reasons in different fiscal years. It has NEVER tagged years 2-5 in any
      # year (confirmed live 2026-08-05), so:
      #   * FY2012-2020 — year_1 AND thereafter, the two-ended ladder. Refused by
      #     contiguity: rendering the two ends alone implies a schedule with a
      #     hole in it.
      #   * FY2011, FY2021-2025 — year_1 alone, once the thereafter tag stops.
      #     Refused by the middle-year floor.
      #
      # THIS COMMENT WAS ONCE WRONG IN AN INSTRUCTIVE WAY. It said "the engine
      # requires at least one middle year" while the engine had stopped doing so:
      # Story 5.7's code review replaced that rule with contiguity alone, on the
      # grounds that contiguity subsumed it. It does not, and the six length-one
      # years above rendered a bogus one-row schedule until spec v2 restored the
      # floor on 2026-08-05. The comment described the intended rule correctly and
      # the implemented one incorrectly, and nothing connected the two.
      debt_maturity_profile:
        no_profile: true
        # NOTE ON WHAT THIS ACTUALLY EXERCISES — AND WHAT IT CANNOT. The committed
        # fixture reproduces only the thereafter end, because OTEX's year_1 facts
        # come from accessions this trimmed fixture does not carry, and adding one
        # would perturb the hand-verified scores above.
        #
        # That gap is not cosmetic: it is exactly why this entry kept passing while
        # production rendered six spurious profiles. `assert profiles == {}` is a
        # claim about every year, but a fixture with no year_1 facts cannot produce
        # the shape that broke it, so the guard was structurally unable to fail.
        # Both live shapes are covered by unit tests instead —
        # test_no_middle_years_yields_no_profile_at_all (two-ended) and
        # test_a_lone_year_one_bucket_yields_no_profile (length one).
        #
        # Generalises: a golden entry whose fixture cannot reproduce its own stated
        # reason is pinning an outcome, not verifying it. Say so where it happens.
        reason: "live: never tags years 2-5; yields no profile via contiguity (FY2012-2020) or the middle-year floor (FY2011, FY2021-2025). Fixture carries the thereafter end only and cannot exercise either."
      # Story 6.7, FY2019. OTEX's capex comes from PaymentsToAcquireProductiveAssets
      # — it has NEVER tagged the common PaymentsToAcquirePropertyPlantAndEquipment,
      # so a golden entry built against the common tag alone would report it as
      # having no capex at all. The lowest implied growth in the universe (5.9%),
      # and the only filer whose implied rate sits below its own achieved CAGR.
      reverse_dcf:
        insufficient_data: false
        assumptions:
          discount_rate: 0.10
          terminal_growth: 0.025
          horizon_years: 5
        operands:
          cash_from_operations: 876278000
          capex: 63837000
          free_cash_flow: 812441000
          total_debt: 2614878000
          cash_and_equivalents: 941009000
          shares_outstanding: 269834442
          market_price: 41.2
          market_cap: 11117179010.4
          enterprise_value: 12791048010.4
        implied_growth: 0.058595285

