# Phase-1 golden dataset for SM-1 (score correctness).
#
# All four companies are now genuinely hand-verified (2026-07-23/25/26/29):
# every canonical input was independently cross-checked against each
# company's raw EDGAR company-facts JSON (bypassing the pipeline/DB
# entirely), then all four models were hand-computed from those
# confirmed-correct figures and matched the pipeline's stored output exactly
# (Piotroski to the signal, Beneish to all 8 indices, Altman to all 5
# components). Companies without a fixture yet are listed as
# `pending_fixture` so coverage gaps are explicit, never silent — none
# remain as of this entry.
#
# SHOP uses shop_real_company_facts.json (real EDGAR data), NOT
# shop_company_facts.json — the latter is an older, entirely SYNTHETIC
# fixture (fabricated accession numbers, and tags SHOP doesn't actually use:
# Liabilities, CostOfRevenue, LongTermDebtNoncurrent) still relied on by
# several other test files (test_ingestion.py, test_canonicalization.py,
# test_pipeline.py, etc.) for structural/mechanics testing unrelated to
# real-world numeric accuracy. Replacing it wholesale would have broken 9
# other test files' hardcoded characterization assertions for no gain here,
# so this golden entry uses its own separate, real fixture instead.
#
# The three IFRS filers (CCJ, BCE, SU) were added 2026-08-04, hand-verified the
# same way: every canonical input read straight out of the fixture JSON, all
# four models recomputed by a script that imports nothing from backend/scoring
# or backend/formulas, then compared against the pipeline. Agreement is
# therefore corroboration, not the same code run twice.
#
# That pass caught a real error in the hand-computation itself, which is the
# point of doing it: Sloan uses AVERAGE total assets over the two years, while
# Beneish's TATA uses year-end. Computing Sloan with year-end assets was wrong
# by ~1e-4 and would have been recorded as the golden value had the two figures
# not been compared component by component.
#
# CPB and ZTS added 2026-09-01 (Story 12.4, Epic 12), FY2025, hand-verified the
# same way: every canonical input taken from cpb_company_facts.json /
# zts_company_facts.json (trimmed FY2023-2025 real EDGAR data, built from the
# same live company-facts JSON fetched for Story 12.1's spike — every concept
# and both fiscal years independently confirmed to reproduce the dev DB's
# canonicalized output exactly before this entry was written, per the standing
# "confirm the fixture can exercise the concept" rule), then all four models
# plus the reverse DCF and near-term debt share recomputed by a script that
# imports nothing from backend/scoring or backend/formulas, then compared
# against the actual pipeline (score_piotroski/sloan/beneish/altman run
# against the same fixtures) — every value matched exactly, no discrepancy to
# resolve this time. CPB's FYE close $32.33 (2025-08-01, last trading day
# on/before its 2025-08-03 FYE) and ZTS's $125.82 (2025-12-31) are real Tiingo
# EOD closes, live-fetched 2026-09-01.

universe: [SHOP, CP, QSR, OTEX, CCJ, BCE, SU, CPB, ZTS]

companies:
  - ticker: SHOP
    status: active
    fixture: shop_real_company_facts.json
    # Real EDGAR-filed close, SHOP's FY2024 10-K's fiscal-year-end
    # (2024-12-31), confirmed against the Tiingo price actually stored.
    fye_close: 106.33
    fye_date: "2024-12-31"
    fiscal_year: 2024
    expected:
      # Hand-verified 2026-07-29 against SHOP's real FY2024 10-K figures
      # (accession 0001594805-25-000012, which also carries FY2023 as its
      # only comparative — SHOP has no standalone FY2023 10-K at all). See
      # shop_real_company_facts.json.
      piotroski:
        f_score: 6
      sloan:
        accruals_ratio: 0.031955
        band: "Low accruals (higher quality)"
      altman:
        z_score: 36.292041
        band: "Safe"
      beneish:
        # CORRECTED 2026-08-21. This block previously read "SHOP genuinely has no
        # long_term_debt XBRL tag at all (confirmed live: a real zero-debt company)".
        # That was wrong: SHOP tags ConvertibleDebtNoncurrent FY2019-2024. The tag
        # was deliberately UNMAPPED, which is a different fact, and the note turned
        # a mapping decision into a claim about the filer. Mapped at concepts_v9.
        #
        # Hand-verified 2026-08-21 from the fixture's own filed figures, importing
        # nothing from backend/scoring or backend/formulas, and honouring
        # beneish_v1.yaml's quantization contract — every division rounded to 6
        # places, ROUND_HALF_EVEN. Two earlier hand-passes disagreed at 2e-5 by
        # quantizing only the final index.
        # DSRI 0.964224  GMI 0.988624  AQI 1.080285  SGI 1.257790
        # DEPI 1.356208  SGAI 0.663882  TATA 0.028943  LVGI 0.875001
        m_score: -1.981461
        band: "No manipulation flag"
      # RESOLVED at concepts_v9 (2026-08-21). Story 5.6 recorded this as
      # insufficient_data because `long_term_debt` was unmapped for SHOP, so the
      # total_debt derivation had no second operand. Both operands now exist:
      # near_term_debt 918M (ConvertibleDebtCurrent) and long_term_debt 0
      # (ConvertibleDebtNoncurrent), giving total_debt 918M and a share of exactly
      # 1.0 — every dollar of SHOP's debt is due within twelve months in FY2024,
      # because the notes flipped to current that year rather than being repaid.
      # A real 100%, not a degenerate one: FY2025 shows them settled.
      near_term_debt_share:
        share: 1.0
        band: "Concentrated near term"
        near_term_debt: 918000000
        total_debt: 918000000
        total_source: "derived: total_debt_current_plus_noncurrent"
      debt_maturity_profile:
        no_profile: true
        reason: "no debt maturity ladder filed; SHOP tags a LEASE ladder, which is not this"
      # Story 6.7. SHOP cannot reach an enterprise value: total_debt is absent for
      # the same reason its debt share is (long_term_debt deliberately unmapped —
      # see `shop_convertible_debt_unmapped` in engineering-findings.yaml). A REAL outcome, not
      # a fixture gap: the capex and cash tags ARE present for FY2024.
      # RESOLVED at concepts_v9 (2026-08-21). Story 6.7 recorded insufficient_data
      # with reason "total debt", because total_debt could not be derived while
      # long_term_debt was unmapped. Mapping ConvertibleDebtNoncurrent supplies the
      # missing operand, so SHOP reaches an enterprise value for the first time.
      # implied_growth 0.527762 was solved INDEPENDENTLY of backend/valuation by
      # bisection over reverse_dcf_v1's declared range, written from the spec text
      # (same constraint as the harness's own solver). SHOP is priced at roughly 85x
      # free cash flow, so the figure is high but is a real root inside the range,
      # not a clamped bound. Operands are asserted too, since a wrong component can
      # hide behind a right-looking aggregate (the D8 lesson).
      reverse_dcf:
        insufficient_data: false
        assumptions:
          discount_rate: 0.10
          terminal_growth: 0.025
          horizon_years: 5
        operands:
          cash_from_operations: 1616000000
          capex: 19000000
          free_cash_flow: 1597000000
          total_debt: 918000000
          cash_and_equivalents: 1498000000
          shares_outstanding: 1289812124
          market_price: 106.33
          market_cap: 137145723144.92
          enterprise_value: 136565723144.92
        implied_growth: 0.527762

