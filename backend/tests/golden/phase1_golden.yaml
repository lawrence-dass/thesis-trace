        no_profile: true
        reason: "ifrs-full maturity analysis is dimensional; unreachable via company-facts"
      # Story 6.7, FY2024, in CAD. An IFRS filer: capex is
      # PurchaseOfPropertyPlantAndEquipmentClassifiedAsInvestingActivities and cash
      # is the combined CashAndCashEquivalents tag. Cameco classifies interest paid
      # as FINANCING (proven from its classification tags, not inferred), so its
      # cash_from_operations excludes interest and its free cash flow reads
      # systematically high — the figure is annotated, never adjusted.
      reverse_dcf:
        insufficient_data: false
        assumptions:
          discount_rate: 0.10
          terminal_growth: 0.025
          horizon_years: 5
        operands:
          cash_from_operations: 905288000
          capex: 211635000
          free_cash_flow: 693653000
          total_debt: 1281290000
          cash_and_equivalents: 600462000
          shares_outstanding: 435312083
          market_price: 73.945071
          market_cap: 32189182884.592892
          enterprise_value: 32870010884.592892
