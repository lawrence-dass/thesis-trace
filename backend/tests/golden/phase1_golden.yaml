# Phase-1 golden dataset for SM-1 (score correctness).
#
# All four companies are now genuinely hand-verified (2026-07-23/25/26/29):
# every canonical input was independently cross-checked against each
# company's raw EDGAR company-facts JSON (bypassing the pipeline/DB
# entirely), then all four models were hand-computed from those
# confirmed-correct figures and matched the pipeline's stored output exactly
# (Piotroski to the signal, Beneish to all 8 indices, Altman to all 5
# components). Companies without a fixture yet are listed as
# `pending_fixture` so coverage gaps are explicit, never silent — none
# remain as of this entry.
#
# SHOP uses shop_real_company_facts.json (real EDGAR data), NOT
# shop_company_facts.json — the latter is an older, entirely SYNTHETIC
# fixture (fabricated accession numbers, and tags SHOP doesn't actually use:
# Liabilities, CostOfRevenue, LongTermDebtNoncurrent) still relied on by
# several other test files (test_ingestion.py, test_canonicalization.py,
# test_pipeline.py, etc.) for structural/mechanics testing unrelated to
# real-world numeric accuracy. Replacing it wholesale would have broken 9
# other test files' hardcoded characterization assertions for no gain here,
# so this golden entry uses its own separate, real fixture instead.
#
# The three IFRS filers (CCJ, BCE, SU) were added 2026-08-04, hand-verified the
# same way: every canonical input read straight out of the fixture JSON, all
# four models recomputed by a script that imports nothing from backend/scoring
# or backend/formulas, then compared against the pipeline. Agreement is
# therefore corroboration, not the same code run twice.
#
# That pass caught a real error in the hand-computation itself, which is the
# point of doing it: Sloan uses AVERAGE total assets over the two years, while
# Beneish's TATA uses year-end. Computing Sloan with year-end assets was wrong
# by ~1e-4 and would have been recorded as the golden value had the two figures
# not been compared component by component.

universe: [SHOP, CP, QSR, OTEX, CCJ, BCE, SU]

companies:
  - ticker: SHOP
    status: active
    fixture: shop_real_company_facts.json
    # Real EDGAR-filed close, SHOP's FY2024 10-K's fiscal-year-end
    # (2024-12-31), confirmed against the Tiingo price actually stored.
    fye_close: 106.33
    fye_date: "2024-12-31"
    fiscal_year: 2024
    expected:
      # Hand-verified 2026-07-29 against SHOP's real FY2024 10-K figures
      # (accession 0001594805-25-000012, which also carries FY2023 as its
      # only comparative — SHOP has no standalone FY2023 10-K at all). See
      # shop_real_company_facts.json.
      piotroski:
        f_score: 5
      sloan:
        accruals_ratio: 0.031955
        band: "Low accruals (higher quality)"
      altman:
        z_score: 36.292041
        band: "Safe"
      beneish:
        # SHOP genuinely has no long_term_debt XBRL tag at all (confirmed
        # live: a real zero-debt company) — LVGI, and so the aggregate M,
        # is correctly insufficient_data rather than a bug to chase.
        m_score: null
        band: null
      # Story 5.6: SHOP is the one filer with no near-term debt share, and the
      # reason is a pre-existing deliberate decision rather than a gap here. Its
      # near_term_debt resolves from ConvertibleDebtCurrent (FY2023-2025), but
      # `long_term_debt` is unmapped for SHOP because its convertible notes flip
      # between the Current and Noncurrent tags as they near maturity — so the
      # total_debt derivation has no second operand. Reversing that would move
      # SHOP's hand-verified Piotroski and Beneish values and belongs in its own
      # change. insufficient_data, never a partial figure (AD-16).
      near_term_debt_share:
        insufficient_data: true
        reason: "no total_debt — long_term_debt deliberately unmapped for SHOP"
      debt_maturity_profile:
        no_profile: true
        reason: "no debt maturity ladder filed; SHOP tags a LEASE ladder, which is not this"

  - ticker: QSR
    status: active
    fixture: qsr_company_facts.json
    # Real EDGAR-filed close, QSR's FY2023 10-K's fiscal-year-end (2023-12-31),
    # confirmed against the Tiingo price actually stored for that date.
    fye_close: 78.13
    fye_date: "2023-12-31"
    fiscal_year: 2023
    expected:
      # Hand-verified 2026-07-23 against QSR's real FY2023 10-K figures
      # (accession 0001618756-24-000020) and its FY2022 comparative
      # (accession 0001618756-23-000013). See qsr_company_facts.json.
      piotroski:
        f_score: 6
      sloan:
        accruals_ratio: 0.017123
        band: "Low accruals (higher quality)"
      altman:
        z_score: 1.471660
        band: "Distress"
      beneish:
        m_score: -2.219847
        band: "No manipulation flag"
      # Story 5.6, hand-verified 2026-08-04 by a script importing nothing from
      # backend/debt: 67,000,000 / 12,921,000,000.
      near_term_debt_share:
        share: 0.005185
        band: "Well spread"
        near_term_debt: 67000000
        total_debt: 12921000000
        near_term_source: LongTermDebtCurrent
        total_source: LongTermDebt
      # Story 5.7, hand-verified 2026-08-05 by a script importing nothing from
      # backend/debt. The buckets sum to 13,043,000,000 against a filed
      # LongTermDebt of 12,921,000,000 — deliberately NOT recorded as a total,
      # because they do not reconcile: undiscounted contractual principal vs
      # balance-sheet carrying amount.
      debt_maturity_profile:
        truncated: false
        unit: USD
        buckets:
          debt_maturity_year_1: 67000000
          debt_maturity_year_2: 706000000
          debt_maturity_year_3: 84000000
          debt_maturity_year_4: 115000000
          debt_maturity_year_5: 3505000000
          debt_maturity_thereafter: 8566000000

  - ticker: CP
    status: active
    fixture: cp_company_facts.json
    # CP reports entirely in CAD (AD-11 currency fix) — Tiingo's close is USD,
    # so Altman's X4 needs the matching USD/CAD rate for the same date, both
    # confirmed live (Tiingo close + Bank of Canada's own published rate for
    # 2023-12-29, the last trading day before the Sunday FYE).
    fye_close: 79.06
    fye_date: "2023-12-31"
    fx_rate:
      currency_pair: USDCAD
      rate: 1.3226
    fiscal_year: 2023
    expected:
      # Hand-verified 2026-07-25 against CP's real FY2023 10-K figures
      # (accession 0000016875-24-000009) and its FY2022 comparative
      # (accession 0000016875-23-000008). See cp_company_facts.json.
      piotroski:
        f_score: 6
      sloan:
        accruals_ratio: -0.002738
        band: "Low accruals (higher quality)"
      altman:
        z_score: 2.145200
        band: "Grey"
      beneish:
        # CP genuinely has no COGS/SGA tags at all (confirmed live: a railroad
        # reporting functional expense categories instead) — insufficient_data
        # is the correct, real outcome here, not a bug to chase.
        m_score: null
        band: null
      # Story 5.6, hand-verified 2026-08-04, in CAD as all CP figures are:
      # 3,143,000,000 / 22,494,000,000. Lease-inclusive on BOTH sides — CP reports
      # debt and capital-lease obligations on one combined line and never splits
      # them, so the ratio is internally consistent and slightly wider than a filer
      # that reports the two separately.
      near_term_debt_share:
        share: 0.139726
        band: "Moderate near-term load"
        near_term_debt: 3143000000
        total_debt: 22494000000
        near_term_source: LongTermDebtAndCapitalLeaseObligationsCurrent
        total_source: LongTermDebtAndCapitalLeaseObligationsIncludingCurrentMaturities
      # Story 5.7, hand-verified 2026-08-05, in CAD as all CP figures are. FY2023
      # is one of CP's four complete years — it began tagging a thereafter bucket
      # only in FY2022, so FY2010-2021 are truncated and the gap is severe
      # (FY2021's buckets sum to 7,376M against a 20,127M total debt).
      debt_maturity_profile:
        truncated: false
        unit: CAD
        buckets:
          debt_maturity_year_1: 3133000000
          debt_maturity_year_2: 933000000
          debt_maturity_year_3: 1990000000
          debt_maturity_year_4: 7000000
          debt_maturity_year_5: 1868000000
          debt_maturity_thereafter: 15202000000

  - ticker: OTEX
    status: active
    fixture: otex_company_facts.json
    # OTEX's fiscal year ends June 30, not Dec 31 — confirmed live against the
    # real 10-K and the Tiingo close actually stored for that date.
    fye_close: 41.20
    fye_date: "2019-06-30"
    fiscal_year: 2019
    expected:
      # Hand-verified 2026-07-26 against OTEX's real FY2019 10-K figures
      # (accession 0001002638-19-000014) and its FY2018 comparative
      # (accession 0001002638-18-000022). See otex_company_facts.json.
      # Notably confirms the "as-originally-filed wins" rule (AD-3) correctly
      # resolving several genuine restatement conflicts in the real data
      # (ebit, cash_from_operations, and sga each differ by a small amount
      # between OTEX's own FY2018 10-K and later filings' comparative column).
      piotroski:
        f_score: 7
      sloan:
        accruals_ratio: -0.075263
        band: "Low accruals (higher quality)"
      altman:
        z_score: 2.699877
        band: "Grey"
      beneish:
        m_score: -2.884422
        band: "No manipulation flag"
      # Story 5.6, hand-verified 2026-08-04: 10,000,000 / 2,614,878,000.
      # OTEX switched its maturity-ladder near-term tag twice mid-history, which
      # Story 5.6 asked to be handled. It is handled by not reading the ladder at
      # all: LongTermDebtCurrent covers FY2010-2025 without a gap.
      near_term_debt_share:
        share: 0.003824
        band: "Well spread"
        near_term_debt: 10000000
        total_debt: 2614878000
        near_term_source: LongTermDebtCurrent
        total_source: LongTermDebt
      # Story 5.7: OTEX yields NO profile, for a specific reason. It tags a
      # next-twelve-months bucket and a thereafter bucket but has NEVER tagged
      # years 2-5 in any year (confirmed live 2026-08-05). Rendering the two ends
      # alone would imply a schedule with a hole in it, so the engine requires at
      # least one middle year.
      debt_maturity_profile:
        no_profile: true
        # NOTE ON WHAT THIS ACTUALLY EXERCISES. Live, OTEX tags year_1 AND
        # thereafter and never years 2-5 — the two-ended ladder the contiguity
        # rule exists for. The committed fixture reproduces only the thereafter
        # end, because OTEX's year_1 facts come from accessions this trimmed
        # fixture does not carry, and adding one would perturb the hand-verified
        # scores above. So this entry pins the outcome (no profile) but exercises
        # a one-ended ladder; the two-ended case is covered by
        # test_no_middle_years_yields_no_profile_at_all. Stated rather than left
        # for a reader to assume the fixture matches the reason.
        reason: "live: tags year_1 and thereafter but never years 2-5; fixture carries the thereafter end only"

  # --- 40-F / ifrs-full filers (D8) -----------------------------------------
  # Market data is real and fetched live 2026-08-04: Tiingo EOD closes for
  # 2024-12-31 and the Bank of Canada USD/CAD rate for the same date. All three
  # report in CAD, so Altman's X4 needs the FX conversion or it silently divides
  # a USD price by a CAD denominator (AD-11).
  - ticker: CCJ
    status: active
    fixture: cameco_company_facts.json
    fye_close: 51.39
    fye_date: "2024-12-31"
    fx_rate:
      currency_pair: USDCAD
      rate: 1.4389
    fiscal_year: 2024
    expected:
      # Hand-verified 2026-08-04. The 4-of-4 case: Cameco files an operating-profit
      # line, so its ebit is read as filed and never derived. Altman matched on all
      # five components and Beneish on all eight indices.
      piotroski:
        f_score: 7
      sloan:
        accruals_ratio: -0.073932
        band: "Low accruals (higher quality)"
      altman:
        z_score: 6.465406
        band: "Safe"
      beneish:
        m_score: -2.965792
        band: "No manipulation flag"
      # Story 5.6, hand-verified 2026-08-04: 285,707,000 / 1,281,290,000, the
      # denominator derived as 285,707,000 + 995,583,000. Cameco files a
      # `Borrowings` total that agrees exactly, and it is deliberately NOT mapped —
      # see ifrs-full_v3.yaml for why (Suncor's same-named total is not on this
      # basis).
      near_term_debt_share:
        share: 0.222984
        band: "Moderate near-term load"
        near_term_debt: 285707000
        total_debt: 1281290000
        near_term_source: CurrentPortionOfLongtermBorrowings
        total_source: "derived: total_debt_current_plus_noncurrent"
      debt_maturity_profile:
        no_profile: true
        reason: "ifrs-full maturity analysis is dimensional; unreachable via company-facts"

  - ticker: BCE
    status: active
    fixture: bce_company_facts.json
    fye_close: 23.18
    fye_date: "2024-12-31"
    fx_rate:
      currency_pair: USDCAD
      rate: 1.4389
    fiscal_year: 2024
    expected:
      # Hand-verified 2026-08-04. The 3-of-4 case, and the regression guard for the
      # ebit DECISION: BCE files no operating-profit line, so X3 comes from
      # profit_before_tax + interest_expense. X2 is genuinely NEGATIVE (-0.114867
      # before weighting) — BCE carries an accumulated deficit, which is real and
      # not a sign error. Nothing else in the golden set exercises that.
      piotroski:
        f_score: 4
      sloan:
        accruals_ratio: -0.090947
        band: "Low accruals (higher quality)"
      altman:
        z_score: 0.519600
        band: "Distress"
      beneish:
        # No SG&A line at all (IAS 1 by-nature presentation), so SGAI and the
        # aggregate M are correctly insufficient_data — the same shape as CP's
        # missing COGS under us-gaap.
        m_score: null
        band: null
      # Story 5.6: BCE resolves FY2016-2023 and NOT FY2024 — it stopped tagging
      # CurrentPortionOfLongtermBorrowings after FY2023, confirmed live 2026-08-04.
      # It does tag the wider CurrentBorrowingsAndCurrentPortionOfNoncurrentBorrowings
      # through FY2025, which is deliberately not mapped: that measure sweeps in
      # commercial paper and securitization, 1.4-4.1bn more than the current portion
      # in every shared year. Using it here would inflate BCE against every other
      # filer. insufficient_data is the honest answer (AD-16).
      near_term_debt_share:
        insufficient_data: true
        reason: "CurrentPortionOfLongtermBorrowings not tagged for FY2024"
      debt_maturity_profile:
        no_profile: true
        reason: "ifrs-full maturity analysis is dimensional; unreachable via company-facts"

  - ticker: SU
    status: active
    fixture: suncor_company_facts.json
    # A real price IS supplied so the null Altman below is attributable to the
    # missing input rather than to withheld market data — without it the entry
    # would assert nothing.
    fye_close: 35.68
    fye_date: "2024-12-31"
    fx_rate:
      currency_pair: USDCAD
      rate: 1.4389
    fiscal_year: 2024
    expected:
      # Hand-verified 2026-08-04. The 2-of-4 case, and deliberately the most
      # degraded entry in the set: four of Suncor's concepts resolve only through
      # by-nature variant tags that are not like-for-like with a by-function
      # filer's, so its Piotroski and Sloan runs are computed_with_caveat.
      piotroski:
        f_score: 6
      sloan:
        accruals_ratio: -0.111528
        band: "Low accruals (higher quality)"
      altman:
        # Suncor tags NO retained-earnings concept anywhere, so X2 cannot resolve
        # and neither can Z. There is no defensible substitute.
        z_score: null
        band: null
      beneish:
        # No SG&A line (by-nature), so SGAI blocks the aggregate, as for BCE.
        m_score: null
        band: null
      # Story 5.6, hand-verified 2026-08-04: 997,000,000 / 10,345,000,000, the
      # denominator derived as 997,000,000 + 9,348,000,000. Suncor's filed
      # `Borrowings` is NOT used: it includes short-term borrowings, which the
      # numerator excludes. Verified live that the gap equals its ShorttermBorrowings
      # to the dollar in FY2016-2018.
      near_term_debt_share:
        share: 0.096375
        band: "Well spread"
        near_term_debt: 997000000
        total_debt: 10345000000
        near_term_source: CurrentPortionOfLongtermBorrowings
        total_source: "derived: total_debt_current_plus_noncurrent"
      debt_maturity_profile:
        no_profile: true
        reason: "ifrs-full maturity analysis is dimensional; unreachable via company-facts"
