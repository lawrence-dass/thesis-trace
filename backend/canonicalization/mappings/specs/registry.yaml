# Concept-mapping registry (AD-2).
#
# Names the per-taxonomy spec files that together constitute one MAPPING_VERSION.
# `mapping_version` is the composite identifier stamped onto every canonical_facts
# and concept_mappings row, so a stored fact can always be traced back to the exact
# set of rules that produced it.
#
# CHANGING A MAPPING:
#   1. Copy the taxonomy's spec to a new file with the next version suffix
#      (e.g. us-gaap_v4.yaml -> us-gaap_v5.yaml) and edit the copy. Never edit a
#      spec that a stored mapping_version already points at — AD-2 requires that
#      historical rows stay reproducible.
#   2. Point the entry below at the new file and bump `mapping_version`.
#   3. Re-run canonicalization; new rows are written under the new version and the
#      old ones remain for audit.
#
# HISTORY
#   concepts_v4  us-gaap_v4 + ifrs-full_v1. Also the version the 2026-08-02
#                extraction of these rules from hardcoded Python into YAML kept:
#                that refactor was proven rule-for-rule identical, so the mapping
#                itself did not change and bumping would have orphaned every stored
#                canonical fact behind a duplicate rule set.
#   concepts_v5  us-gaap_v4 + ifrs-full_v2 + derivations_v2. A real mapping change
#                (D8 step 6): the right-of-use PP&E fallback that BCE and Suncor both
#                switched to mid-history, the two operand concepts behind the IFRS
#                ebit decision, and the ebit + gross_profit derivations. us-gaap is
#                untouched and keeps its v4 spec — a per-taxonomy change does not
#                force a version on the others.

#   concepts_v6  us-gaap_v5 + ifrs-full_v3 + derivations_v3. A real mapping change
#                (Story 5.6): the near_term_debt and total_debt concepts behind the
#                near-term debt share, plus the total_debt identity derivation. All
#                three taxonomy specs move because the concept pair spans both
#                regimes and the derivation ties them together.

#   concepts_v7  us-gaap_v6 + ifrs-full_v3 + derivations_v3. A real mapping change
#                (Story 5.7): the six year-by-year debt maturity buckets behind the
#                maturity profile. us-gaap ONLY — under IFRS the maturity analysis is
#                dimensional and unreachable through company-facts — so ifrs-full and
#                derivations keep their v3 specs, per the per-taxonomy rule above.

#   concepts_v8  us-gaap_v7 + ifrs-full_v4 + derivations_v4. A real mapping change
#                (Story 6.2): the capex and cash_and_equivalents concepts behind the
#                reverse DCF, plus the cash/cash_equivalents operands and the
#                cash_plus_cash_equivalents identity that give BCE a cash figure at
#                all. All three specs move because the concept pair spans both
#                regimes and the derivation ties them together — same reasoning as
#                concepts_v6.

#   concepts_v9  us-gaap_v8 + ifrs-full_v4 + derivations_v4. A real mapping change:
#                ConvertibleDebtNoncurrent joins long_term_debt, which resolves SHOP's
#                Piotroski leverage signal and Beneish LVGI — the two that had read
#                insufficient_data since Epic 2 because SHOP's entire debt load is
#                convertible notes. us-gaap ONLY (no IFRS filer tags convertible debt
#                separately), so ifrs-full and derivations keep their v4 specs, per the
#                per-taxonomy rule above. The source is flagged `like_for_like: false`:
#                SHOP's notes flip noncurrent -> current in FY2024 without being repaid,
#                which Beneish absorbs (it sums both terms) and Piotroski does not (it
#                reads long_term_debt alone). Annotated, never corrected.

#   concepts_v10  us-gaap_v9 + ifrs-full_v4 + derivations_v5. Story 12.3: adds ZTS's
#                 legacy SalesRevenueNet revenue fallback (proven equal to Revenues
#                 in the two overlap years) and extends the ebit_pbt_plus_interest
#                 derivation to us-gaap by mapping profit_before_tax/interest_expense
#                 there for the first time (ZTS is the only us-gaap filer that lacks
#                 OperatingIncomeLoss; zero effect on the other four, which read ebit
#                 as filed). Also adds `excludes_issuers` — a new mapping-engine
#                 capability — to stop ZTS from silently inheriting the
#                 restricted-cash-inclusive cash_and_equivalents fallback proven safe
#                 for QSR but disproven for ZTS by its own RestrictedCashCurrent tag.
#                 us-gaap and derivations both move because the ebit extension spans
#                 the two files; ifrs-full is untouched and keeps v4.

#   concepts_v11  us-gaap_v10 + ifrs-full_v4 + derivations_v5. A real mapping
#                 change (otex_capex_sign_error_fy2007_fy2009, found while
#                 live-verifying feature-catalog row Q1.6): capex gains
#                 `non_negative: true`. OTEX's original FY2009 10-K tagged its
#                 PaymentsToAcquireProductiveAssets fact with a nonstandard
#                 negative sign for FY2007 and FY2009, which AD-3's
#                 as-originally-filed tiebreak selected outright with no
#                 competing candidate to flag as ambiguous. canonicalize.py now
#                 takes abs(value) for any concept carrying the flag, applied
#                 before the ambiguity check — this also recovers FY2008, which
#                 was previously flagged ambiguous_selection because its two
#                 competing candidates (-6,895,000 / +6,895,000) now correctly
#                 resolve to the same normalized value. us-gaap ONLY: the same
#                 live check found no sign disagreement under ifrs-full, so
#                 ifrs-full and derivations both keep their existing specs, per
#                 the per-taxonomy rule above.

#   concepts_v12  us-gaap_v11 + ifrs-full_v4 + derivations_v5. A real mapping
#                 change (zts_stale_reverse_dcf_cash_gap, found while
#                 live-verifying feature-catalog row Q3.3): removes ZTS's
#                 `excludes_issuers` on cash_and_equivalents's restricted-cash-
#                 inclusive fallback (added concepts_v10). That exclusion was
#                 reasoned from the source tag's NAME plus ZTS's own nonzero
#                 RestrictedCashCurrent, never checked against ZTS's actual
#                 overlap-year values. Checked live: the fallback tag equals
#                 ZTS's primary cash tag exactly in both years they overlap
#                 (FY2017, FY2018) despite nonzero restricted cash both years —
#                 the same "PROVEN equal, not assumed" shape the QSR proof
#                 already uses for this same source. ZTS's primary tag stops
#                 after FY2018, so the exclusion had been silently freezing
#                 ZTS's entire reverse-DCF card at FY2017 data. us-gaap ONLY;
#                 ifrs-full and derivations keep their existing specs.

#   concepts_v13  us-gaap_v12 + ifrs-full_v4 + derivations_v5. A real mapping
#                 change (otex_shares_outstanding_scale_error_fy2007_fy2009,
#                 found live-verifying a data-quality flag surfaced while
#                 browser-checking the v10/v11 fixes): adds
#                 `excludes_accessions` — a new mapping-engine capability — to
#                 shares_outstanding's WeightedAverageNumberOfSharesOutstanding
#                 Basic fallback, excluding OTEX's FY2009 10-K (accession
#                 0001193125-09-179839, the same first-ever-XBRL filing behind
#                 v10's capex sign bug). That filing mis-scaled this concept by
#                 1000x for FY2007 and FY2009, self-corrected in every later
#                 filing with no formal amendment. Live impact, hand-verified:
#                 the wrong FY2009 share count understated market value of
#                 equity by 1000x, flipping the stored Altman Z-Score from
#                 3.189 (Safe) to 0.927 (Distress) — a live misclassification,
#                 not a latent one. us-gaap ONLY; ifrs-full and derivations
#                 keep their existing specs.

#   concepts_v14  us-gaap_v13 + ifrs-full_v4 + derivations_v5. A real mapping
#                 change (Story 13.3 / story_13_3_brand_member_live_verification):
#                 the first DIMENSIONED mappings in this project — per-brand
#                 intangible carrying value, per-brand impairment, acquisition
#                 value, and CPB's own within-10%-of-impairment disclosure, all
#                 on us-gaap:IndefiniteLivedIntangibleAssetsByMajorClassAxis.
#                 Dimensioned rules key on (taxonomy, concept, axis, member)
#                 because one source concept means two different things under
#                 two different members. Members carry PER-ERA aliases: CPB
#                 renames its own members between filings (Kettle has three
#                 names in four filings, one of them the filer's own double-s
#                 typo), so a member verified on the newest filing does not
#                 cover earlier years. Per-brand impairment is mapped for CPB
#                 only — ZTS tags impairment consolidated-only under a different
#                 concept and QSR tags none, which is recorded as data rather
#                 than left as an unexplained gap. us-gaap ONLY: no IFRS filer
#                 is in scope for this epic (acquisition_epic_scoped_to_us_gaap_
#                 filers), so ifrs-full and derivations keep their existing
#                 specs, per the per-taxonomy rule above.

#   concepts_v15  us-gaap_v14 + ifrs-full_v4 + derivations_v5. A real mapping
#                 change (story_13_3_first_live_pipeline_run): adds
#                 brand_intangible_carrying_value_total, the filer's OWN total
#                 for the trademark class, read from CPB's aggregate
#                 us-gaap:TrademarksMember. The per-brand rows cannot be summed
#                 into a total, and leaving this deliberate aggregate unmapped
#                 made the member guard raise false needs_review warnings. The
#                 prior concepts_v14 spec is retained unchanged on disk so rows
#                 already stamped with it remain reproducible (AD-2).

#   concepts_v16  us-gaap_v15 + ifrs-full_v4 + derivations_v5. A real mapping
#                 change (story_13_3_zts_non_brand_intangibles_land_as_brand_value):
#                 brand_intangible_carrying_value now resolves BRANDS only. ZTS's
#                 in-process R&D and product rights, which concepts_v15 stored as
#                 brand value, are declared under the new `excluded_members`
#                 block instead. Bumped rather than amended because the dev
#                 database already holds concepts_v15 rows: a spec is frozen once
#                 any database stamps its version, merged or not. us-gaap_v14 is
#                 retained unchanged so those rows stay reproducible (AD-2).

#   concepts_v17  us-gaap_v16 + ifrs-full_v4 + derivations_v5. A real mapping
#                 change (the Codex round on PR #138): CPB's own residual trade-name
#                 bucket moves out of brand_intangible_carrying_value into
#                 brand_intangible_carrying_value_residual. concepts_v16 answered
#                 "is everything in this concept a brand" for ZTS and left CPB's
#                 residual behind. Bumped, not amended: the dev database already
#                 holds concepts_v16 rows, and a spec is frozen the moment any
#                 database stamps its version.

#   concepts_v18  us-gaap_v17 + ifrs-full_v4 + derivations_v5. Story 13.4a, and the
#                 first version in this history that CHANGES NO FIGURE. It adds
#                 read-time brand identity: QSR's four segment brands (its 30 rows
#                 all share member_key `trade_names`, and the brand is the segment
#                 member inside context_key), and a `kind` on every brand member so
#                 an aggregate, a residual and the filer's own disclosure can be
#                 told from a named brand without pattern-matching a label.
#                 Bumped rather than amended because the dev database already holds
#                 concepts_v17 rows — a spec is frozen the moment any database
#                 stamps its version. Re-canonicalizing under this version must
#                 reproduce the same rows with the same values; that it does is the
#                 story's own acceptance check, not an assumption.

mapping_version: concepts_v18

taxonomies:
  us-gaap: us-gaap_v17
  ifrs-full: ifrs-full_v4

derivations: derivations_v5
