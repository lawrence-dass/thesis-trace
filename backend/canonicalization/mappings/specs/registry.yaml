# Concept-mapping registry (AD-2).
#
# Names the per-taxonomy spec files that together constitute one MAPPING_VERSION.
# `mapping_version` is the composite identifier stamped onto every canonical_facts
# and concept_mappings row, so a stored fact can always be traced back to the exact
# set of rules that produced it.
#
# CHANGING A MAPPING:
#   1. Copy the taxonomy's spec to a new file with the next version suffix
#      (e.g. us-gaap_v4.yaml -> us-gaap_v5.yaml) and edit the copy. Never edit a
#      spec that a stored mapping_version already points at — AD-2 requires that
#      historical rows stay reproducible.
#   2. Point the entry below at the new file and bump `mapping_version`.
#   3. Re-run canonicalization; new rows are written under the new version and the
#      old ones remain for audit.
#
# HISTORY
#   concepts_v4  us-gaap_v4 + ifrs-full_v1. Also the version the 2026-08-02
#                extraction of these rules from hardcoded Python into YAML kept:
#                that refactor was proven rule-for-rule identical, so the mapping
#                itself did not change and bumping would have orphaned every stored
#                canonical fact behind a duplicate rule set.
#   concepts_v5  us-gaap_v4 + ifrs-full_v2 + derivations_v2. A real mapping change
#                (D8 step 6): the right-of-use PP&E fallback that BCE and Suncor both
#                switched to mid-history, the two operand concepts behind the IFRS
#                ebit decision, and the ebit + gross_profit derivations. us-gaap is
#                untouched and keeps its v4 spec — a per-taxonomy change does not
#                force a version on the others.

#   concepts_v6  us-gaap_v5 + ifrs-full_v3 + derivations_v3. A real mapping change
#                (Story 5.6): the near_term_debt and total_debt concepts behind the
#                near-term debt share, plus the total_debt identity derivation. All
#                three taxonomy specs move because the concept pair spans both
#                regimes and the derivation ties them together.

#   concepts_v7  us-gaap_v6 + ifrs-full_v3 + derivations_v3. A real mapping change
#                (Story 5.7): the six year-by-year debt maturity buckets behind the
#                maturity profile. us-gaap ONLY — under IFRS the maturity analysis is
#                dimensional and unreachable through company-facts — so ifrs-full and
#                derivations keep their v3 specs, per the per-taxonomy rule above.

#   concepts_v8  us-gaap_v7 + ifrs-full_v4 + derivations_v4. A real mapping change
#                (Story 6.2): the capex and cash_and_equivalents concepts behind the
#                reverse DCF, plus the cash/cash_equivalents operands and the
#                cash_plus_cash_equivalents identity that give BCE a cash figure at
#                all. All three specs move because the concept pair spans both
#                regimes and the derivation ties them together — same reasoning as
#                concepts_v6.

#   concepts_v9  us-gaap_v8 + ifrs-full_v4 + derivations_v4. A real mapping change:
#                ConvertibleDebtNoncurrent joins long_term_debt, which resolves SHOP's
#                Piotroski leverage signal and Beneish LVGI — the two that had read
#                insufficient_data since Epic 2 because SHOP's entire debt load is
#                convertible notes. us-gaap ONLY (no IFRS filer tags convertible debt
#                separately), so ifrs-full and derivations keep their v4 specs, per the
#                per-taxonomy rule above. The source is flagged `like_for_like: false`:
#                SHOP's notes flip noncurrent -> current in FY2024 without being repaid,
#                which Beneish absorbs (it sums both terms) and Piotroski does not (it
#                reads long_term_debt alone). Annotated, never corrected.

mapping_version: concepts_v9

taxonomies:
  us-gaap: us-gaap_v8
  ifrs-full: ifrs-full_v4

derivations: derivations_v4
