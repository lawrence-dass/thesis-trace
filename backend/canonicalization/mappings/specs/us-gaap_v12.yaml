# us-gaap concept mappings — Form 10-K filers.
#
# Every `sources` list is a PRIORITY-ORDERED fallback chain: the first entry wins
# outright when several source tags resolve for the same (issuer, fiscal year).
# List position IS the priority, so the ordering cannot drift out of sync with the
# intent the way a hand-written `priority=N` could.
#
# Each `note` records a LIVE verification against real data.sec.gov company-facts
# JSON. They are not decoration: every fallback below exists because a specific
# filer was silently resolving to insufficient_data (or to a wrong value) without
# it. Never add a source tag on the strength of the tag merely existing in the
# taxonomy — check its per-year coverage for the filers in the universe first.
#
# v9 (2026-09-01, Story 12.3): CPB and ZTS onboarding. Adds ZTS's legacy revenue
# tag (proven equal to Revenues in the overlap years — see revenue below) and
# us-gaap profit_before_tax/interest_expense (ZTS lacks OperatingIncomeLoss
# entirely; feeds the existing taxonomy-blind ebit_pbt_plus_interest derivation,
# which was us-gaap-unreachable before this version because neither operand had a
# us-gaap source). Also adds `excludes_issuers` to cash_and_equivalents's
# restricted-cash fallback — ZTS's own RestrictedCashCurrent tag disproves the
# QSR-based safety proof for ZTS specifically (see cash_and_equivalents below).
# CPB's own legacy revenue tag (SalesRevenueGoodsNet) was checked and REJECTED —
# see revenue's note — a live-verified decision NOT to add a fallback, recorded
# here rather than left as an unexplained gap.
#
# v10 (2026-09-02, otex_capex_sign_error_fy2007_fy2009): capex gains
# `non_negative: true`. Live-verified against data.sec.gov and the dev DB's own
# canonical_facts: OTEX's original FY2009 10-K (accession 0001193125-09-179839)
# tagged PaymentsToAcquireProductiveAssets with a nonstandard negative sign for
# its own FY2009 (-12,150,000) and for its FY2007 comparative (-5,260,000), which
# AD-3's as-originally-filed tiebreak then selected outright — neither year had a
# competing candidate to disagree with, so the sign error was invisible to the
# ambiguous_selection check that correctly caught FY2008 (where a later 10-K's
# restated comparative DID compete, sign-flipped but magnitude-identical:
# -6,895,000 vs +6,895,000). OTEX self-corrected the sign in every later filing's
# comparative column with no formal amendment, so there is no restatement
# relationship for AD-6 to prefer either. `non_negative` normalizes to
# `abs(value)` at selection time in canonicalize.py — capex is definitionally a
# cash outflow magnitude (`cash_from_operations - capex` in reverse_dcf_v1.yaml
# assumes it), never negative by definition, so this is a value-domain fact
# about the concept, not a new source tag or fallback. Only us-gaap moves:
# ifrs-full's capex sources showed no sign disagreement in the same live check
# (Cameco/BCE both clean, Suncor has no capex tag at all — unrelated,
# pre-existing finding).
#
# v11 (2026-09-02, zts_stale_reverse_dcf_cash_gap): removes ZTS's
# `excludes_issuers` on cash_and_equivalents's restricted-cash-inclusive
# fallback, added in v9 above. That exclusion was reasoned from the tag's NAME
# plus ZTS's nonzero RestrictedCashCurrent, never actually checked against ZTS's
# own overlap-year values — checking it live shows the fallback tag equals
# ZTS's primary cash tag exactly in both years they overlap (FY2017, FY2018)
# despite nonzero restricted cash both years, the same "PROVEN equal, not
# assumed" shape the QSR proof already uses for this same source. ZTS's primary
# tag stops after FY2018, so the exclusion had been silently freezing ZTS's
# ENTIRE reverse-DCF card at FY2017 data since Story 12.3 shipped — a live,
# user-facing effect discovered while live-verifying an unrelated Phase 2
# catalog row (Q3.3), not a hypothetical coverage gap. See
# cash_and_equivalents's note below for the full evidence and
# engineering-findings.yaml's zts_stale_reverse_dcf_cash_gap entry.
#
# v12 (2026-09-02, otex_shares_outstanding_scale_error_fy2007_fy2009): adds
# `excludes_accessions` — a new mapping-engine capability — to
# shares_outstanding's WeightedAverageNumberOfSharesOutstandingBasic fallback,
# excluding OTEX's own FY2009 10-K (accession 0001193125-09-179839, its
# first-ever XBRL filing — the SAME filing behind v10's capex sign bug). That
# filing mis-scaled this concept by 1000x for the years it originally reports
# (FY2007: 49,393 instead of 49,393,000; FY2009: 52,030 instead of
# 52,030,000), self-corrected in every later filing's comparative column with
# no formal amendment — confirmed live by comparing this filing's own values
# against its own later, corrected filings. Live impact, verified by hand:
# the wrong FY2009 share count understated market value of equity by 1000x,
# which flipped Altman's FY2009 Z-Score from 3.189 (Safe) to the 0.927
# (Distress) actually stored and rendered — a live misclassification, not a
# latent one. Found live-verifying an unrelated data-quality flag surfaced
# while browser-checking the v10/v11 fixes. Distinct mechanism from `excludes_
# issuers`: this suppresses ONE FILING's own bad data for one issuer, not a
# tag that measures the wrong thing for that issuer across its whole history.
# See shares_outstanding's note below and engineering-findings.yaml's
# otex_shares_outstanding_scale_error_fy2007_fy2009 entry.

taxonomy: us-gaap
spec_version: us-gaap_v12

concepts:

  total_assets:
    sources:
      - concept: Assets

  current_assets:
    sources:
      - concept: AssetsCurrent

  current_liabilities:
    sources:
      - concept: LiabilitiesCurrent

  net_income:
    note: >-
      CP tags us-gaap:ProfitLoss for the years its NetIncomeLoss tag omits
      (confirmed live 2026-07-22 — CP is missing NetIncomeLoss for FY2014-2021).
    sources:
      - concept: NetIncomeLoss
      - concept: ProfitLoss

  cash_from_operations:
    note: >-
      QSR's FY2016 10-K tags the ContinuingOperations variant instead of the plain
      concept (confirmed live 2026-07-23). Without this fallback the originally-filed
      FY2016 value never enters the candidate pool at all, leaving only two later,
      mutually-conflicting comparative copies (1,269M vs 1,250M) and a spurious
      ambiguous_selection where a clean originally-filed figure should win.
    sources:
      - concept: NetCashProvidedByUsedInOperatingActivities
      - concept: NetCashProvidedByUsedInOperatingActivitiesContinuingOperations

  shares_outstanding:
    note: >-
      Deliberately NOT sourced from dei:EntityCommonStockSharesOutstanding — that
      cover-page fact is dated to the 10-K's FILING date (commonly 45-75+ days after
      fiscal year-end for a December filer), not FYE, so it lands in the wrong
      fiscal-year bucket during canonicalization (grouped by rf.period_end.year) and
      silently starves Altman's X4 and Piotroski's shares_not_diluted signal of real
      production data. Verified live against SEC EDGAR (2026-07-21):
      us-gaap:CommonStockSharesOutstanding is genuinely FYE-dated for single-class
      filers (CP, QSR, OTEX all confirmed).
    sources:
      - concept: CommonStockSharesOutstanding
      - concept: WeightedAverageNumberOfSharesOutstandingBasic
        excludes_accessions: ["0001193125-09-179839"]  # OTEX's FY2009 10-K — see below
        note: >-
          SHOP's multi-class share structure means its 10-Ks never tag
          CommonStockSharesOutstanding at all. Its FYE-dated fallback is the
          weighted-average basic count — also confirmed live.

          EXCLUDES OTEX's FY2009 10-K (accession 0001193125-09-179839, its
          first-ever XBRL filing) specifically. That filing tagged this
          concept in THOUSANDS under the plain "shares" unit — FY2007:
          49,393 (should be 49,393,000); FY2009 (its own just-ended year):
          52,030 (should be 52,030,000) — self-corrected in every later
          filing's comparative column (FY2008-2011 all correctly ×1000) with
          no formal amendment, the same shape as this file's capex sign
          finding (v10) from the SAME filing. AD-3's as-originally-filed
          tiebreak selected the FY2009 value outright (own-year, no
          competing candidate at that tier) and left FY2007 as a lone,
          uncontested candidate — live-verified impact: the wrong FY2009
          share count understated market value of equity by 1000x, flipping
          Altman's stored FY2009 Z-Score from 3.189 (Safe) to 0.927
          (Distress). Excluding this one accession lets FY2009 fall through
          to us-gaap:CommonStockSharesOutstanding (52,716,751, correctly
          scaled, from the FY2010 10-K's comparative) at its normal source
          priority; FY2007 has no other candidate at all and correctly
          becomes insufficient_data (AD-16) rather than silently wrong.

  total_liabilities:
    note: >-
      SHOP never tags us-gaap:Liabilities at all (confirmed live 2026-07-22) — its
      balance sheet reports LiabilitiesAndStockholdersEquity and StockholdersEquity
      instead. Covered by the `assets_minus_equity` rule in derivations_v1.yaml
      rather than by a substitute tag here.
    sources:
      - concept: Liabilities

  stockholders_equity:
    sources:
      - concept: StockholdersEquity

  retained_earnings:
    sources:
      - concept: RetainedEarningsAccumulatedDeficit

  ebit:
    sources:
      - concept: OperatingIncomeLoss

  revenue:
    note: >-
      CP's us-gaap:Revenues tag doesn't cover FY2014-2021 (confirmed live
      2026-07-22) even though it exists as a concept overall.
      RevenueFromContractWithCustomerExcludingAssessedTax is the ASC-606-era tag
      most filers (including CP) switched some years to.

      Story 12.3 (2026-09-01): ZTS and CPB each carry a pre-ASC-606 legacy revenue
      tag not covered by Revenues (FY2016-2025 for ZTS, FY2017-2025 for CPB under
      this mapping alone) — checked against Revenues in the overlap years before
      trusting either, per the standing rule that a same-shaped candidate needs
      proof, not assumption:

      ZTS's SalesRevenueNet == Revenues to the dollar in both overlap years
      (FY2016: $4,888M both; FY2017: $5,307M both, accessions 0001555280-17-000044
      and 0001555280-18-000053). A clean tag switch, not a measurement change.
      ADMITTED below — extends ZTS revenue to FY2011-2025 and resolves the
      FY2014 single-year gap found during ticker selection (accession
      0001555280-15-000057, $4,785,000,000) as that switch, not a real gap.

      CPB's SalesRevenueGoodsNet DISAGREES with Revenues by ~35% in both overlap
      years (FY2017: $7,890M vs $5,837M, +35.17%; FY2018: $8,685M vs $6,615M,
      +31.29%; CPB tags Revenues from CPB's 2019 10-K, accession
      0000016732-19-000070, which appears to reclassify divested businesses as
      discontinued operations for all periods presented — CPB also tags a
      separate SalesReturnsGoods line, consistent with GoodsNet being a
      pre-allowance, continuing-plus-discontinued figure rather than the same
      concept renamed). REJECTED — NOT added below. CPB's revenue-dependent
      signals correctly stay insufficient_data for FY2008-2016 rather than being
      filled with a ~35% inflated figure; the fix would need a filed
      reconciliation of GoodsNet to a continuing-operations basis, which does not
      exist as a source tag.
    sources:
      - concept: Revenues
      - concept: RevenueFromContractWithCustomerExcludingAssessedTax
      - concept: SalesRevenueNet
        note: >-
          ZTS only, FY2011-2017 (verified exact match against Revenues in the two
          overlap years, FY2016-2017 — see the concept note above). Ordered last
          so it never contends against the two ASC-606-era tags for any filer
          that has both.

  cogs:
    note: >-
      Never resolved for ANY of the four companies under the original single-tag
      mapping (confirmed live 2026-07-22 — zero canonical_facts rows existed).
      Fallback tags verified live per company. CP has neither tag — a railroad,
      reporting functional expense categories instead of a single COGS line — and
      correctly resolves to insufficient_data rather than a guess (AD-3).
    sources:
      - concept: CostOfRevenue
      - concept: CostOfGoodsAndServicesSold

  sga:
    note: >-
      Same zero-coverage history as cogs above (confirmed live 2026-07-22). CP tags
      neither variant and correctly stays insufficient_data (AD-3).
    sources:
      - concept: SellingGeneralAndAdministrativeExpense
      - concept: GeneralAndAdministrativeExpense

  receivables:
    note: >-
      QSR tags AccountsNotesAndLoansReceivableNetCurrent (a combined notes+accounts
      tag), never AccountsReceivableNetCurrent — confirmed live 2026-07-23. This made
      QSR's Beneish insufficient_data for EVERY year, not just the 2024-2025 window
      the cogs gap alone would explain. SHOP tags AccountsAndOtherReceivablesNetCurrent
      instead — also confirmed live; SHOP's Beneish never resolved at all under the
      original single-tag mapping.
    sources:
      - concept: AccountsReceivableNetCurrent
      - concept: AccountsNotesAndLoansReceivableNetCurrent
      - concept: AccountsAndOtherReceivablesNetCurrent

  ppe_net:
    note: >-
      CP switched to a combined PP&E + finance-lease right-of-use-asset tag starting
      with its FY2021 10-K (confirmed live 2026-07-29). Its own originally-filed
      FY2021/2024/2025 accessions never tag the plain PropertyPlantAndEquipmentNet
      concept for those balance-sheet dates, which was silently starving Beneish's
      AQI/DEPI indices of a real value.
    sources:
      - concept: PropertyPlantAndEquipmentNet
      - concept: PropertyPlantAndEquipmentAndFinanceLeaseRightOfUseAssetAfterAccumulatedDepreciationAndAmortization

  depreciation:
    note: >-
      QSR never tags the combined DepreciationDepletionAndAmortization concept — it
      tags the plain Depreciation / DepreciationAndAmortization line instead
      (confirmed live 2026-07-23). OTEX switches away from a single total D&A tag
      entirely after FY2019 (splits into DepreciationNonproduction +
      OtherDepreciationAndAmortization + several Amortization* line items with no
      single combined tag); deriving a total by summing an assumed subset would be a
      guess (AD-3), so OTEX's Beneish correctly stays insufficient_data for FY2020
      onward rather than being forced with an unverified derivation.
    sources:
      - concept: DepreciationDepletionAndAmortization
      - concept: DepreciationAndAmortization
      - concept: Depreciation

  long_term_debt:
    note: >-
      Same zero-coverage history as cogs/sga above (confirmed live 2026-07-22).
    sources:
      - concept: LongTermDebtNoncurrent
      - concept: LongTermDebtAndCapitalLeaseObligations
        note: >-
          CP: verified live 2026-07-22 — no "...Noncurrent" variant exists. The tag CP
          actually uses is LongTermDebtAndCapitalLeaseObligations (a total, not split
          into current/noncurrent), reported in CAD, as are all of CP's financials.
      - concept: ConvertibleDebtNoncurrent
        like_for_like: false
        mismatch_reason: >-
          Long-term debt is convertible notes only, and the notes move between the
          noncurrent and current tags as they approach maturity rather than being
          repaid. A fall in this figure can therefore mean reclassification rather
          than deleveraging, so a signal reading long-term debt on its own is not
          directly comparable with a filer whose long-term debt is term debt.
        note: >-
          SHOP only — the one filer whose entire debt load is convertible notes. Held
          back from concepts_v4 through v7 on the reasoning that mapping the noncurrent
          tag alone would make leverage appear to fall to zero while the debt was still
          outstanding. Story 5.6 mapping ConvertibleDebtCurrent was recorded as
          removing that objection; verified live 2026-08-21 that it removes it only
          PARTLY, which is why this source is flagged rather than plain.

          Per-year coverage, confirmed live 2026-08-21 and bucketed on period_end:
          ConvertibleDebtNoncurrent FY2019-2024 (0, 758.0, 911.0, 913.3, 916.0, 0) and
          ConvertibleDebtCurrent FY2023-2025 (0, 918.0, 0). The two are exactly
          complementary and NEVER both non-zero — the notes sit noncurrent through
          FY2023, flip to current in FY2024, and are gone by FY2025.

          The consequence differs per model, which is the reason for the flag. Beneish
          LVGI reads (current_liabilities + long_term_debt), so the flip moves 918M
          from one term to the other and the sum is preserved — LVGI resolves
          correctly. Piotroski leverage_decreasing reads long_term_debt ALONE, so
          FY2023 916/11299 against FY2024 0/13924 registers as deleveraging that did
          not happen. The reclassification is verified: SHOP current liabilities rise
          898M to 1956M in FY2024 and fall to 1392M in FY2025 as the notes settle.

          NOT corrected, only annotated. Piotroski's change-in-leverage signal is
          defined on long-term debt, and under that definition SHOP's long-term debt
          did fall to zero. Adjusting it would be ThesisTrace originating methodology,
          which the deterministic boundary forbids for our own code as much as for the
          LLM. Same posture as Cameco FY2021's Beneish of +20.84 — inputs correct,
          arithmetic correct, annotate never alter.

  gross_profit:
    sources:
      - concept: GrossProfit

  # --- Story 5.6: near-term debt share (OQ9) -------------------------------
  #
  # The pair below is deliberately sourced on ONE measurement basis — the
  # balance-sheet carrying amount of long-term debt, split current/noncurrent.
  # A maturity ladder's first bucket is NOT used, and the reason is empirical.
  #
  # Story 5.6 was specified on the premise that a ladder's first bucket and a
  # current-portion tag "are the same concept". Verified live 2026-08-04 against
  # real company-facts for all seven filers, they are not:
  #
  #   CP    LongTermDebtMaturities...InNextTwelveMonths vs ...ObligationsCurrent
  #         differs in 11 of 15 shared years (FY2013: 50M vs 189M)
  #   OTEX  differs in 10 of 10 shared years (FY2022: 168.9M vs 10.0M)
  #   QSR   differs in 2 of 12 shared years (FY2014: 1,115M vs 61.4M)
  #
  # They measure different things: the ladder discloses undiscounted contractual
  # principal scheduled for repayment, while the current-portion tag is the
  # carrying amount — net of unamortized discount and issue costs, and reflecting
  # refinancing classification. Treating them as interchangeable would have
  # shipped two differently-measured views of one figure.
  #
  # It costs nothing to drop the ladder, because every filer that has one also
  # tags the split, with equal or better per-year coverage. That also dissolves
  # both traps Story 5.6 asked to be pinned: CP's ladder is never summed because
  # it is never read, and OTEX's twice-switched ladder tag is never consulted.

  near_term_debt:
    note: >-
      Debt due within twelve months, as the filer's own balance sheet classifies
      it. Per-year coverage confirmed live 2026-08-04 (bucketed by period_end
      against each issuer's recognized fiscal-year-end, NOT by the payload's `fy`
      field, which labels a fact with the fiscal year of the report that carried
      it): QSR FY2013-2025 and OTEX FY2010-2025 from LongTermDebtCurrent, CP
      FY2009-2025 from the capital-lease variant, SHOP FY2023-2025 from
      ConvertibleDebtCurrent.
    sources:
      - concept: LongTermDebtCurrent
      - concept: LongTermDebtAndCapitalLeaseObligationsCurrent
        note: >-
          CP only. Confirmed live 2026-08-04 that CP tags no LongTermDebtCurrent
          in any year, but has tagged this variant for 17 consecutive years
          (FY2009-2025). Story 5.1's spike reported that CP "tags no
          LongTermDebtCurrent/Noncurrent at all" and built the whole ladder-based
          design around that: it checked the exact tag name and missed this
          variant. Ordered BELOW LongTermDebtCurrent so QSR — which tags both, and
          whose two differ by the finance-lease component in all 12 shared years —
          takes the pure long-term-debt figure that matches its LongTermDebt
          denominator. CP is lease-inclusive on BOTH sides of the ratio, so its
          own number stays internally consistent.
      - concept: ConvertibleDebtCurrent
        note: >-
          SHOP only — its debt is entirely convertible notes. Resolves the
          numerator for FY2023-2025, but SHOP still yields no ratio because its
          denominator cannot be built; see total_debt below.

  total_debt:
    note: >-
      The denominator, on the same carrying-amount basis as near_term_debt.
      Short-term borrowings are deliberately EXCLUDED, so this is total long-term
      debt including its current maturities, not every borrowing outstanding.
      Confirmed live 2026-08-04 that the exclusion is what keeps the ratio
      consistent: commercial paper and securitization sit outside the
      current-portion tag for BCE, Suncor and CP alike, and the short-term tags
      themselves are too patchy to sum without assuming a subset (QSR tags one
      year, OTEX six, SHOP none) — which derivations_v3.yaml rules out as neither
      an identity nor a decision.

      Where no filed total exists the value comes from the total_debt_current_plus_
      noncurrent derivation. That the two routes agree is verified, not assumed:
      current + noncurrent reproduces the filed total for OTEX 9/9 years and
      Cameco 4/4, QSR 12 of 13 and CP 11 of 12.
    sources:
      - concept: LongTermDebt
        note: >-
          QSR FY2013-2025 and OTEX FY2010-2025, confirmed live 2026-08-04. The
          us-gaap total already includes current maturities, so it is the whole
          denominator rather than the noncurrent piece.
      - concept: LongTermDebtAndCapitalLeaseObligationsIncludingCurrentMaturities
        note: >-
          CP FY2014-2025, confirmed live 2026-08-04. Lease-inclusive, matching
          CP's lease-inclusive numerator. CP's earlier years (FY2009-2013) have no
          filed total and fall through to the derivation, which sums the same two
          lease-inclusive tags — so CP's basis does not change mid-history.

  # --- Story 5.7: year-by-year maturity profile ----------------------------
  #
  # ENRICHMENT, NOT A METRIC, and deliberately NOT operands of the near-term
  # debt share. Story 5.6 established that these tags and the current-portion
  # tags are DIFFERENT MEASUREMENTS: the ladder discloses undiscounted
  # contractual principal scheduled for repayment, while near_term_debt and
  # total_debt are balance-sheet carrying amounts, net of unamortized discount
  # and issue costs. They differ in 11 of 15 shared years for CP and 10 of 10
  # for OTEX.
  #
  # The consequence that is easy to miss: even a COMPLETE ladder does not sum to
  # total_debt. Verified live 2026-08-05 — QSR FY2023's six buckets sum to
  # 13,043M against a filed LongTermDebt of 12,921M; CP FY2023 to 23,133M
  # against 22,494M. Nothing downstream may present these buckets as
  # reconciling to total debt, or as a percentage of it. A test enforces that
  # the profile object exposes no total at all.
  #
  # PER-YEAR COVERAGE, confirmed live 2026-08-05 (period_end bucketed against
  # each issuer's own fiscal-year-end, never the payload's `fy` field):
  #
  #   QSR   years 1-5 FY2014-2025, thereafter FY2014-2024
  #         -> complete profile FY2014-2024; FY2025 truncated
  #   CP    years 1-5 FY2010-2025 (year_1 absent FY2012), thereafter FY2022-2025
  #         -> complete profile FY2022-2025; FY2010-2021 truncated, and the
  #            truncation is severe — FY2021's buckets sum to 7,376M against a
  #            filed total debt of 20,127M, so 63% of the debt is not shown.
  #   OTEX  year_1 and thereafter only; years 2-5 NEVER tagged in any year.
  #         -> no profile. Rendering the two ends alone would imply a schedule
  #            with a hole in it. The engine requires at least one middle year.
  #   SHOP  no debt ladder at all (it tags a LEASE ladder, which is not this).
  #
  # ifrs-full maps NOTHING here, and that is structural rather than an omission:
  # the IFRS maturity analysis is a liquidity-risk disclosure expressed with
  # axis/member DIMENSIONS, and the company-facts API exposes only
  # non-dimensional facts. Re-probed live 2026-08-05 — none of Cameco, BCE or
  # Suncor carries any maturity-analysis concept. Reaching it would require
  # dimensional-fact ingestion from Inline XBRL, an architecture change.

  debt_maturity_year_1:
    sources:
      - concept: LongTermDebtMaturitiesRepaymentsOfPrincipalInNextTwelveMonths

  debt_maturity_year_2:
    sources:
      - concept: LongTermDebtMaturitiesRepaymentsOfPrincipalInYearTwo

  debt_maturity_year_3:
    sources:
      - concept: LongTermDebtMaturitiesRepaymentsOfPrincipalInYearThree

  debt_maturity_year_4:
    sources:
      - concept: LongTermDebtMaturitiesRepaymentsOfPrincipalInYearFour

  debt_maturity_year_5:
    sources:
      - concept: LongTermDebtMaturitiesRepaymentsOfPrincipalInYearFive

  debt_maturity_thereafter:
    note: >-
      The bucket whose ABSENCE is load-bearing. Where it is missing the schedule
      is truncated and must be labelled so, never presented as the whole debt.
      Deliberately NOT sourced from LongTermDebtMaturitiesRepaymentsOfPrincipal
      RemainderOfFiscalYear, which OTEX uses as a near-term stub rather than a
      tail bucket.
    sources:
      - concept: LongTermDebtMaturitiesRepaymentsOfPrincipalAfterYearFive

  # --- Story 6.2: free-cash-flow operands (concepts_v8) ----------------------

  capex:
    non_negative: true
    note: >-
      Cash paid to acquire property, plant and equipment — the outflow subtracted
      from cash_from_operations to get free cash flow. Per-year coverage confirmed
      live 2026-08-07, bucketed by period_end against each issuer's recognized
      fiscal-year-end (OTEX's is June 30, not December): SHOP FY2015-2025, CP
      FY2008-2025, QSR FY2012-2025 from the primary tag, OTEX FY2007-2026 from the
      ProductiveAssets variant below.

      DELIBERATELY NOT MAPPED: CapitalExpendituresIncurredButNotYetPaid. It is an
      ACCRUAL disclosure — capex incurred but unpaid at the balance-sheet date —
      not cash capex, so including it would double-count against a cash-flow
      figure. The exclusion is load-bearing rather than theoretical: confirmed live
      that SHOP tags it for 8 years and QSR for 4. Pinned by
      tests/test_free_cash_flow_concepts.py.

      `non_negative: true` (v10): OTEX's own FY2009 10-K tagged this concept with
      a nonstandard negative sign for FY2007 and FY2009 — see this file's v10
      header note and otex_capex_sign_error_fy2007_fy2009 in
      engineering-findings.yaml. canonicalize.py takes abs(value) at selection
      time for any concept carrying this flag, applied BEFORE the ambiguity
      check so a same-magnitude sign disagreement (FY2008's -6,895,000 vs
      +6,895,000) is recognized as the same filed number rather than flagged
      unresolvable.
    sources:
      - concept: PaymentsToAcquirePropertyPlantAndEquipment
      - concept: PaymentsToAcquireProductiveAssets
        note: >-
          OTEX's variant, and the ONLY capex tag it uses — it has never tagged
          PaymentsToAcquirePropertyPlantAndEquipment in any year. Confirmed live
          2026-08-07: FY2007-2026, 20 years, its longest-covered concept. Checking
          only the common tag would report OTEX as having no capex at all, which is
          the "different filers use different variants" trap this file's header
          warns about.

  cash_and_equivalents:
    note: >-
      Unrestricted cash and cash equivalents, netted against debt to reach
      enterprise value. Confirmed live 2026-08-07: SHOP FY2014-2025, CP FY2007-2025,
      OTEX FY2006-2026 from the primary tag; QSR needs the fallback below.
    sources:
      - concept: CashAndCashEquivalentsAtCarryingValue
      - concept: CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents
        note: >-
          RESTRICTED-INCLUSIVE BY NAME, and admissible only because it was PROVEN
          equal to unrestricted cash for every filer that needs it — not assumed
          from the tag's name.

          QSR stopped tagging the plain concept after FY2018 and tags only this one
          for FY2019-2025, which are exactly the years a reverse DCF needs. It files
          BOTH in FY2016, FY2017 and FY2018, and they are identical to the dollar in
          all three (1,476M / 1,097M / 913M, difference exactly 0), so QSR carries no
          restricted cash and this tag IS its unrestricted cash. Same overlap-year
          technique that validated revenue - cogs against filers who file GrossProfit
          directly. QSR discloses no separate restricted-cash figure after FY2014, so
          subtracting it is not an option.

          THE PROOF IS FILER-SPECIFIC, NOT GENERAL. For a filer with real restricted
          cash this tag would overstate cash and understate enterprise value, which
          understates the implied growth rate — a silent error in the flattering
          direction. Guarded by
          test_free_cash_flow_concepts.py::test_cash_tags_agree_wherever_a_filer_files_both,
          which fails the day such a filer joins the universe rather than after.

          Story 12.3 (2026-09-01) excluded ZTS here (`excludes_issuers`) reasoning
          from the tag's NAME plus its own nonzero RestrictedCashCurrent
          ($6M/$5M/$2M at FY2017/2018/2019-end): the guard's overlap check only
          compares the two cash tags against EACH OTHER, so a real restricted-cash
          balance sitting outside this tag's actual reported scope would pass the
          guard undetected, and that exclusion never checked whether it was.

          v11 (zts_stale_reverse_dcf_cash_gap, 2026-09-02) checked it directly:
          this tag equals ZTS's own unrestricted-cash tag to the dollar in
          BOTH years they overlap (FY2017: 1,564,000,000 = 1,564,000,000; FY2018:
          1,602,000,000 = 1,602,000,000) — DESPITE nonzero RestrictedCashCurrent
          both years. That is the QSR proof's exact shape, not a different one: for
          ZTS specifically, this tag's REPORTED value does not include
          RestrictedCashCurrent — a scope quirk of how ZTS's own XBRL extension
          uses the concept, not the standard's typical composition — so it already
          IS unrestricted cash for ZTS, the same conclusion the QSR proof reaches by
          the same method. The prior session's exclusion was a reasonable caution
          that turned out, once actually checked, not to hold; removing it restores
          ZTS's cash_and_equivalents for FY2019-2025 (the primary tag itself
          stopped after FY2018), which had been silently freezing ZTS's ENTIRE
          reverse-DCF card at FY2017 data — a live, user-facing effect, not just a
          coverage gap. `excludes_issuers` remains available as a mechanism; it
          simply has zero live occupants again until the next filer disproves this
          tag for itself specifically.

  # --- Story 12.3: operands for the ebit_pbt_plus_interest derivation, extended to
  # us-gaap ------------------------------------------------------------------
  #
  # Not consumed by any model directly. Same shape as the ifrs-full block these
  # mirror (added D8, 2026-08-02): they exist so a filer with no operating-profit
  # line can still resolve `ebit` via the existing, taxonomy-blind derivation in
  # derivations_v5.yaml, rather than via a second reconstruction hardcoded for
  # us-gaap specifically.
  #
  # Confirmed live 2026-09-01: of the five us-gaap filers in the universe, only ZTS
  # lacks OperatingIncomeLoss (SHOP, CP, QSR, OTEX, CPB all tag it directly and read
  # ebit as filed — a derivation only fires when the primary concept is genuinely
  # absent, so this addition has ZERO effect on any filer but ZTS). ZTS also has no
  # discontinued-operations history in its EDGAR filings (no
  # IncomeLossFromDiscontinuedOperationsNetOfTax tag in any year; its disposal-group
  # tags are explicitly named NotDiscontinuedOperation), so its
  # continuing-operations-scoped pretax tag equals its total pretax income in every
  # year — the scope difference from ifrs-full:ProfitLossBeforeTax that Codex's
  # PR #106 review flagged is real as a DEFINITION mismatch but not as a NUMERIC one
  # for this filer, in this history.

  profit_before_tax:
    note: >-
      us-gaap has no single standard pretax-income tag the way ifrs-full's
      ProfitLossBeforeTax is — see us-gaap's own two-pretax-tag trap already
      recorded under long_term_debt's sibling concepts (Story 6.1 spike). ZTS
      tags IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItems
      NoncontrollingInterest for all 15 years, FY2011-2025, zero gaps — confirmed
      live 2026-09-01. NAMED AS A CONTINUING-OPERATIONS CONCEPT, unlike
      ifrs-full:ProfitLossBeforeTax, which is not scoped that way — numerically
      identical for ZTS only because ZTS has never reported a discontinued
      operation (see the block note above); a future filer using this source
      with real discontinued-operations activity would need its own check before
      being admitted, not assumed safe by analogy to ZTS.
    sources:
      - concept: IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest

  interest_expense:
    note: >-
      ZTS tags InterestExpense for all 15 years, FY2011-2025, zero gaps —
      confirmed live 2026-09-01, the plain common-usage tag with no variant
      trap found for this filer.
    sources:
      - concept: InterestExpense
