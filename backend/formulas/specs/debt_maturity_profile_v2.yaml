# ============================================================================
# THESISTRACE-AUTHORED PRESENTATION RULE — NOT AN ACADEMIC MODEL.
# ============================================================================
# This one is thinner than its siblings on purpose: it applies NO thresholds and
# NO bands, because it classifies nothing. It relays a filer's own published
# repayment schedule, labelled and ordered. The only judgments here are which
# buckets to show, what to call them, and when to say the schedule is truncated.
#
# `kind` is checked by the loader: this file is deliberately NOT loadable as a
# model formula spec, so it can never be mistaken for one.
#
# ---------------------------------------------------------------------------
# WHY v2 EXISTS (2026-08-05). v1 rendered a ONE-ROW "schedule" for OTEX in six
# fiscal years, under a note blaming only the missing after-year-five figure
# while years 2-5 were equally absent. Found by re-canonicalizing to concepts_v7
# and rendering the page against real facts.
#
# v1's rule was `requires_contiguous_from_year_one` alone. That rule had replaced
# an earlier "needs at least one middle year" rule during Story 5.7's code
# review, on the stated grounds that contiguity "subsumes it and closes the
# hole". It does not: a lone year-1 bucket is a contiguous prefix of length one,
# so it passes contiguity while the rule it replaced would have rejected it. The
# two rules disagree on exactly one input shape, and nothing tested that shape.
#
# v2 requires BOTH conditions. Contiguity still closes the interior-hole cases
# that motivated it; the middle-year requirement restores the floor. The
# behaviour change is confined to schedules of length one — every shape v1
# accepted with two or more contiguous buckets is unchanged.
#
# Recorded here rather than in a commit message because it is the second time
# this rule's boundary has moved, and the next reader needs to know that
# "contiguity" alone was tried and was insufficient.
# ---------------------------------------------------------------------------

kind: thesistrace_presentation_rule
authored_by: thesistrace
rule: debt_maturity_profile
spec_version: debt_maturity_profile_v2
supersedes: debt_maturity_profile_v1

description: >
  The year-by-year schedule of long-term debt repayments a filer publishes in
  its maturity-analysis note. Shown where it exists and omitted entirely where
  it does not — which is most of the universe, for structural reasons.

# THE LOAD-BEARING FIELD. This is a DIFFERENT MEASUREMENT from the near-term
# debt share's operands, and the two must never be mixed, summed, or presented
# as reconciling. It is stated here as machine-readable data rather than as a
# YAML comment because that exact mistake has now been made three times in this
# repository (D8's derivations_v2 `note`, Story 5.5's trajectory_v1 thresholds,
# and it was flagged again in this story's own dev notes). A comment is not a
# published field.
basis:
  measurement: undiscounted contractual principal scheduled for repayment
  contrasted_with: >
    near_term_debt and total_debt are balance-sheet carrying amounts, net of
    unamortized discount and issue costs.
  reconciles_to_total_debt: false
  evidence: >
    Verified live 2026-08-05 that even a COMPLETE ladder does not reconcile.
    QSR FY2023's six buckets sum to 13,043M against a filed LongTermDebt of
    12,921M; CP FY2023 sums to 23,133M against 22,494M. The gap is the
    discount/issue-cost difference, not a tagging error.
  consequence: >
    No consumer may present these buckets as a total, as a percentage of total
    debt, or as a breakdown of the near-term debt share. The first bucket and
    the near-term share are not the same figure — they differ in 11 of 15
    shared years for CP and 10 of 10 for OTEX.

# Ordered. The engine renders them in exactly this sequence.
buckets:
  debt_maturity_year_1: "Within 1 year"
  debt_maturity_year_2: "Year 2"
  debt_maturity_year_3: "Year 3"
  debt_maturity_year_4: "Year 4"
  debt_maturity_year_5: "Year 5"
  debt_maturity_thereafter: "After year 5"

# A schedule must run CONTIGUOUSLY from year one. Only the tail may be absent,
# and that case is reported as `truncated` rather than hidden. Every other shape
# would render as a complete schedule while silently omitting a bucket:
#   * OTEX tags year 1 and thereafter and never the years between (live 2026-08-05).
#   * CP FY2012 tags years 2-5 but no year 1, which would read as though nothing
#     at all falls due within twelve months.
#   * An upstream AD-3 `ambiguous_selection` can drop one bucket from an
#     otherwise well-covered filer-year, punching an invisible hole.
requires_contiguous_from_year_one: true

# ...AND it must reach at least year 2. Contiguity alone admits a schedule of
# length one, which is not a schedule: it is a single figure wearing the
# furniture of one. Live shapes this rejects, all OTEX, all previously rendered:
#   * FY2021-2025 and FY2011 — year 1 tagged, nothing else, because OTEX's
#     `thereafter` tag stops at FY2020. Six fiscal years in the current universe.
# Two further reasons beyond "one row is not a schedule":
#   * It duplicates the near-term debt share card sitting directly above it,
#     while showing a DIFFERENT number for what reads as the same thing (370.4M
#     undiscounted principal against 35.9M carrying amount for OTEX FY2025) —
#     the precise "why do these disagree?" confusion `attribution` below exists
#     to prevent, with none of the surrounding context that defuses it.
#   * The truncation message below can only name the tail, so a length-one
#     schedule is annotated with a reason that is true but radically incomplete.
requires_at_least_one_middle_year: true

truncation:
  when: the "After year 5" bucket is absent for that fiscal year
  # Not a cosmetic caveat. CP FY2010-2021 is this case, and FY2021's visible
  # buckets sum to 7,376M against a filed total debt of 20,127M — 63% of the
  # debt is outside the schedule shown.
  #
  # KNOWN LIMITATION, narrowed but not eliminated by v2. This message names the
  # tail specifically, but it fires whenever the tail is absent — including
  # shapes where interior years are missing too. v2 removes the worst case
  # (length one, where four buckets are missing and only one is named). A
  # length-two or -three schedule can still under-report what is absent. Left as
  # a known limitation rather than fixed here, because making the message name
  # the actual first-missing bucket is a copy change with its own review.
  message: >
    This filer did not publish a figure for repayments after year five in this
    year, so the schedule below is only part of its debt.

# Absence here is NOT the AD-16 `insufficient_data` case, and the distinction is
# deliberate. AD-16 governs a signal inside a model that was ATTEMPTED, where the
# absence explains why a score did not compute. This is supplementary disclosure
# detail: five of seven filers cannot produce it for structural reasons, so
# rendering a "missing" affordance would assert a deficiency that does not exist.
absence:
  render: nothing
  # Deliberately does NOT claim every absent case is the filer's doing. For four
  # of the six it is; for OTEX it is not — OTEX publishes a partial ladder and
  # ThesisTrace withholds it, because a partial schedule misrepresents what is
  # owed. Under v2 that withholding covers BOTH of OTEX's shapes: the two-ended
  # ladder of FY2012-2020 (contiguity) and the lone year-1 bucket of FY2011 and
  # FY2021-2025 (middle-year floor). Asserting "the company does not publish
  # one" would be false for that filer, the same class of error as Story 5.6's
  # "this filer does not report the figures this needs", which was true for BCE
  # and false for SHOP.
  rationale: >
    Most companies here do not publish a year-by-year repayment schedule that can
    be read from this data source — either because they report under IFRS, where
    the disclosure is dimensional rather than machine-readable, or because they
    have no term debt to schedule. In a few cases a company publishes only part of
    a schedule, and a partial schedule is not shown because it would understate
    what is owed. Showing an empty or "missing" panel would imply a gap in the
    company's reporting that is usually not there.

# Displayed verbatim wherever the profile appears. It has to defuse TWO
# misreadings, not one, and the second was only visible once the panel was
# rendered next to the near-term share (browser check, 2026-08-05):
#
#   CP FY2023 shows "3.1B of 22.5B" in the share card and "3.13B" as the first
#   row of the schedule directly beneath it. Those are different measurements —
#   3,143M carrying amount vs 3,133M undiscounted principal — but at display
#   precision they read as the same number restated, which is exactly the
#   "why do these disagree?" confusion AC 5 exists to prevent.
attribution: >
  This is the company's own published repayment schedule, relayed as filed. It
  shows undiscounted contractual principal, so it does not add up to the total
  debt above, and its first row is not the same measurement as the near-term
  debt share above — that one is a balance-sheet carrying amount.
