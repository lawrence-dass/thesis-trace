# Beneish M-Score (8-variable model) — versioned spec (AD-5).
# Source: Beneish, M. (1999) "The Detection of Earnings Manipulation",
# Financial Analysts Journal.
model: beneish
formula_version: beneish_v1
description: >
  M = -4.84 + 0.920*DSRI + 0.528*GMI + 0.404*AQI + 0.892*SGI + 0.115*DEPI
      - 0.172*SGAI + 4.679*TATA - 0.327*LVGI, over years t and t-1.
  M > -1.78 flags likely earnings manipulation (Beneish's published cutoff).

rounding:
  mode: ROUND_HALF_EVEN
  ratio_places: 6

missing_data_policy: insufficient_data
divide_by_zero_policy: insufficient_data

inputs:
  - receivables
  - revenue
  - cogs
  - current_assets
  - ppe_net
  - total_assets
  - depreciation
  - sga
  - current_liabilities
  - long_term_debt
  - net_income
  - cash_from_operations
  # Not a term in Beneish's equation — GMI computes gross margin from revenue and
  # cogs directly. Listed because the gross_margin_validation guard below reads it,
  # so it is genuinely consumed by this model and must be visible to the
  # comparability check and on the methodology page.
  - gross_profit

constant: -4.84
coefficients:
  dsri: 0.920
  gmi: 0.528
  aqi: 0.404
  sgi: 0.892
  depi: 0.115
  sgai: -0.172
  tata: 4.679
  lvgi: -0.327

signals:
  - {key: dsri, description: Days Sales in Receivables Index}
  - {key: gmi, description: Gross Margin Index}
  - {key: aqi, description: Asset Quality Index}
  - {key: sgi, description: Sales Growth Index}
  - {key: depi, description: Depreciation Index}
  - {key: sgai, description: SG&A Index}
  - {key: tata, description: Total Accruals to Total Assets}
  - {key: lvgi, description: Leverage Index}

threshold:
  manipulation_above: -1.78
  citation: "Beneish (1999), Financial Analysts Journal"

bands:
  citation: "Beneish (1999), Financial Analysts Journal"
  classes:
    - label: Manipulation risk flagged
      above: -1.78
    - label: No manipulation flag
      below: -1.78

# --- ThesisTrace presentation guard — NOT part of Beneish (1999) -------------
# Every Beneish index is a year-over-year ratio centred near 1.0 for a company
# whose fundamentals are stable. When a denominator approaches zero the index
# explodes and the aggregate stops being a manipulation signal: Cameco FY2021's
# gross margin fell from 5.91% to 0.13% after the Cigar Lake suspension, giving
# GMI = 45.1, which alone contributes ~+23.8 to M and pushes it to +20.84
# against a -1.78 threshold. Every input there is a correctly-mapped, filed
# value and the arithmetic is right — what fails is the interpretation, because
# the input is far outside anything the model was fitted on.
#
# This does NOT alter the score. The computed M is still stored and shown
# exactly as calculated; the run is only annotated computed_with_caveat so the
# UI and the explanation can say the input is out of range. The bound below is
# ThesisTrace's own conservative disclosure threshold, chosen because a ratio of
# 10 means a ten-fold year-over-year change — it is not a Beneish figure and is
# deliberately recorded here, versioned with the spec, rather than hidden in code.
# --- ThesisTrace presentation guard — NOT part of Beneish (1999) -------------
# GMI compares gross margin across two years, and Beneish defines gross margin as
# (Sales - COGS) / Sales. That subtraction is only a gross margin when COGS covers
# the cost base matching the revenue in the denominator, and for some filers it
# does not:
#
#   * QSR is primarily a franchisor. `Revenues` bundles franchise royalties,
#     property income and advertising revenue with supply-chain and
#     company-restaurant sales, while CostOfGoodsAndServicesSold covers only the
#     latter — 49% of total costs. Verified live 2026-08-02.
#   * Suncor reports expenses by nature (IAS 1), so its only cost-of-sales tag
#     covers inventories alone, excluding service and labour cost.
#
# Both are a PARTIAL cost base against a FULL revenue base, from the revenue and
# cost sides respectively. The formula stays exactly as Beneish specified — the
# input is what is unvalidated, so the M-score is annotated, never altered.
#
# The test is deliberately filer-level rather than year-level: a filer that files
# a gross profit line anywhere in its history (or, under IFRS, one that can have it
# validly derived) has demonstrated the subtraction is meaningful for its income
# statement. SHOP and OTEX both file it AND revenue - cogs reproduces it to the
# dollar, so they are validated even in years the tag itself is absent. QSR and
# Suncor never file it at all, which is the filer signalling the subtraction is not
# meaningful rather than an omission to fill in.
#
# Limitation, stated rather than hidden: validation once is treated as validation
# throughout, so a filer that restructured after last filing a gross profit line
# would not be re-flagged. Accepted because the cases this catches are structural
# (business model / presentation basis), not year-specific.
gross_margin_validation:
  require_gross_profit_concept: true
  caveat_reason: >-
    This company does not report a gross profit line, and its cost of sales covers
    only part of the revenue shown alongside it, so the gross margin behind this
    score is an approximation rather than a reported figure. The margin trend it
    implies can move with revenue mix rather than with profitability.

calibration:
  index_abs_max: 10.0
  caveat_reason: >-
    At least one Beneish index is far outside its normal range (a year-over-year
    ratio near 1.0), so the M-score is dominated by an extreme input rather than
    by a manipulation signal. This usually means a ratio denominator — most often
    gross margin — approached zero.
