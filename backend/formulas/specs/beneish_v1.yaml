# Beneish M-Score (8-variable model) — versioned spec (AD-5).
# Source: Beneish, M. (1999) "The Detection of Earnings Manipulation",
# Financial Analysts Journal.
model: beneish
formula_version: beneish_v1
description: >
  M = -4.84 + 0.920*DSRI + 0.528*GMI + 0.404*AQI + 0.892*SGI + 0.115*DEPI
      - 0.172*SGAI + 4.679*TATA - 0.327*LVGI, over years t and t-1.
  M > -1.78 flags likely earnings manipulation (Beneish's published cutoff).

rounding:
  mode: ROUND_HALF_EVEN
  ratio_places: 6

missing_data_policy: insufficient_data
divide_by_zero_policy: insufficient_data

inputs:
  - receivables
  - revenue
  - cogs
  - current_assets
  - ppe_net
  - total_assets
  - depreciation
  - sga
  - current_liabilities
  - long_term_debt
  - net_income
  - cash_from_operations

constant: -4.84
coefficients:
  dsri: 0.920
  gmi: 0.528
  aqi: 0.404
  sgi: 0.892
  depi: 0.115
  sgai: -0.172
  tata: 4.679
  lvgi: -0.327

signals:
  - {key: dsri, description: Days Sales in Receivables Index}
  - {key: gmi, description: Gross Margin Index}
  - {key: aqi, description: Asset Quality Index}
  - {key: sgi, description: Sales Growth Index}
  - {key: depi, description: Depreciation Index}
  - {key: sgai, description: SG&A Index}
  - {key: tata, description: Total Accruals to Total Assets}
  - {key: lvgi, description: Leverage Index}

threshold:
  manipulation_above: -1.78
  citation: "Beneish (1999), Financial Analysts Journal"

bands:
  citation: "Beneish (1999), Financial Analysts Journal"
  classes:
    - label: Manipulation risk flagged
      above: -1.78
    - label: No manipulation flag
      below: -1.78

# --- ThesisTrace presentation guard — NOT part of Beneish (1999) -------------
# Every Beneish index is a year-over-year ratio centred near 1.0 for a company
# whose fundamentals are stable. When a denominator approaches zero the index
# explodes and the aggregate stops being a manipulation signal: Cameco FY2021's
# gross margin fell from 5.91% to 0.13% after the Cigar Lake suspension, giving
# GMI = 45.1, which alone contributes ~+23.8 to M and pushes it to +20.84
# against a -1.78 threshold. Every input there is a correctly-mapped, filed
# value and the arithmetic is right — what fails is the interpretation, because
# the input is far outside anything the model was fitted on.
#
# This does NOT alter the score. The computed M is still stored and shown
# exactly as calculated; the run is only annotated computed_with_caveat so the
# UI and the explanation can say the input is out of range. The bound below is
# ThesisTrace's own conservative disclosure threshold, chosen because a ratio of
# 10 means a ten-fold year-over-year change — it is not a Beneish figure and is
# deliberately recorded here, versioned with the spec, rather than hidden in code.
calibration:
  index_abs_max: 10.0
  caveat_reason: >-
    At least one Beneish index is far outside its normal range (a year-over-year
    ratio near 1.0), so the M-score is dominated by an extreme input rather than
    by a manipulation signal. This usually means a ratio denominator — most often
    gross margin — approached zero.
