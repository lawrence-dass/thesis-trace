    - "BCE's four live derived concepts (gross_profit, ebit, cash_and_equivalents, total_debt) render correctly: the Fundamentals waterfall's gross_profit bar is FILED (matches revenue - cogs exactly, as in every full-coverage filer), while Financial Health signal citations for the other three correctly show the 'derived' badge and a working EDGAR link when expanded."
