# Work completed after Epic 4 that no epic owns, tracked here so it is not lost.
post_epic_work:
  - item: "Verdict selection bug — get_company_overview picked each model's latest EXISTING run regardless of whether it resolved a value, hiding real historical Beneish scores for QSR/OTEX"
    status: done
    evidence: "PR #18; PR #19 additionally explains genuinely-insufficient scores instead of showing a bare dash."
  - item: "Architecture diagram suite + in-app /architecture page"
    status: done
    evidence: "PRs #21, #23 — docs/diagrams/ (3 diagrams, verified by rendering through mermaid-cli) read at build time by frontend/app/architecture/page.tsx, so docs and app cannot drift."
  - item: "validation/checks.run_validation wired into pipeline/run.py and made idempotent"
    status: done
    evidence: "PR #22. The stage was implemented and tested but never invoked, so the spine's ingest -> canonicalize -> validate -> score order skipped validate in production. Idempotency was required, not optional: the daily cron would otherwise append a duplicate data_quality_issues row every night, and the read API surfaces those."
  - item: "test_llm_rewrite_disabled_returns_text_unchanged depended on ambient environment"
    status: done
    evidence: "PR #24 — passed in CI while failing for anyone with a real .env sourced. Both the process env and the .env-file fallback are now pinned with monkeypatch."
  - item: "Persist the reverse DCF in the pipeline — the read path currently computes it, violating AD-1"
    status: done
    raised: 2026-08-12
    closed: 2026-08-13
    evidence: >
      Two tables (reverse_dcf_runs + reverse_dcf_cells), migration b43d7bd6fe33,
      backend/valuation/store.py, a stage in run_issuer, and repository.py:287 now
      calling load_reverse_dcf. All three required verifications ran:

      (1) NO SOLVER CALL ON READ — test_reverse_dcf_store.py breaks `compute` in all
      three modules that bind it and asserts the overview still renders its figures.
      A second test runs the OLD read path under the same patch and requires it to
      raise, so the guard cannot go inert the way the OTEX golden entry did.

      (2) LIVE FIGURES UNCHANGED — CP still reads 37.2% at FY2025. Verified harder
      than asked: the FULL serialized reverse-DCF block was dumped for all 7 filers
      before and after and diffed. Zero structural or string differences (no field,
      reason, date or source moved); 197 numeric deltas, all rates, largest 4.96e-11
      against a solver tolerance of 1e-7.

      (3) DOUBLE RUN LEAVES ONE ROW — asserted in the store tests, again end-to-end
      through run_issuer in test_pipeline.py, and confirmed against the real dev
      store: 7 issuers, 7 run rows, 175 cell rows after two passes.

      Suite 313 -> 323. Query-count guard moved +1 (fixed cost, slope unchanged at
      16) and the constant was updated with the reason, as that test demands.
    deviation_from_scope: >
      The scope said "a table"; this is TWO. The 35 grid cells are their own table
      rather than a JSONB column because an implied growth rate is a financial figure
      and AD-15 requires NUMERIC — and because "meaning parked in a blob" is this
      repo's most repeated failure mode. Mirrors score_runs/score_results exactly.
      Rate columns are NUMERIC(18,10), not the usual NUMERIC(28,6): the solver's
      tolerance is 1e-7, so a money-shaped column would have rounded the answer
      coarser than the bisection that produced it.
    consequence_to_know: >
      THE REVERSE DCF NOW DISAPPEARS FROM A COMPANY PAGE UNTIL THE PIPELINE HAS RUN
      for that issuer. That is correct CQRS behaviour and is asserted deliberately
      (an unmaterialized issuer renders nothing rather than solving on the fly), but
      it means a fresh database shows no reverse DCF until the 06:00 cron completes.
      Nothing is deployed yet, so this cost nothing here; the dev store was
      materialized by hand. Worth remembering at first deploy.
    original_why: >

      AD-1 is a CQRS rule: "all computation runs in the scheduled batch pipeline; the
      read path only queries materialized Postgres and never computes a score", and
      "no request can trigger scoring, ingestion, or RECOMPUTATION". Nothing about the
      reverse DCF is persisted — no table, and reverse_dcf_for_issuer has exactly one
      caller, api/repository.py:287, on the read path. Every page load re-solves the
      DCF and all 35 grid cells.
    scope: >
      A table keyed (issuer_cik, fiscal_year, spec_version) holding the result, its
      operands and the grid; an alembic migration; a stage in pipeline/run.py's
      run_issuer after scoring; and repository.get_company_overview reading the stored
      row instead of calling the solver.
    must_not_forget: >
      The write MUST be an upsert on that key. run_validation is the precedent: it was
      implemented, tested and then appended a duplicate row every night once the cron
      ran. Story 6.4's AC already says stored, so this closes an AC/code disagreement
      rather than adding a new promise.
    verify: >
      A test asserting the read path issues NO solver call (the whole point), the
      existing browser-verified figures are unchanged (CP 37.2% FY2025 live), and a
      double pipeline run leaves exactly one row.


