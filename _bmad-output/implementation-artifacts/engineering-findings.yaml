    concept resolution independently re-queried from canonical_facts and
    matches Story 12.1's predictions exactly (see verification table below).
    A genuine architecture gap surfaced along the way: the mapping engine had
    no way to say "this fallback source is safe for filer A but not filer B"
    — needed because ZTS's cash_and_equivalents restricted fallback is the
    SAME global rule QSR's proof relies on. Added `excludes_issuers` as a new,
    minimal capability rather than working around it.
  mapping_spec_changes:
    us-gaap_v9.yaml (from us-gaap_v8.yaml):
      - "revenue: added SalesRevenueNet as a fallback source, ZTS-only in practice (confirmed live 2026-09-01 no other ingested filer tags it) — exact dollar match against Revenues in both overlap years (FY2016 $4,888M, FY2017 $5,307M). CPB's SalesRevenueGoodsNet checked and NOT added (+35.17%/+31.29% disagreement, likely a continuing-vs-total-operations basis difference — see the concept note)."
      - "profit_before_tax / interest_expense: NEW concepts for us-gaap (previously ifrs-full only). ZTS's IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest and InterestExpense, both FY2011-2025 with zero gaps. Feeds the existing ebit_pbt_plus_interest derivation, which was us-gaap-unreachable before this version despite being taxonomy-blind by construction."
      - "cash_and_equivalents: added `excludes_issuers: [\"0001555280\"]` to the CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents source — the QSR-proof fallback that would otherwise silently overstate ZTS's cash by the amount of its real, filed restricted cash ($5-6M) for FY2018-2025. First use of the new excludes_issuers mechanism."
    derivations_v5.yaml (from derivations_v4.yaml):
      - "ebit_pbt_plus_interest's rationale field (published verbatim on /methodology) reworded from IFRS-specific framing (\"IFRS does not require...\") to taxonomy-neutral language, now that us-gaap_v9 gives it a real us-gaap trigger (ZTS). The rule's logic is unchanged — taxonomy-blind by construction — only the published prose describing it moved."
    registry.yaml:
      - "mapping_version: concepts_v9 -> concepts_v10. taxonomies.us-gaap: us-gaap_v8 -> us-gaap_v9. derivations: derivations_v4 -> derivations_v5. ifrs-full untouched (stays ifrs-full_v4)."
  engine_change:
    title: "Added excludes_issuers to MappingRule — a genuine capability gap, not a workaround"
    detail: >
      The mapping engine (canonicalization/mappings/engine.py,
      canonicalization/canonicalize.py) had no concept of per-issuer scoping:
      every rule is keyed purely by (taxonomy, source_concept) and applies to
      any issuer of that taxonomy. This was fine until now because every prior
      "not comparable" case (SHOP's convertible debt, Suncor's by-nature cogs)
      used like_for_like/mismatch_reason — ANNOTATE, not suppress; the value
      was still correct to use, just not comparable to another filer's. ZTS's
      restricted-cash situation is different in kind: the value would be
      WRONG for ZTS specifically (overstated cash) while remaining PROVEN
      RIGHT for QSR under the exact same source rule. Annotating a wrong value
      is not the same fix as never resolving it (AD-16). Added
      `excludes_issuers: tuple[str, ...]` to MappingRule, threaded through
      load_mapping_spec() as a new (taxonomy, concept) -> frozenset(CIK) dict
      (SOURCE_EXCLUDED_ISSUERS), and checked in canonicalize.py's candidate-
      grouping loop before a raw_fact is admitted as a candidate for that
      issuer. Declarative — a spec edit, not a per-filer code branch — matching
      the existing "adding a fallback tag is a spec edit" philosophy this
      engine is built on.
    verification:
      - "load_mapping_spec() loads concepts_v10 cleanly: 87 rules, zero duplicate-source errors, zero like_for_like validation errors."
      - "SOURCE_EXCLUDED_ISSUERS resolves to exactly {(us-gaap, CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents): {ZTS's CIK}} — the one entry added."
