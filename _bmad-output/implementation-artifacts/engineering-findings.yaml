# sprint-status.yaml from a template, and its preservation rule covers
# `action_items` alone. So when a story turned up a finding that was not
# derivable from epics.md — a live-data verification, a coverage gap, a
# mapping decision — the tracker was the only file that was both read every
# session AND explicitly protected from the regenerator by a test. Findings
