      what: >
        BCE's Piotroski FY2025 card (score 6, 'Middle') rendered an expanded
        explanation reading '...for FY2015 is 0.0 — classified Weak.' — a
        different fiscal year's figures entirely, contradicting the card's
        own header. Root cause: `build_explanations` already produced one
