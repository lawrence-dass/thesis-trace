        The new fail-closed ValueError has no error isolation in the cron loop that
        will eventually call it for every filer, including the 7 already in production
      detail: >
        pipeline/run.py's main() (the live Render Cron Job entry point) iterates
        PHASE1_UNIVERSE with no try/except around each entry's ingest+canonicalize+
        score call. Before this story, parse_company_facts never raised for a data
        shape problem — it always resolved SOME (fy, end) candidate, possibly a
        wrong one, but never an exception. The new fail-closed behavior is the
        correct choice for the parser itself (AD-16: never silently guess), but it
        turns a data-quality problem for ONE filer into an unhandled exception that
        would silently stop every filer AFTER it in tuple order for the whole night,
        with no isolation. CPB/ZTS are not yet in PHASE1_UNIVERSE (Story 12.5's job),
        so tonight's cron is unaffected today, but Story 12.5 adds them to this exact
        loop next.
      fix: >-
        Wrapped each PHASE1_UNIVERSE entry's processing in try/except in
        pipeline/run.py's main(), printing "FAIL {ticker}: {exc}" and continuing to
        the next entry rather than aborting the run. main() is `# pragma: no cover —
        live path, gated`, so this has no existing test to break; verified by
        reading the full diff and re-running the full suite (395 passed, 1 skipped,
        unchanged).
      verified: 2026-09-01

story_12_3_canonicalization:
  status: done
  resolved: 2026-09-01
  question: >
    Do CPB's and ZTS's raw facts canonicalize and validate cleanly under the
    existing us-gaap mapping spec, with Story 12.1's three actionable findings
    (ZTS revenue fallback, ZTS ebit reconstruction, ZTS restricted-cash
