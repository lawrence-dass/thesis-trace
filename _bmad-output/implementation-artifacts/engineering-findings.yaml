# TWO OPEN ITEMS FROM STORY 6.5, both recorded rather than silently accepted.
story_6_5_open_deviations:
  status: done
  resolved: 2026-08-14
  evidence: >
    BOTH deviations are closed, each by a PR merged 2026-08-14.

    (1) sensitivity_grid_is_not_stored — closed by PR #69, which moved the whole
    reverse DCF onto the write path (AD-1) and added the two tables and migration
    the `why_not_fixed_here` note said it would need. `reverse_dcf_cells` now holds
    175 stored cells across 5 runs (35 per run — exactly the 35 solves a read used
    to trigger); the 2 filers with no cells are SHOP and Suncor, both correctly
    insufficient_data. It took the `recommendation`'s first branch: persist it,
    rather than amend 6.4's AC down to computed-on-read.

    (2) overview_n_plus_1_now_measured — closed by PR #73, which batched the
    query fan-out (486 -> 8 for OTEX). Pinned by
    backend/tests/test_overview_query_count.py::test_overview_query_count_does_not_grow_with_history,
    so the cost can no longer regrow silently with a filer's history.
  found: 2026-08-11
  sensitivity_grid_is_not_stored:
    ac_said: >
      Story 6.4's AC: "the grid is computed deterministically in Python and STORED,
      so a read cannot trigger computation (AD-1)."
    what_shipped: >
      The grid is computed on READ, not stored. Story 6.4 delivered the computation
      and not the persistence its own AC required, and Story 6.5 consumes it that way.
    measured_cost: >
      2.9 ms per 35-cell grid; ~20 ms of CPU for a 7-filer compare page. Cheap, but
      cost is not the argument — the AC is explicit and AD-1 is architectural.
    why_not_fixed_here: >
      Storing it needs a table, a migration and a pipeline stage. A pipeline writer
      needs an idempotency key or the daily cron accumulates a row per night — the
      documented anti-pattern that bit run_validation. That is its own story, not a
      side-effect of the read API.
    recommendation: >
      Either persist it in a dedicated story before Epic 6 closes, or amend 6.4's AC
      to say computed-on-read with the measured cost recorded. Do not leave the AC
      and the code disagreeing — that is the exact defect pattern this repo keeps
      finding.
    CORRECTION_2026_08_12: >
      THE "AMEND THE AC" HALF OF THAT RECOMMENDATION WAS WRONG, and the entry above
      also understates the problem. Both were corrected after actually reading AD-1
      rather than reasoning about its purpose.

      AD-1 is a CQRS STRUCTURAL RULE, not a reproducibility one. epics.md line 60:
      "all computation runs in the scheduled batch pipeline; the read path only
      queries materialized Postgres and never computes a score". Line 614: "no
      request can trigger scoring, ingestion, or RECOMPUTATION". A versioned spec
      making the result reproducible does not satisfy that — the rule is about WHERE
      computation happens, so amending 6.4's AC would have written a CQRS violation
      into the spec instead of fixing it.

      AND IT IS BROADER THAN THE GRID. Nothing about the reverse DCF is persisted at
      all: there is no table, and `reverse_dcf_for_issuer` has exactly ONE caller —
      `api/repository.py:287`, on the read path. The pipeline never calls it. So a
      page load re-solves the DCF *and* all 35 grid cells, not just the grid.

      Correct action: persist the whole capability from the pipeline and have the
      read path query it. Needs a table, a migration, a pipeline stage, and an
      idempotency key on (issuer_cik, fiscal_year, spec_version) or the nightly cron
      accumulates a row per night — the anti-pattern that bit `run_validation`.
    RESOLVED_2026_08_13: >
      DONE. See post_epic_work "Persist the reverse DCF in the pipeline" for the full
      evidence. Story 6.4's AC and the code now agree: the grid IS stored, along with
      the rest of the reverse DCF, and the read path only queries it.

      One thing found while doing it that was not in the diagnosis: `sensitivity.py`'s
      module docstring ALREADY claimed "Computed deterministically in Python on the
      write path (AD-1) — a read never triggers 35 solves". That was false when
      written and stayed false through two stories. It is true now, and no edit was
      needed to make it true — which is the tell. Fifth instance of this repo's most
      repeated failure: documentation describing the intent correctly and the
      implementation incorrectly, with nothing connecting the two. The AC said
      "stored", the docstring said "write path", and the code did neither.
  overview_n_plus_1_now_measured:
    finding: >
      Risk-assessment finding 3.10 is REAL and now measured rather than assumed:
      get_company_overview issues 484 queries for OTEX (20 fiscal years), 343 for CP
      (13) and 100 for SHOP (5). Query count scales linearly with history.
    story_6_5_contribution: >
      +2 to +3 queries, FLAT — 486 / 346 / 102 with the reverse DCF wired in. The
      additions are one filing lookup, one market price and one FX rate for a single
      fiscal year. Story 6.5 does not add an N+1; it inherits one.
    recommendation: >
      The risk assessment's own suggestion still stands and is now justified by
      numbers: add a query-count test against a long-history issuer, then batch the
      per-run and per-signal loads. Belongs in Track P, not in Epic 6.
    guard_landed: >
      2026-08-12 — the FIRST half is done: backend/tests/test_overview_query_count.py
      pins the cost so it cannot move silently while the batching waits. The batching
      itself is still deferred to Track P and is unchanged by this.

      It asserts the per-year SLOPE as well as the totals, which matters more: an
      exact total alone would still pass if someone made each year costlier while
      trimming the fixed prelude. Measured on a synthetic issuer, 36 queries for 2
      fiscal years and 100 for 6 — a constant 16 per year.

      Those are NOT the live figures and are not meant to be. The fixture gives each
      run 3 signals where the real models carry 5-9, and a live issuer also has debt,
      maturity, market-price and reverse-DCF reads on top; 484-for-OTEX and
      100-for-six-synthetic-years measure the same defect at different scales. What
      transfers is the shape: cost per fiscal year is constant and non-zero.


# Found 2026-08-11 while building Story 6.3's solver, by running it over real data
# rather than fixtures. Not a 6.3 defect — the solver is correct; this is a property
# of an FCF-based DCF that the universe makes visible.
reverse_dcf_capital_intensity_distortion:
  status: done
  found: 2026-08-11
  found_by: "Story 6.3 — first run of the solver against real concepts_v8 facts"
  finding: >
    The two capital-intensive filers that resolve are the two extremes, and the
    separation is clean: CP 37.2% and Cameco 36.8% implied growth, against OTEX 9.7%
    and QSR 17.0%. Their ACTUAL revenue CAGRs run the other way — CP 7.8%, Cameco
    4.1%, OTEX 12.8%, QSR 12.8% — so the filers implying the most growth are the ones
    that have delivered the least.
  mechanism: >
    Free cash flow is cash_from_operations - capex. Heavy capex depresses the
    numerator, so a smaller stream must be grown harder to reach the same enterprise
    value. It is arithmetic, not a bug.
  same_shape_as: >
    D6 already recorded this distortion for Altman, whose X3 and X5 are similarly
    depressed by a large asset base — which is why `issuers.is_capital_intensive`
    already exists. Story 6.3 reuses that flag rather than introducing a second
    notion of capital intensity.
  decision: >
    ANNOTATE, DO NOT CORRECT. Adjusting for it would mean ThesisTrace inventing a
    normalised capex — originating a figure, which the deterministic boundary forbids
    for our own code as much as for the LLM. A caveat is attached instead, with the
    reason stored as data (reverse_dcf_v1.yaml `caveats`), and a test asserts the
    caveat never alters the value.
  open_question_for_story_6_6: >
    Whether a caveat is sufficient presentation, or whether a capital-intensive
    filer's implied growth should be visually de-emphasised relative to a
    non-intensive one. That is a display decision, not a computation one.
  partly_answered_by_story_6_4: >
    The sensitivity band narrows this question but does not close it. Real bands at
    concepts_v8, FY2025: CP 16.4-51.6%, Cameco 16.0-51.1%, QSR -0.4-29.0%, OTEX
    -6.5-20.7%, all 35/35 cells resolved. Every band is ~30 percentage points wide
    and two CROSS ZERO, so leading with the range rather than the point figure
    already stops the capital-intensive filers reading as precise. What remains for
    6.6 is whether the caveat needs visual weight beyond that.
  resolved: 2026-08-21
  resolution_of_the_display_question: >-
    CLOSED. The open question was whether a capital-intensive filer's implied growth
    needs visual de-emphasis BEYOND the sensitivity band. Story 6.6 shipped without
    adding any, and the band is the answer: verified in the browser 2026-08-21 that
    CP leads with "37.2%" beside "achieved 7.8%" and a 16.4-51.6% range, so the point
    figure never reads as precise. No further weight is warranted, and adding some
    would be ThesisTrace editorialising a figure it computed correctly. This entry
    stayed `open` for ten days after the question was in fact settled by shipping —
    the same drift as the four Epic-4 action items reconciled 2026-07-29.
  correction_to_story_6_6: >-
    Story 6.6 recorded that the capital-intensity caveat rendering on Suncor's card
    was acceptable because "the caveat arguably explains the absence — its reason is
    'no free cash flow', which is what capital intensity consumes". THAT REASONING IS
    WRONG, checked live 2026-08-21. Suncor reports 12.3-16.0bn of cash from
    operations and tags NO capex concept at all, so its free cash flow is missing an
    OPERAND, not consumed by one. The caveat described a mechanism that had not
    occurred, above a card reading "Insufficient data". Fixed by gating caveats on
    `showsCaveats`, which reuses the same `hasNoFigure` predicate the card body uses
    so the two cannot disagree — the fault compactAmount carried. Presentation only
    (AD-8): the caveat data is untouched and still travels with every computed run.
    Both sides of the boundary were verified in the browser — SU loses it, CP keeps
    it — and pinned by five tests in ReverseDcf.test.ts, confirmed to fail against
    the pre-fix behaviour.



# Found 2026-08-06 while running the Epic 6 spike. Not a product defect — a dev
# ENVIRONMENT gap that will mislead any session that reasons from the local DB.
shop_local_history_is_not_edgar_coverage:
  status: done
  resolved: 2026-08-14
  evidence: >
    Fixed by the full-universe pipeline run of 2026-08-14, which re-ingested every
    filer from live EDGAR. SHOP now holds 12 filings covering FY2016-2025 (was 4,
    covering FY2024-2025 only), matching what live company-facts always carried.
    Verified against the dev store after the run. The `fix` below predicted this
    would need no decision, and it did not — it fell out of a routine live run.
    The `why_it_matters` warning still stands as a rule: a coverage question
    answered from local raw_facts rather than EDGAR is unreliable, which is how
    the Epic 6 spike's first pass reached a false conclusion about SHOP.
  found: 2026-08-06
  issue: >
    The local dev DB holds 4 SHOP filings covering FY2024-2025, against 9-20 filings
    for every other filer. Live company-facts shows SHOP actually carries FY2016-2025
    for capex, cash, tax expense, operating income, D&A and CFO. SHOP was the first
    filer ingested (Story 1.3) and its local history was never backfilled.
  why_it_matters: >
    The Epic 6 spike's first pass concluded SHOP had 2 years of coverage for
    everything and would be the second filer unable to support a reverse DCF. That
    was false, and it came from reading the dev DB rather than EDGAR. Any coverage
    question answered from local raw_facts is unreliable for SHOP specifically.
  fix: >
    Re-ingest SHOP from live EDGAR (CIK 0001594805). Cheap and needs no decision —
    run_issuer is idempotent and canonicalize is scoped per mapping_version. Not done
    here because it perturbs a hand-verified golden filer, so it wants its own change
    with a golden re-verification pass.
  do_not_confuse_with: >
    shop_convertible_debt_unmapped, which is a genuine MAPPING decision about
    convertible notes. This one is purely an ingestion gap in one environment.


story_6_1_reverse_dcf_coverage_spike:
  status: done
  resolved: 2026-08-06
  question: >
    Can free cash flow, enterprise value and an effective tax rate be assembled
    from EDGAR company-facts for all seven universe filers?
  verdict: >
    YES for 6 of 7. Suncor cannot, and should read insufficient_data rather than a
    degraded estimate. Requires three NEW canonical concepts plus one extension,
    i.e. a MAPPING_VERSION bump to concepts_v8.
  method_note: >
    Ran against ingested raw_facts for six filers and LIVE company-facts for SHOP.
    raw_facts is a valid source here for the same reason it was for Story 5.1 — it
    stores unmapped tags, which is how the maturity ladder was found before it was
    mapped. SHOP needed the live check because its local history is an ingestion
    artifact, not an EDGAR limit (see shop_local_history_is_not_edgar_coverage).
  missing_canonical_concepts:
    - concept: capex
      coverage: "6 of 7"
      note: >
        us-gaap PaymentsToAcquirePropertyPlantAndEquipment (CP FY2015-2025, QSR
        FY2014-2025, SHOP FY2016-2025 live); OTEX uses PaymentsToAcquireProductive
        Assets instead (FY2009-2025); ifrs-full PurchaseOfPropertyPlantAndEquipment
        ClassifiedAsInvestingActivities (CCJ, BCE, FY2017-2025).
    - concept: cash_and_equivalents
      coverage: "7 of 7"
      note: "us-gaap CashAndCashEquivalentsAtCarryingValue; ifrs-full CashAndCashEquivalents."
    - concept: income_tax_expense
      coverage: "7 of 7"
      note: "us-gaap IncomeTaxExpenseBenefit; ifrs-full IncomeTaxExpenseContinuingOperations."
  extension_needed:
    concept: profit_before_tax
    issue: >
      Currently resolves for the three ifrs-full filers only. The us-gaap tags exist
      but are unmapped, and there are TWO of them with different semantics — see the
      traps below. An alternative avoiding the choice entirely is the identity
      pre_tax = net_income + income_tax_expense, which fits the existing declarative
      derivations pattern and is the recommended route for SHOP, whose direct tag
      covers one year only.
  traps:
    - trap: "SUNCOR HAS NO CAPEX AT ALL."
      detail: >
        It tags AdditionsOtherThanThroughBusinessCombinationsIntangibleAssetsOther
        ThanGoodwill (intangibles only) and balance-sheet PP&E stock, but no PP&E
        purchase flow. NOT an IFRS-wide gap — BCE and Cameco both carry the ifrs-full
        purchase tag for 9 years, so the D8 rule holds: never conclude a taxonomy is
        unsupported from one filer. Substituting intangibles additions would repeat
        the QSR gross-profit error, a partial base against a full one. Suncor must be
        insufficient_data.
    - trap: "CASH IS NOT CASH-PLUS-RESTRICTED-CASH."
      detail: >
        CashAndCashEquivalentsAtCarryingValue and CashCashEquivalentsRestrictedCash
        AndRestrictedCashEquivalents are different concepts; restricted cash cannot
        service debt, so folding it in understates enterprise value. QSR SWITCHED
        between them mid-history (first FY2014-2019, second FY2019-2025) and CP
        carries both from FY2017, so priority order changes the number. Same shape as
        Story 5.6's ladder-vs-carrying-amount finding.
    - trap: "TWO us-gaap PRE-TAX TAGS THAT DIFFER ON EQUITY-METHOD INCOME."
      detail: >
        ...ExtraordinaryItemsNoncontrollingInterest vs ...MinorityInterestAndIncome
        LossFromEquityMethodInvestments. QSR switches cleanly (second FY2014-2020,
        first FY2021-2025); CP and OTEX carry both with overlap. Not interchangeable.
    - trap: "QSR TAGS A DECOY."
      detail: >
        CapitalExpendituresIncurredButNotYetPaid (FY2024-2025) is an accrual
        disclosure, not cash capex. Mapping it would be wrong.
    - trap: "OTEX USES A DIFFERENT CAPEX TAG."
      detail: >
        PaymentsToAcquireProductiveAssets, not PaymentsToAcquirePropertyPlantAnd
        Equipment. Checking only the common tag reports OTEX as uncovered.
  method_error_worth_keeping: >
    The first pass reported a uniform FY2023 gap for SHOP across EVERY concept. It
    was an artifact: company-facts' `fy` field is the FILING's fiscal year, not the
    fact's period, so a fact for the period ending 2023 appears under fy=2024 and
    fy=2025 as a comparative. Verified by re-bucketing on `end` instead. A gap that
    appears in every concept at once is a method smell, not a coverage finding —
    the same fiscal-year-bucketing trap as the original shares_outstanding dei bug.
  status_of_epic_6: >
    Still `deferred` in epic_catalog, deliberately. This spike answers the DATA
    question and does not answer the PRODUCT questions Epic 6's acceptance criteria
    also need — forecast horizon, terminal-value method, whether the discount rate is
    user-supplied or computed, which variable the model solves backward for, and which
    two variables carry the sensitivity range. Those still want a decision packet.
  carry_forward: >
    Per Story 5.1's lesson, treat every finding here as a HYPOTHESIS until the build
    re-checks it live. 5.1's central claim was false and two of its coverage findings
    were wrong; this spike already caught one of its own errors mid-flight.


# Opened 2026-08-04 by Story 5.6. Not a 5.6 defect — 5.6 correctly reports
# insufficient_data — but it is the only reason SHOP has no near-term debt share.
shop_convertible_debt_unmapped:
  status: done
  found: 2026-08-04
  found_by: "Story 5.6 (near-term debt share) — SHOP is the one filer the metric cannot resolve"
  issue: >
    SHOP's convertible notes are its entire debt load, and `long_term_debt` is unmapped
    for SHOP: ConvertibleDebtNoncurrent is deliberately not a source, because the notes
    flip between the Current and Noncurrent tags as they approach maturity and mapping
    only the noncurrent side would make leverage appear to fall to zero while the debt
    is still outstanding.
  why_it_matters: >
    Story 5.6 now maps ConvertibleDebtCurrent, so BOTH halves are available for the
    first time — which is precisely the condition under which the original objection
    stops applying. Mapping the noncurrent half would give SHOP a near-term debt share
    for FY2023-2024, and would also resolve Piotroski's leverage signal and Beneish's
    LVGI for SHOP, which currently read as insufficient_data.
  why_not_fixed_here: >
    It changes SHOP's hand-verified Piotroski F-score and Beneish M-score, both golden
    values. That needs its own change with its own hand-verification pass, not a
    side-effect of a presentation-rule story.
  reachability: >
    CONFIRMED. Verified live 2026-08-04: ConvertibleDebtCurrent covers FY2023-2025 and
    ConvertibleDebtNoncurrent FY2019-2024, overlapping in FY2023 and FY2024.
  resolved: 2026-08-21
  resolution: >-
    MAPPED at concepts_v9, flagged rather than plain. The recorded premise — that
    Story 5.6 mapping ConvertibleDebtCurrent removed the original objection — is
    only HALF right, and the half that fails is the one that matters for the two
    blocked models. Verified live 2026-08-21: SHOP's two convertible tags are
    exactly complementary and never both non-zero (noncurrent FY2019-2024, current
    FY2023-2025), because the notes flip to current in FY2024 and are settled by
    FY2025. Beneish LVGI reads (current_liabilities + long_term_debt), so the flip
    preserves the sum and LVGI resolves correctly. Piotroski leverage_decreasing
    reads long_term_debt ALONE, so FY2023 916/11299 against FY2024 0/13924 scores a
    point for deleveraging that did not happen. Annotated via like_for_like: false,
    never corrected — Piotroski's signal is defined on long-term debt and under that
    definition the fall is real; adjusting it would be ThesisTrace originating
    methodology. Same posture as Cameco FY2021's Beneish of +20.84.
  outcome: >-
    SHOP FY2024 now resolves Piotroski F-score 6 (was 5), Beneish M -1.981461 (was
    insufficient_data), near-term debt share 1.0 (every dollar due within twelve
    months, because the notes reclassified), and a reverse DCF of 52.8% implied
    against 44.6% achieved — its first enterprise value. All hand-verified against
    the fixture's own filed figures, importing nothing from backend/scoring or
    backend/formulas. FY2022 stays insufficient_data: two filings report it as
    913.312M and 913.000M and AD-3 cannot separate them, so it is flagged
    ambiguous_selection rather than guessed.
  golden_fixture_note: >-
    shop_real_company_facts.json did NOT carry ConvertibleDebtNoncurrent, so a
    golden entry written before checking would have pinned an outcome the fixture
    could not reproduce — the trap the live-data DoD's clause 6 exists for, hit on
    the first story after the DoD was written. Rebuilt from the dev store's own
    raw_facts (real EDGAR, accession 0001594805-25-000012) rather than re-fetching.
  also_corrected: >-
    The golden entry's Beneish block asserted "SHOP genuinely has no long_term_debt
    XBRL tag at all (confirmed live: a real zero-debt company)". False — SHOP tags
    ConvertibleDebtNoncurrent for six years. The tag was deliberately UNMAPPED,
    which is a different fact; the note had turned a mapping decision into a claim
    about the filer.


# Rationale behind each epic's decomposition state, moved out of sprint-status.yaml's
# `epic_catalog` on 2026-08-20. The catalog keeps only the four fields the tests
# require (title, decomposition, deferred_under, decompose_when) — 102 words. These
# were the other 384, i.e. 79% of that section: arguments for decisions already
# taken, plus `epic-6.known_gap` (Suncor's capex), which was a finding sitting in
# the tracker by any reading.
epic_decomposition_rationale:
  epic-6:
    decomposed_on: 2026-08-06
    note: 'Decomposed WITHOUT a decision packet, deliberately, and the reasoning is recorded
      because it reverses this file''s own earlier position. D9''s binding criterion governs
      BUILD order — which feature is built next — not planning order. The "do not decompose"
      rule was an inference stated in epics.md, not a clause in D9, and it does not hold:
      acceptance criteria commit nothing, since a story can sit in the backlog unbuilt.
      Deferring Epics 6-9 as a block treated four epics with four different blockers as
      one case.

      The test applied instead is per-epic: can the acceptance criteria be written truthfully
      today? Epic 6''s could, once Story 6.1''s spike (2026-08-06) answered the data question.
      Its five remaining product questions are judgement calls, not evidence questions,
      and are recorded in epics.md as assumptions A-1..A-5 — horizon, terminal method,
      discount-rate treatment, solve-target and sensitivity axes — each explicitly reversible
      rather than presented as a finding.

      '
    d9_still_governs: 'What gets BUILT next is still chosen from the largest observed
      research failure, per D10''s decision packet. A planned backlog is what that choice
      selects from. Decomposition is not a commitment to build.

      '
    known_gap: 'Suncor resolves no capex and is insufficient_data for the whole epic.
      Story 6.2 must also settle an interest-classification decision: US GAAP mandates
      interest paid inside operating activities while IAS 7 permits operating or financing,
      so cash_from_operations is not comparable across regimes as filed. Same shape as
      D8 consequence 3.

      '
  epic-7:
    reason: 'Same criterion as Epic 6, one step further out. Scoped in epics.md (intent
      and FR coverage) but not decomposed, because its position depends on what Epic 6''s
      decision packet exposes.

      '
  epic-8:
    reason: 'Headline only in epics.md — deliberately the least specified, because it
      is furthest from evidence. Its depth is explicitly meant to be set by "the depth
      the decision workflow proves it needs", which cannot be known yet. A further constraint
      is already recorded: trend depth must honestly reflect per-filer coverage (IFRS
      40-F filers start ~FY2017, ~9 years, against OTEX''s 24 under us-gaap), so no fixed
      decade-long promise can be written into a story.

      '
  epic-9:
    reason: 'Headline only, and last by design. D9 places it last because it is the heaviest
      lift in the roadmap and depends on a citation-evaluation framework that does not
      yet exist; D7 additionally confines LangGraph to the explain/retrieve/cite surface.
      Both constraints have to be satisfied before stories are meaningful.

      '

# Evidence for CLOSED retrospective action items, moved out of sprint-status.yaml on
# 2026-08-20. bmad-sprint-planning's own note says the tracker "surfaces open ones";
# these four closed entries were 386 of that section's 427 words, while the single
# genuinely open item (the DoD spot-check, owner: Lawrence) was 41. The tracker keeps
# each closed item as a one-line pointer here, so BMad's carry-over contract holds.
action_item_evidence:
- action: >-
    Resume the golden-dataset investigation in a session with real Docker/Postgres/EDGAR/Tiingo
    access; SM-1 is not met until real hand-verified values replace the placeholder
    golden dataset
  epic: 4
  resolved: 2026-07-29
  evidence: >-
    backend/tests/golden/phase1_golden.yaml — all four companies hand-verified against
    raw EDGAR company-facts JSON (2026-07-23/25/26/29); no pending_fixture entries
    remain. Closes PRD OQ1.
  reopened_and_reclosed: >-
    2026-08-04. The D8 universe expansion to 7 filers left CCJ, BCE and SU scored
    but NOT hand-verified, so SM-1's 'every score for the Phase 1 universe' no longer
    held against the universe it was closed on. All three verified 2026-08-04 and
    added; golden coverage is 7 of 7 again. Lesson: SM-1 is a claim about the universe,
    so expanding the universe reopens it.
- action: >-
    Diagnose SHOP's null Altman aggregate and Beneish's zero-coverage concept mappings
  epic: 4
  resolved: 2026-07-29
  evidence: >-
    SHOP's Altman resolves (z_score 36.292041, band Safe — phase1_golden.yaml). Its
    Beneish is CORRECTLY insufficient_data, not a coverage bug: SHOP genuinely carries
    no long_term_debt XBRL tag (a real zero-debt company), so LVGI and the M aggregate
    cannot resolve.
- action: >-
    Audit bandTone() and similar frontend string-matching against backend-authored
    labels for coverage gaps across all 4 models
  epic: 4
  resolved: 2026-07-29
  evidence: >-
    All 10 band labels emitted by backend/formulas/specs/*.yaml traced through bandTone()
    in frontend/app/components/ui/Badge.tsx — Altman Safe/Grey/Distress, Piotroski
    Strong/Middle/Weak, Beneish flagged/no-flag, Sloan low/high accruals. All map
    to the intended tone; 'High accruals (lower quality)' does not false-match the
    'low accrual' branch. Unrecognized labels fall back to neutral by design.
  follow_up: >-
    RESOLVED 2026-08-14 by PR #76. Was: bandTone()'s docstring lists only Piotroski/Altman/Sloan
    and omits Beneish — cosmetic, fix when that file is next touched. The docstring
    now names all four models and the ten labels. It was NOT merely cosmetic: the
    2026-07-29 audit that found the code correct left no test, so nothing held the
    rule. Badge.test.ts now pins all ten labels plus the two substring near-misses,
    both verified by mutation — loosening 'no manipulation' to 'manipulation' renders
    a FLAGGED Beneish result green, and loosening 'low accrual' to 'low' renders 'High
    accruals (lower quality)' green because 'lower' contains 'low'. Each break fails
    two tests.
- action: >-
    Decide whether to add a CI pipeline, since none exists and PRs are landing without
    automated checks
  epic: 4
  evidence: >-
    .github/workflows/ci.yml (commit d8ea4de) — backend job (postgres:17 -> alembic
    -> ruff -> pytest) and frontend job (node 22 -> eslint -> next build), gating
    push to main and every PR.
- action: >-
    Add a live-data spot-check to the Definition of Done for any story touching real
    EDGAR/Tiingo integration or concept mapping
  epic: 4
  resolved: '2026-08-20'
  evidence: >-
    Closed 2026-08-20. Lawrence's call: the DoD lives in CLAUDE.md, which is loaded
    every session, rather than in a story template or a separate process doc that
    nothing would read at the moment it matters. Added as `## Definition of Done —
    live-data stories`, scoped to stories touching EDGAR/Tiingo/Bank-of-Canada ingestion,
    concept mapping, a formula spec, or a user-rendered figure; ordinary code stories
    keep the normal bar. Seven clauses, each traceable to a real incident rather than
    to general good practice: per-year coverage against live company-facts (the shares_outstanding
    class, and CP's FY2021 PP&E switch); check engineering-findings.yaml before re-fetching;
    a coverage gap may be a DECISION (BCE's debt stopping at FY2023); a gap in every
    concept at once is a method smell (EDGAR's `fy` is the filing's year, not the
    fact's); render it in a browser and choose subjects by code path, not convenience
    (Story 6.6 was clean on the four filers chosen and broken on the two that were
    not); confirm a golden fixture can exercise a new concept before writing entries
    against it; record the verification and batch the permission ask. The motivating
    evidence is that a green suite has repeatedly meant nothing here — Story 5.4 hid
    four real bugs behind 27 passing tests, and PR #74 rendered '0.97B' on two live
    pages behind 34 passing tests, a clean tsc and a written analysis of that exact
    helper.


# Found 2026-08-21 while browser-checking the concepts_v9 bump — the live-data DoD's
# "render it" clause, on the first story after that DoD was written.
ambiguity_flagging_had_no_idempotency_key:
  status: done
  found: 2026-08-21
  found_by: >-
    Rendering SHOP's company page after the concepts_v9 re-canonicalization. The page
    showed a wall of identical "Ambiguous source selection" rows. No test saw it,
    because no test canonicalized one issuer under two mapping versions.
  issue: >-
    canonicalize.py flagged an unresolvable AD-3 selection with a bare
    session.add(DataQualityIssue(...)) and no idempotency key. Invisible in daily
    operation, because an already-canonicalized issuer is skipped wholesale before
    reaching the flagging branch — but a MAPPING-VERSION BUMP re-resolves every
    concept and re-flags every unresolvable one, so the UI gains a duplicate warning
    per bump. Counts after the v9 pass: SHOP 24, CP 18, BCE and OTEX 8 apiece.
  pre_existing: >-
    Not introduced by concepts_v9, only exposed by it. BCE and OTEX deduplicated to
    TWO rows each, below the four they carried before this session — so their
    "four" was already two real ambiguities doubled by the earlier v7 to v8 bump.
  same_class_as: >-
    The run_validation accumulation fixed in PR #22, whose lesson is recorded as an
    anti-pattern in project-context.md. This was the one writer that was missed, and
    the anti-pattern's own wording ("canonicalize_issuer already models the pattern")
    is what made it look covered.
  fix: >-
    Pre-fetch the issuer's existing canonicalization-raised ambiguity keys and skip a
    concept/year already on record. Deliberately ignores status, so a dismissed issue
    is not resurrected as a fresh needs_review one. Guarded by
    test_an_ambiguity_is_flagged_once_not_once_per_mapping_version, verified to fail
    when the guard is removed. Dev store deduplicated: 59 rows to 31.

story_10_1_browser_verification:
  status: done
  verified: 2026-08-27
  how: >
    Live dev server (Next.js dev, not a static build) against the real dev database
    and a running backend, two filers chosen for opposite code paths — not for
    convenience — per the live-data DoD.
  filers_checked:
    CP: >-
      Full resolution: all 4 models compute across ~19 fiscal years each, reverse
      DCF resolves (37.2% implied vs 6.6% achieved), near-term debt share AND a
      published maturity/repayment schedule both present, open data-quality
      warnings (ambiguous_selection). Exercises every section's "everything present"
      path and the longest realistic Financial Health section (2 models x ~19 years).
    SU: >-
      Sparse/degraded: Beneish and Altman both carry a Caveat (missing SG&A Ratio,
      missing Retained Earnings under IFRS by-nature presentation), reverse DCF
      resolves to insufficient_data ("no free cash flow for this fiscal year") per
      AD-16 rather than being hidden, near-term debt share present (973.0M of
      9.99B — the exact figure PR #74's compactAmount fix targeted) but NO
      maturity/repayment schedule (renders nothing, not a placeholder), and no
      open data-quality warnings. Exercises every section's degraded/absent path.
  what_was_verified:
    - "All 5 sections (Overview, Valuation, Past Performance, Financial Health, Integrity & Evidence) render with correct content in their new homes, on both filers."
    - "Persistent section nav's scrollspy correctly tracks the active section as the real page scrolls (verified via mouse-wheel scroll, see defect note below on how in-page click navigation was verified)."
    - "URL hash updates and is independently addressable (direct #anchor jump on load, and via nav click)."
    - "Dark theme is the default on first load with no stored preference; ThemeToggle correctly switches to light and back, in both directions, with badges/gauges/cards legible in both themes."
    - "Every existing capability confirmed still reachable: Verdict grid, WhatChanged, ReverseDcfCard (both resolved and insufficient_data branches), per-model expandable breakdowns with citations, NearTermDebtShareCard, MaturityProfileCard (both present and render-nothing branches), data-quality warning banner (both present and absent branches)."
    - "All 47 pre-existing frontend unit tests pass unmodified; tsc and eslint clean; production build succeeds."
  defects_found_and_fixed:
    - >
      React hydration-mismatch console error on every page load: the blocking
      theme-init script sets `data-theme` on `<html>` before hydration (by design,
      to avoid a flash of the wrong theme), which server-rendered HTML never
      carries — React correctly flagged the resulting attribute mismatch. Fixed
      with `suppressHydrationWarning` on `<html>` (scoped to that element only,
      the same technique the next-themes library uses for this exact case).
      Confirmed clean console after the fix, on a fresh navigation.
  tooling_note: >
    In-page anchor-click navigation could not be visually confirmed as "smooth"
    through the browser-automation tab specifically: `scroll-behavior: smooth`
    (CSS) animates via requestAnimationFrame, and this automation tab appears to
    be treated as backgrounded/non-visible by Chrome, which throttles rAF-driven
    animation near to a halt — confirmed by three independent tests: (1) a real
    mouse-wheel scroll moved the page instantly and correctly, (2) `window.scrollTo`
    and `scrollIntoView` had zero effect while `scroll-behavior` computed as
    `smooth`, (3) setting `scroll-behavior: auto` at runtime made the identical
    `scrollTo` call apply instantly. This is an artifact of the automation
    environment's tab-visibility handling, not a defect in the shipped CSS — a
    real user's foreground tab is never subject to this throttling. All 5-section
    functional verification above was done with `scroll-behavior` forced to `auto`
    for observability; the shipped code still ships `smooth` (globals.css).

story_10_1_codex_review:
  status: done
  reviewed: 2026-08-27
  by: "Codex, independent pass against PR #87 per the project's cross-model review convention"
  findings: 10
  all_confirmed_and_fixed: true
  fixed:
    - "P1: dark-mode brand token reused for two opposite contrast needs (text-on-dark-surface vs white-on-filled-button), producing sub-AA contrast in places. Split into named roles (--color-brand-link, --color-brand-action, --color-brand-badge) with --color-brand-600/700 kept as aliases so no consumer needed a rename beyond the shared components (Button, Badge)."
    - "P1: header overflowed at a 320px viewport. Responsive padding/gap classes added (px-3 sm:px-6, gap-1 sm:gap-5, min-w-0, whitespace-nowrap)."
    - "P2: ThemeToggle showed the wrong icon/label for one frame before mount, and an early click could invert state incorrectly. Now disabled with a neutral placeholder until mounted, and toggle() reads the DOM attribute directly as the source of truth rather than trusting React state."
    - "P2: ReportNav's scrollspy only inspected the IntersectionObserver's changed entries per callback (a delta, not a full snapshot), so an active section could be set incorrectly when multiple sections intersected at once. Now keeps a persistent per-target intersection map and recomputes the topmost intersecting section on every callback."
    - "P2: a short final section (e.g. Integrity & Evidence on a filer with little content) could never enter the observer's activation band and so never became active. Added a scroll-position fallback that force-activates the last section once the document is scrolled to its true bottom."
    - "P2: pending-badge and faint-text dark tokens were both under the 4.5:1 AA floor. Brightened --color-ink-faint-dark and --color-signal-pending-dark."
    - "P2: scroll-behavior: smooth was unconditional, ignoring prefers-reduced-motion. Now gated behind @media (prefers-reduced-motion: no-preference)."
    - "P2: Next's default 404 page ignored the app's theme (hard-coded white body under the dark header). Added app/not-found.tsx using the same design tokens."
    - "P2: architecture-page Mermaid diagrams kept their authored light palette even in dark mode. Added a light->dark hex-swap at the render boundary (frontend/app/components/MermaidDiagram.tsx), re-rendering live on theme change via a MutationObserver on data-theme."
  independently_reverified_by_claude:
    contrast_math: >
      Recomputed every stated contrast ratio from the actual color-mix formulas rather than
      trusting Codex's numbers — WCAG 2.1 relative-luminance formula, sRGB channel lerp matching
      `color-mix(in srgb, ...)`. All pass AA: primary button 5.29:1, link-on-surface 7.14:1,
      pending-badge 5.03:1, nav-faint-text 5.29:1. One is thin: brand badge text on brand-50 is
      4.56:1 against a 4.5:1 floor — passes, but only just, and a future token tweak on either
      side could silently fail it with nothing to catch that. No automated contrast test exists;
      this was hand-verified, not enforced.
    mobile_header_320px: >
      Could not get an actual 320px render — `resize_window` did not affect this tab's viewport
      at all on the original tab (stuck at 1728px regardless), and a fresh tab clamped to a
      500px floor rather than reaching 320px, evidently an environment constraint rather than
      the tool's failure to act. Confirmed clean (no overflow) at 500px, genuinely below the
      sm:640px breakpoint so the mobile-first base classes are the ones active. Measured the
      real mobile-variant values there (12px each-side padding, 4px nav gap, 101px logo, 198px
      nav) and summed them: ~323px minimum content width. At literally 320px this could still
      overflow by a few px — a large improvement over the original ~355px, but not certainly
      zero. Recommend a real-device or DevTools spot-check before treating this specific number
      as fully closed.
    scrollspy_final_section: >
      First check (via JS `window.scrollTo` to the document bottom) showed the nav stuck on
      "Overview" even after a 2s wait — looked like the fix hadn't worked. Re-tested with a
      GENUINE mouse-wheel scroll (computer tool's scroll action) to the identical scrollY
      (16774.5) and the nav correctly read "Integrity & Evidence". Same position, different
      input method, opposite result — confirms `scrollTo()` does not reliably dispatch the
      native `scroll` event this fix's fallback listens for in this specific automation
      environment (the same class of artifact already recorded for smooth-scroll in
      story_10_1_browser_verification above), not a defect in the shipped fix. Real user input
      (wheel/trackpad/touch/scrollbar) fires genuine scroll events and is unaffected.
    mermaid_dark_theming: >
      Confirmed the re-render is genuinely live, not just correct on initial dark load: toggled
      theme light->dark->light on the /architecture page and the diagram's palette flipped
      correctly both directions, matching the MutationObserver-driven re-render in the diff.
    404_and_reduced_motion: >
      404 confirmed dark-themed by navigating to a genuinely non-existent route (distinct from
      the app's own "not yet covered" state for an out-of-universe ticker, which still renders
      correctly and separately). prefers-reduced-motion gating verified by reading the CSS
      source only — no motion-preference emulation was available in this session's tooling to
      confirm the media query actually flips at runtime.
  regression_check: >
    Full gate re-run after the fixes: tsc clean, eslint clean, vitest 47/47 (unmodified),
    backend pytest 343/343 (unaffected — frontend-only change, run as a sanity check), next
    build succeeds including the new /_not-found route, browser console clean on a fresh
    navigation (no hydration warnings reintroduced).

story_10_2_browser_verification:
  status: done
  verified: 2026-08-27
  how: >
    Real dev server AND a real production build (`next build` + `next start`), both
    against the live dev DB/backend — the theme defects below specifically did not
    reproduce identically in dev vs prod, so both had to be checked. Two filers chosen
    for opposite states, not convenience: CP (all four models resolve with real values,
    two Caveat, one clean pass, one insufficient_data) and Suncor (two axes null/dashed
    simultaneously — Beneish AND Altman both insufficient_data — plus two real-caveat
    positions on Piotroski/Sloan), confirming the glyph never confuses multiple
    simultaneous absence states.
  what_was_verified:
    - "Four independent spokes render, never connected into a polygon, no aggregate number/shape anywhere on the glyph (D12 guard 1)."
    - "Each axis colored/labelled from its own band vocabulary (bandTone/applicabilityVariant applied per-VerdictItem, not a shared assumption) — confirmed correct on both a full-resolution filer (CP) and a sparse one (SU) with different band values throughout."
    - "insufficient_data and excluded_out_of_scope render as a short, dashed, non-zero spoke — verified two such axes rendering simultaneously (SU: Beneish + Altman) without visual ambiguity."
    - "computed_with_caveat keeps its REAL position and REAL band tone, matching the Gauge on the same model's detail card below — verified CP's Altman axis (Caveat label, but positioned and colored per its actual 'Grey'-equivalent band, not a placeholder)."
    - "Clicking an axis navigates to its section (Piotroski/Altman -> #financial-health, Beneish/Sloan -> #integrity-evidence) — confirmed via direct event dispatch on both target anchors after coordinate-based clicks proved unreliable for SVG-embedded anchors specifically (see tooling note)."
    - "Dark and light themes both render correctly and legibly; light mode confirmed to survive a full fresh navigation to a DIFFERENT page (not just a client-side re-render), proving the theme is genuinely server-rendered, not client-patched."
    - "Zero console errors/warnings on a clean navigation, in both dev and a real production build."
  defects_found_and_fixed:
    - >
      Every axis label was clipped by the SVG's own default `overflow: hidden` viewBox
      boundary — top/bottom labels sliced to their bottom half, left/right labels
      sliced to their last 1-2 characters. Caused by LABEL_RADIUS leaving only ~6px of
      margin to the viewBox edge for a two-line label needing ~26px. Fixed by
      recomputing the geometry (SIZE 240->260, MAX_RADIUS 88->82, more margin) and
      adding `overflow="visible"` as a safety net against any remaining font-metric
      variance. Caught immediately on first render — the AC's "verified in a browser"
      requirement earned its keep on the very first screenshot of this story.
    - >
      Clicking the thin (2px) visible spoke line silently did nothing — a `transparent`
      stroke is not hit-tested under SVG's default `pointer-events: visiblePainted`.
      Added an invisible, wide (20px) hit-area line with `pointer-events="stroke"`
      explicitly set, widening the clickable region without changing what's painted.
    - >
      MAJOR — a genuine React hydration mismatch, thrown as an unrecoverable error in
      production (React #418) and a full-detail warning in dev, both pointing at the
      SVG `<title>` child element inside each axis's `<a>`: React's server HTML string
      serializer and the browser's real SVG-namespace DOM disagreed on it (`<title>`
      doubles as HTML page-metadata, which the SSR renderer evidently treats specially
      in a way that does not survive real SVG-namespace parsing). Fixed by using a
      plain `title` ATTRIBUTE on the `<a>` instead of a `<title>` CHILD ELEMENT — a
      plain string prop has no such serialization ambiguity, and the anchor's
      accessible name still derives correctly from its own visible text content
      regardless. This was ALSO the true cause of a batch of "duplicate React key"
      console errors that looked unrelated (leverage_decreasing-long_term_debt,
      roa_increasing-net_income, etc.) — those were fallout from React discarding and
      client-rebuilding the mismatched subtree, not an independent bug; they
      disappeared completely once the real hydration mismatch was fixed. Lesson: when
      a hydration mismatch forces a subtree rebuild, treat every OTHER error in that
      same render pass as suspect fallout before investigating it as separate.
    - >
      MAJOR, and NOT actually new to this story — a pre-existing, previously
      undetected defect in Story 10.1's theme mechanism, surfaced only because this
      story's own hydration-mismatch investigation forced a close look at `<html>`.
      The `next/script strategy="beforeInteractive"` blocking script that was supposed
      to set `data-theme` before first paint never actually executed: confirmed live
      that `data-theme` stayed `null` in BOTH `next dev` and a real `next build` +
      `next start` production server, on a completely fresh tab, with zero stored
      cookie/localStorage state. The script tag existed in the raw SSR HTML with
      correct content (confirmed via direct fetch of the page source) and its own
      logic worked perfectly when executed manually — but as rendered by
      `next/script`'s special runtime, the tag was hoisted into `<head>` with `async`
      set on a src-less inline script, and never ran. The site still LOOKED correct
      throughout Story 10.1 and its Codex-review fixes, because the CSS itself
      defaults to dark with no attribute at all — masking the fact that a user who
      chose LIGHT mode would see it silently discarded on every subsequent full page
      load, since nothing else ever re-applied a stored preference. Two follow-on
      attempts before finding the real fix: switching to a plain native `<script>` (no
      next/script) still left `data-theme` null; removing `suppressHydrationWarning`
      to diagnose surfaced React error #418 on `<html>` and restoring it made the
      error silent but did NOT restore the attribute — proving React's hydration
      reconciliation resets attribute mismatches to match its own render regardless of
      `suppressHydrationWarning`, which only suppresses the console WARNING for
      TEXT-content mismatches, not attribute reconciliation. The actual fix replaces
      the entire pre-hydration-script approach: `RootLayout` now reads the theme from
      a COOKIE server-side (`next/headers`'s `cookies()`) and renders `data-theme`
      directly as a normal React prop on `<html>`, so server and client agree from the
      first frame — no script, no race, nothing to reconcile. `ThemeToggle` now writes
      the cookie (not localStorage) on toggle, and takes the server-known theme as a
      prop instead of discovering it via a post-mount effect. Verified light mode now
      survives a full fresh navigation to a different page. This is the idiomatic
      Next.js App Router pattern for exactly this problem, and structurally cannot
      recur the way the script-based approach did.
  tooling_note: >
    Coordinate-based `computer.left_click` on the glyph's SVG-embedded `<a>` elements
    was unreliable in this browser-automation session — clicks that landed exactly on
    the correct element per `elementFromPoint` still did not trigger navigation.
    Isolated with a clean A/B: `anchor.dispatchEvent(new MouseEvent('click', ...))`
    navigated correctly every time on the same elements. `SVGAElement` also has no
    `.click()` convenience method (an HTML-only API), confirmed separately. This joins
    two other automation-specific artifacts already recorded in
    story_10_1_browser_verification (smooth-scroll stalling on a backgrounded tab;
    `scrollTo()` not firing native scroll events) as a now-third instance of the same
    class: this tooling's synthetic pointer/scroll simulation is less reliable for
    certain interactive element types than genuine input. Real users are unaffected —
    plain `<a href="#id">` navigation, SVG-embedded or not, is standard, universally
    supported browser behavior with no framework code in the path.
  regression_check: >
    Full gate re-run after all fixes: tsc clean, eslint clean, vitest 53/53 (47
    pre-existing unmodified + 6 new for `axisState`'s pure logic), backend pytest
    343/343 (unaffected — frontend-only change, run as a sanity check), `next build`
    succeeds, and a real production server (`next start`) confirmed clean — zero
    console errors/warnings on a fresh navigation, `data-theme` correctly server-
    rendered, light mode surviving a full navigation to a different route.

story_10_2_codex_review:
  status: done
  reviewed: 2026-08-27
  by: "Codex, independent pass against PR #88 per the project's cross-model review convention"
  findings: 10
  all_confirmed_and_fixed: true
  fixed_by_codex:
    - "P1: /architecture was `export const dynamic = 'force-static'`, so it ignored the theme cookie entirely and served whatever theme happened to be baked in at build time to every visitor regardless of their real preference. Removed the force-static export; the route is now correctly dynamic (confirmed in the build output: architecture moved from a static ○ route to a dynamic ƒ one)."
    - "P1: the glyph's outer <svg> carried role='img', which per ARIA semantics treats the whole element as a single flat leaf image — this hid all four interactive <a> links from assistive technology, functionally invisible to a screen-reader user despite being visually and mechanically clickable. Changed to role='group' (a labelled container that exposes its children) plus explicit role='link'/aria-label on each anchor."
    - "P2: a model missing from the API's verdict array previously vanished from the glyph silently (filtered out) rather than rendering an explicit absence state, inconsistent with every other absence case (insufficient_data, excluded_out_of_scope) which do render explicitly. Missing models now render as a dashed 'Not covered' axis."
    - "P2: long status labels on the left/right axes (e.g. Beneish's 'Manipulation risk flagged') could clip on narrow screens under text-anchor 'start'/'end' growing away from the axis with no wrap. Added word-wrapping for side-axis labels and moved to fixed, safe label coordinates instead of pure radial math."
    - "P2: fiscal year was computed but never shown — added as a third label line per axis and in each link's aria-label."
    - "P2: the Verdict-grid cards (both the top summary grid and the per-lens expandable breakdown) checked `applicability !== 'computed'` before checking `aggregate_value === null`, so a computed_with_caveat entry with no value showed a 'Caveat' badge instead of 'Insufficient data' — inconsistent with what axisState already did for the SAME data in the glyph. Reordered both call sites to check null-value first, matching axisState's own precedence."
    - "P2: an applicability value the frontend doesn't recognize (a future backend enum addition) fell through to 'pass'/'Computed' in both applicabilityVariant/applicabilityLabel (shared Badge.tsx functions) and axisState — silently asserting success for a state nobody has defined yet. Both now require an exact match on known values and fall back to pending/'Unavailable' otherwise. Verified against the backend's actual Applicability enum (backend/app/models.py): exactly 3 values exist today, so this is a correctly-unreachable forward safety net, not a live behavior change."
    - "P2: a non-finite aggregate_value (e.g. NaN, which Number would still pass the `!== null` check) would have flowed into domainPct and produced NaN spoke geometry. axisState now checks `!Number.isFinite(v.aggregate_value)` alongside the null check."
    - "P2: an existing Story-10.1-era light-mode preference stored in localStorage would be silently lost the moment this story's cookie-based mechanism shipped (nothing ever reads localStorage anymore). ThemeToggle now migrates that one legacy value to a cookie in a post-mount effect (safe — runs after hydration, not before, so it cannot recreate the earlier hydration-mismatch class of bug)."
    - "P3: the theme cookie had no Secure flag. Now conditionally added only when served over HTTPS (window.location.protocol === 'https:'), which hardens the real Vercel/production deployment while keeping local `next dev` over plain HTTP working."
  independently_reverified_by_claude:
    method: >
      Did not accept Codex's fixes on trust. Read every diff hunk against the live
      backend Applicability enum and the existing Gauge/Badge call sites before
      running anything; then ran the full gate (tsc, eslint, vitest, backend pytest,
      `next build`) and browser-verified the specific claims live in a real
      production server (`next start`), on CP (full resolution) and Suncor (mixed
      caveat/insufficient states, including the exact null-value-vs-caveat card the
      fix targets).
    architecture_theme_fix: >
      Confirmed live: set a light-theme cookie, navigated to /architecture in a real
      production server, and the page — including the Mermaid diagram's palette —
      rendered light, not the previously-frozen build-time theme. Build output
      confirms the route is no longer static.
    accessibility_role_group_fix: >
      Confirmed via the FULL (unfiltered) accessibility tree, not a filtered
      "interactive elements" view (which, discovered along the way, does not surface
      SVG-embedded links at all — a limitation of that specific tool view, not the
      app): the tree correctly shows `group "Verdict constellation..."` containing
      four `link "Piotroski: Middle, FY 2025"`-shaped entries with correct
      accessible names including fiscal year. This is what a real screen reader
      actually walks.
    null_value_caveat_consistency: >
      Confirmed live on Suncor: the Altman card (previously "— / Caveat", the exact
      inconsistency logged) now reads "— / Insufficient data", matching what the
      glyph's Altman axis already showed. Piotroski, which has a real value AND a
      caveat, correctly still shows "6 / Caveat" on both — confirming the fix
      changed the null-value case specifically without disturbing the real-value
      case.
    localstorage_migration: >
      Confirmed live: cleared any cookie, set `localStorage['thesistrace-theme'] =
      'light'` (simulating a returning pre-this-PR user), did a fresh full
      navigation, and the page ended up on data-theme="light" with a real cookie
      now set — the migration ran and self-heals for every subsequent visit.
    unknown_applicability_fallback: >
      Cross-checked against `backend/app/models.py`'s `Applicability` enum directly:
      exactly `computed`, `computed_with_caveat`, `excluded_out_of_scope` exist
      today, confirming the new fallback branch is unreachable with current live
      data and is a pure forward-safety net, not a behavior change.
  additional_defect_found_by_claude:
    severity: P2
    what: >
      The P2 "keyboard focus styling" fix's stated CLASSES were correct
      (`focus-visible:outline-2 focus-visible:outline-[var(--color-brand-link)]
      focus-visible:outline-offset-2`) but incomplete: none of them ever set
      `outline-style`, which stayed `none` (from the base `outline-none` class) in
      EVERY state including focus-visible — meaning the outline-width/color/offset
      values were all correctly computed but literally never painted, because
      `outline-style: none` suppresses outline rendering regardless of the other
      three sub-properties.
    how_caught: >
      Not from reading the diff — the class list looked plausible. Caught by
      genuinely tabbing to the element via real keyboard input (`computer` tool's
      Tab key, landed correctly on the Piotroski link after 10 tabs from a known
      starting point) and reading the ELEMENT'S COMPUTED STYLE rather than trusting
      the class list: `getComputedStyle(document.activeElement).outlineStyle` read
      `"none"` even while `element.matches(':focus-visible')` was `true`. A script-
      triggered `.focus()` call was tried first and does NOT set `:focus-visible`
      true in this browser (an important distinction for testing this class of CSS
      — confirmed by direct comparison of the two methods on the same element).
    fix: >
      Added `focus-visible:outline` to the class list — Tailwind v4 resolves both
      `outline` and `outline-2` through a shared `--tw-outline-style` custom
      property, and only the bare `outline` utility actually DEFINES that property
      as `solid`; `outline-2` alone only ever read the (undefined-here) variable.
      Verified the fix at the CSS-SOURCE level by grepping the compiled production
      stylesheet directly for the generated rule, rather than trusting another live
      focus test — live re-verification via simulated Tab keypresses became
      unreliable partway through this session (see tooling_note below) after one
      clean successful run had already proven both the original bug and, separately,
      that keyboard-driven focus does set `:focus-visible` correctly when the
      simulation DOES work.
  tooling_note: >
    Keyboard Tab-key simulation via the `computer` tool was inconsistent in this
    session: one clean sequence (JS-focus the first link, then 10 real Tab
    keypresses) correctly landed on the target link and was what caught the
    outline-style bug above. Three subsequent identical attempts — including after
    an explicit mouse click on the page body to establish real window/tab focus
    first — left focus stuck on the very first link, as if no Tab keypresses were
    delivered at all. This joins the day's other automation-specific artifacts
    (recorded in story_10_1_browser_verification and story_10_2_browser_verification
    above) as a fourth instance of the same class: this tooling's synthetic input
    simulation is measurably less reliable for some interaction types than genuine
    input, in a way that does not reflect real user behavior. The focus-visible fix
    was independently confirmed correct via direct inspection of the compiled CSS
    rule instead of a repeated live test, once the live method stopped cooperating.
  regression_check: >
    Full gate re-run after Codex's fixes AND the additional outline-style fix: tsc
    clean, eslint clean, vitest 57/57 (53 prior + 4 new tests for the caveat-
    precedence, unknown-model-domain-fallback, and non-finite-value cases), backend
    pytest 343/343 (unaffected — frontend-only change, sanity check), `next build`
    succeeds (every route now correctly dynamic, matching the cookie-dependent root
    layout), production server confirmed clean on CP and Suncor in both themes.

story_10_3_browser_verification:
  status: done
  verified: 2026-08-27
  how: >
    New backend module (rewards_risks/engine.py) plus a versioned presentation-
    rule spec (rewards_risks_v1.yaml), mirroring trajectory_v1.yaml's own
    established pattern exactly — kind: thesistrace_presentation_rule, a loader
    that rejects anything else, and a declared `inputs` list checked by a test
    that greps the engine's own source (the piotroski_v1 inputs lesson, applied
    to a presentation rule rather than a formula spec for the first time).
    Wired into get_company_overview from data already fetched for `verdict` and
    `data_quality` — no new query (AD-1), same shape as the trajectory pass.
    Verified against real live data (backend running against the dev DB, not
    fixtures) across all 7 universe filers before any frontend work, then in a
    real production frontend server in both themes.
  what_was_verified:
    - "Only a model's OWN published best/worst band (quoted verbatim from that model's own formula spec, e.g. Piotroski's 'Strong'/'Weak') produces a bullet — a middle band (Caveat/Grey/Middle) produces nothing, confirmed on CP (Sloan reward) and SU (Sloan reward, no risks)."
    - "A null aggregate_value never produces a bullet even when a stale band_label string is present — the same 'no value wins over caveat' precedence VerdictGlyph's axisState already applies (Story 10.2), now applied a second time in an independent rule and unit-tested identically."
    - "An unrecognized applicability/model produces nothing (forward safety net, not a live behavior change — same verification method as Story 10.2: cross-checked against the real backend enum)."
    - "Every bullet carries the spec's attribution and links to a real report-section anchor derived from the VerdictItem's own `category` field (not a second hardcoded model->section table — reuses the same mapping the read API already assigns) or, for data-quality bullets, to Integrity & Evidence."
    - "Click-through confirmed live: dispatched a real click on a rendered risk bullet's anchor and confirmed the URL hash updated to the correct section."
    - "Both themes confirmed correct and legible, including one screenshot that briefly looked broken (very low-contrast numbers mid-toggle) — re-screenshotted after a 1s wait and confirmed it was a caught CSS-transition frame, not a real defect, before reporting it either way."
  defect_found_and_fixed:
    severity: P1
    what: >
      The FIRST live check, before any frontend work, showed CP producing 8
      NEARLY-IDENTICAL risk bullets — one per open data_quality row, all
      reading "An open data-quality issue: ambiguous_selection." Confirmed via
      the rows' own `detail` field that these were NOT duplicates (a real,
      already-tracked class of bug in this project — see
      ambiguity_flagging_had_no_idempotency_key above): they were 9 genuinely
      DISTINCT issues (different canonical_concept/fiscal_year pairs, e.g.
      cash_and_equivalents FY2008, depreciation FY2009, ebit FY2009...) that
      the bullet's own template simply didn't have enough detail to
      distinguish, defeating the story's own "readable in ten seconds" goal
      before a single frontend file was even touched.
    fix: >
      Redesigned data-quality handling to emit ONE bullet per DISTINCT
      issue_type, counting every open row of that type, with singular/plural
      spec-declared templates ("1 open data-quality issue: X." / "{count} open
      data-quality issues: X."). No single accession_number is attached to a
      counted bullet — attaching one arbitrarily-chosen row's accession to a
      bullet covering N rows would misrepresent it as the citation for all of
      them; the section link (which lists every row individually) is the
      correct citation for an aggregate. Re-verified live: CP now shows one
      genuinely scannable "9 open data-quality issues: ambiguous_selection."
      bullet instead of nine near-duplicates. Caught by checking real backend
      output before writing a single line of frontend code — the standing
      "render it in a browser" rule earning its keep at the API layer, not
      just the page layer, for the first time on this project.
  regression_check: >
    Full gate: tsc/eslint clean, vitest 57/57 (unmodified — this story is
    backend-computed, so the frontend component has no pure logic worth unit
    testing beyond what TypeScript already checks), backend pytest 373/373 (343
    prior + 30 new: reward/risk selection per model, absence precedence,
    caveat/applicability/category safety, data-quality status filtering and
    deterministic ordering, attribution, authoritative-band validation, loader
