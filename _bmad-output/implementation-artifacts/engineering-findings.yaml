      - "current_liabilities: FY2009-2025, clean"
      - "net_income: FY2008-2025, clean"
      - "cash_from_operations: FY2008-2025, clean"
      - "shares_outstanding: FY2008-2025, clean"
      - "total_liabilities: FY2009-2025, clean"
      - "retained_earnings: FY2009-2025, clean"
      - "ebit: FY2008-2025, clean (OperatingIncomeLoss tagged every year)"
      - "revenue: FY2017-2025 under the CURRENT mapping (Revenues only). SEE FINDING 1 below — the earlier fallback candidate is REJECTED, not silently addable."
      - "cogs: FY2017-2025, clean (CostOfGoodsAndServicesSold)"
      - "sga: FY2008-2025, clean (GeneralAndAdministrativeExpense)"
      - "receivables: FY2010-2025, clean"
      - "ppe_net: FY2009-2025, clean"
      - "depreciation: FY2008-2025, clean"
      - "long_term_debt: FY2009-2025, clean, but crosses a tag switch — SEE FINDING 3"
      - "gross_profit: NO full-year coverage in any year. SEE FINDING 2 — expected, not a defect."
      - "near_term_debt: FY2010-2025, clean (LongTermDebtCurrent)"
      - "total_debt: filed tag (LongTermDebt) only FY2010-2018; the existing total_debt_current_plus_noncurrent derivation extends it to FY2010-2025 via near_term_debt + long_term_debt, both of which cover that full range. No action needed — confirms the derivation earns its keep for a filer it wasn't built for."
