    - "'Last pipeline run' is `MAX(ScoreRun.computed_at)` across the issuer's own non-superseded runs — a genuine per-issuer timestamp, not a global one. Confirmed both CP and OTEX show the same real timestamp (2026-08-21T11:24), matching when the last full-universe pipeline run actually executed, read from `_seed_issuer`/live `score_runs` rows, never fabricated."
    - "Source list built by APPENDING only on a positive presence check, never by listing all three and marking one absent — checked live both directions: CP (CAD reporter, a MarketPrice row exists) shows all three sources including 'Bank of Canada FX (USD/CAD)'; OTEX (USD reporter) shows exactly two, with Bank of Canada FX absent entirely from the JSON, not present-and-labelled-unused."
    - "'Bank of Canada FX used' is inferred from an ALREADY-FETCHED canonical fact reporting in CAD (no second scan of canonical_facts) rather than joining the currency-pair-keyed `fx_rates` table, which has no issuer_cik column to join on directly — the correct question is 'did this issuer need conversion', which the fact's own unit already answers."
    - "Formula-spec versions use `latest_any_by_model` (the most RECENTLY COMPUTED run per model, regardless of whether it resolved), not `latest_by_model` (the most recent VALID run, already computed a few lines above for the Verdict grid and serving a different purpose) — 'in force' means the spec version the pipeline is applying right now, and using the wrong dict would have shown a stale version for any model whose most recent run happened to be insufficient_data."
    - "Both themes confirmed correct with zero hardcoded colors (every fill and text color is a semantic token) — verified by toggling live, not by code inspection alone."
  defect_found_and_fixed:
    severity: P2
    what: >
      `test_overview_query_count.py`'s `test_overview_query_count_does_not_grow_with_history`
      failed immediately: `SHORT_HISTORY_QUERIES` was still 7, and the footer's
      two new bounded queries (latest Filing, MarketPrice existence) pushed the
      real count to 9. This is exactly the guard this file's own docstring says
      it exists to catch — "above zero means a per-year round trip came back" —
      except here the per-year slope stayed correctly at 0 (both new queries
