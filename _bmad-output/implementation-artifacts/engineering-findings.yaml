  - step: "Derived-vs-filed provenance marker (found while scoping D8, pre-existing)"
    status: done
    evidence: "PR #28. canonical_facts.derivation + Provenance.derivation + CitationChip 'derived' badge. Migration a1c4e7b9f012."
  - step: "Out-of-calibration Beneish caveat"
    status: done
    evidence: "PR #29. Cameco FY2021 GMI=45.1 -> M=+20.84 annotated computed_with_caveat, value UNCHANGED. score_runs.caveat_reason, migration b2d5f8c1a334."
  - step: "4. Extract mapping engine to versioned per-taxonomy YAML"
    status: done
    evidence: "PR #31. canonicalization/mappings/ package: engine.py + specs/{registry,us-gaap_v4,ifrs-full_v1,derivations_v1}.yaml. Rule set proven byte-identical to the pre-refactor tuples (all 59, same priorities), so MAPPING_VERSION stays concepts_v4 — AD-2 requires a bump for a mapping CHANGE, and nothing changed. 87 passed / 1 skipped against real Postgres 17. Priority is now list position; derivations are declarative and taxonomy-blind."
    follow_up: "RESOLVED 2026-08-02 — do not re-investigate. Was: seven ifrs-full fallbacks marked UNVERIFIED VARIANT, to be checked once step 5 landed BCE/Suncor, deleting any no filer needs. All seven were then checked per-year against real company-facts JSON for all three IFRS filers. Outcome: five are LOAD-BEARING (four are Suncor's ONLY source for their concept), one never fires but guards a real measurement difference, one has never been used. NONE deleted — keeping them was right. Four are not clean substitutes, which is a cross-filer COMPARABILITY issue rather than a coverage one, so the three affected sources carry `like_for_like: false` + `mismatch_reason` and any score consuming one is annotated computed_with_caveat, value never altered. Evidence and the full per-source disposition: backend/canonicalization/mappings/specs/ifrs-full_v4.yaml, the `Fallback verification status` block. Left reading as an open instruction until 2026-08-14, when it sent a session chasing a solved problem — the same drift as the four Epic-4 items reconciled 2026-07-29."
  - step: "5. BCE (3 of 4 models) and Suncor (2 of 4)"
    status: done
    resolved: 2026-08-02
    evidence: "Both added and verified live (BCE 0000718940, Suncor 0000311337). MAPPING_VERSION concepts_v4 -> concepts_v5. All three D8 consequence-3 decisions made: ebit = ProfitLossBeforeTax + InterestExpense (derivations_v2, with the rejected alternative recorded), gross_profit derived only from a true CostOfSales tag, and non-comparable by-nature inputs annotated computed_with_caveat. 100 passed / 1 skipped."
    follow_up: "(1) RESOLVED 2026-08-02 — see qsr_gross_profit_reverification below. (2) RESOLVED 2026-08-04 by PR #36 — the ebit DECISION rationale, versioned in derivations_v2.yaml, is now published on the /methodology page as D8 consequence 3 requires. NOTE: this value's closing quote was missing until 2026-08-04, which made the whole file unparseable by any YAML reader; if you add prose here, parse the file afterwards."
    note: "Each adds one degradation case. Suncor forces the ebit decision: IFRS mandates no operating-profit line, so ProfitLossBeforeTax + InterestExpense vs - FinanceIncomeCost both defensible and differ. Belongs in a versioned spec, not a mapping row."
  - step: "7. Beneish five-variable model (was: 'Roxas-5 variant')"
    status: blocked
    blocked_on: "The five-variable coefficient table in Beneish (1999), Financial Analysts Journal 55(5) 24-36 — paywalled. The free June 1999 preprint is truncated before the tables."
    finding: "Verified 2026-08-02 by reading the Roxas (2011) original in full (all 11 pages, publisher PDF). TWO corrections to what was recorded. (1) MISATTRIBUTION: Roxas contains no equations and no coefficients at all — she applies Beneish's own 5-coefficient probit model and says so (p.59). There is no 'Roxas-5 variant'; citing Roxas for coefficients would misattribute the model in a versioned spec. (2) DEPI vs TATA IS STILL OPEN, and the previously recorded conclusion is not safe. Roxas contradicts herself within three sentences on p.60 — 'Beneish (1999) found the following indices as significant: DSRI, GMI, AQI, SGI and TATA' followed by 'This M-score combines the five indices: DSRI, GMI, AQI, SGI, and DEPI'. Beneish's own introduction lists his five as receivables, gross margins, asset quality, sales growth and ACCRUALS, with no depreciation. Against that, the disputed 0.107 is very close to DEPI's 8-variable coefficient of 0.115 while TATA's is 4.679. Significance evidence says TATA; magnitude evidence says DEPI. Unresolvable without Beneish's table."
    verified: "Cutoff -2.76 is real (Roxas Table 1) but is a BENEISH benchmark she reports, not a Roxas figure. Note Roxas uses -2.22 for the 8-variable cutoff where beneish_v1.yaml uses -1.78 — both are in the literature, different prior/cost assumptions; worth stating on the methodology page."
    full_writeup: "_bmad-output/planning-artifacts/research-beneish-five-variable-model.md"
    options: "(1) Buy/borrow the FAJ paper and read the table — the only thing that settles it, recommended if the variant is still wanted. (2) Drop it: SHOP and Suncor stay insufficient_data, which is honest — the variant adds coverage, not correctness. (3) Encode with a caveat — NOT recommended, a caveat cannot make a possibly-wrong coefficient right."


