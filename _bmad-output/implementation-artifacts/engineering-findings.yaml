story_12_2_ingestion:
  status: done
  resolved: 2026-09-01
  question: >
    Can CPB's and ZTS's real EDGAR filings be ingested into raw_facts using the
    existing us-gaap ingestion path, with correctly attributed fiscal_year_end
    and idempotent re-runs, exactly as CP/QSR/OTEX/SHOP already are?
  verdict: >
    Yes, after fixing a real, previously-latent defect in the SHARED
    parse_company_facts parser that Story 12.1's spike did not surface (that
    spike checked concept-level coverage, not per-accession fiscal_year_end
    resolution). CPB and ZTS are now ingested: 16 filings / 11,151 raw_facts
    for CPB (FY2010-2025 non-calendar Aug FYE), 13 filings / 8,931 raw_facts
    for ZTS (FY2013-2025 calendar Dec FYE), including its FY2014 10-K. The
    original PR run omitted that filing because its annual facts use EDGAR's
    valid ``fp=Q4`` label; the shared parser now accepts that label on annual
    forms. Idempotency was re-verified after the correction (second run: 0
    filings added, 0 raw_facts added for both).
  defect_found:
    title: >-
      parse_company_facts's "latest end wins" fiscal_year_end heuristic picked
      a subsequent-event disclosure over the real fiscal-year-end for CPB's
      FY2011 10-K
    detail: >
      Accession 0000950123-11-087197 (CPB's FY2011 10-K, filed 2011-09-28) tags
      us-gaap:LineOfCreditFacilityMaximumBorrowingCapacity at end=2011-09-30 —
      a credit-facility subsequent-event disclosure, genuinely us-gaap and
      fp='FY' (so NOT excluded by the existing dei-cover-page-date fix), and
      genuinely 2 months AFTER the real fiscal-year-end of 2011-07-31, which
      265 other us-gaap facts on the same accession share. The existing
      "candidates = us-gaap only, then take max(end)" logic picked this
      singleton over the true FYE, corrupting the Filing row (fiscal_year_end
      recorded as 2011-09-30 instead of 2011-07-31). Confirmed live 2026-09-01
      from the same company-facts JSON fetched for Story 12.1.

      FIRST FIX ATTEMPT REJECTED BY THE PROJECT'S OWN OTHER DATA: tried
      "plurality of end date wins" (pick whichever end the most us-gaap facts
      share). This correctly fixed the FY2011 case (265 facts at the true FYE
      vs. 1 at the subsequent-event date) but broke CPB's OWN earliest 10-K
      (accession 0000950123-10-090083, its FY2010 filing): that accession's
      FY2009 comparative period genuinely carries MORE tagged facts (95) than
      its own FY2010 current period (89), so plurality picked the wrong year
      even though the original max-end logic already had that one right. This
      would have been a NEW regression from the fix itself if shipped without
      re-checking every other accession, not just the one the defect was found
      in — caught only by diffing the fix's output against the DB for every
      accession, not just the one under investigation.

      ACTUAL FIX: a genuine financial-statement period can never end AFTER the
      report covering it was filed — end > filed is an accounting
      impossibility, true for current periods AND comparatives alike. The parser
      filters non-statement candidates to end < filed (while allowing a
      full-year statement period on the filing date), fails closed when that
      leaves no candidate, and prefers the latest full-year duration period when
      one is present. That last guard also excludes a subsequent-event fact dated
      after the real FYE but before filing, while the date-based max preserves
      the CPB FY2010 comparative-vs-current case (2010-08-01 > 2009-08-02)
      regardless of fact counts.
    scope_check: >
      Queried every raw_fact already ingested for all 9 filers (the other 7
      plus CPB/ZTS): exactly ONE accession in the whole universe has any
      raw_fact.period_end > its Filing.filing_date — this same CPB FY2011
      accession. The defect is confirmed CPB-specific (an idiosyncratic
      subsequent-event tagging choice), not a systemic gap the other 7 filers
      were quietly also exposed to. The full backend suite passes with 395
      tests passed and 1 skipped after the parser, persistence, regression-test
      and status-guard fixes — zero regressions.
    fix_location: >-
      backend/ingestion/company_facts.py (parse_company_facts) and
      backend/raw_store/repository.py (persist_company_facts)
    regression_test: >-
      backend/tests/test_ingestion.py::test_fiscal_year_end_ignores_a_subsequent_event_us_gaap_fact;
      test_fiscal_year_end_ignores_a_pre_filing_subsequent_event;
      test_fiscal_year_end_keeps_latest_valid_period_when_comparative_has_more_facts;
      test_fiscal_year_end_rejects_accession_with_only_future_dated_candidates;
      test_fiscal_year_end_rejects_same_day_non_statement_candidate;
      test_fiscal_year_end_uses_a_later_entry_when_the_first_omits_filed;
      test_parse_accepts_q4_annual_facts_on_a_10k
    db_correction: >-
      The one corrupted Filing row (CPB accession 0000950123-11-087197) was
      corrected directly in the dev DB after the code fix landed (idempotent
      persist_company_facts only adds missing rows, never corrects an existing
      wrong one) — fiscal_year_end updated from 2011-09-30 to 2011-07-31, then
      re-verified against the fixed parser's output for every one of CPB's and
      ZTS's 29 filings combined: zero mismatches. Re-running the corrected
      parser through persist_company_facts also added ZTS's missing FY2014
      filing and 669 raw facts; the repository now repairs existing filing
      metadata instead of leaving a previously persisted fiscal-year-end stale.
  scope_note: >
    Deliberately did NOT add CPB/ZTS to pipeline/universe.py's PHASE1_UNIVERSE
    — that tuple drives pipeline/run.py's live cron, which also canonicalizes
    and scores, and Story 12.5's own title ("Scheduled pipeline inclusion...")
    reserves that wiring for itself, after Story 12.3's mapping decisions land.
    raw_facts is independent of PHASE1_UNIVERSE — canonicalize_issuer and
    run_validation can run against any issuer_cik with ingested raw_facts
    regardless of cron-list membership, which is what makes ingesting now and
    wiring the cron later in Story 12.5 a coherent sequence rather than a
    workaround.
  carry_forward: >
    Story 12.3 can now run canonicalize_issuer/run_validation against real
    ingested raw_facts for both filers. No new mapping-spec changes are needed
    from this story — the fiscal_year_end fix lives entirely in the ingestion
    layer, upstream of canonicalization, and required no filer-specific
    mapping-spec edit.
