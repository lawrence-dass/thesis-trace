      - "gross_profit: 0 years resolved — confirmed still never resolves, as predicted (no full-year filed tag, no applicable derivation for us-gaap)"
      - "total_debt: FY2010-2025 (16 years, 7 derived) — filed tag covers 9 (FY2010-2018), derivation extends 7 more (FY2019-2025) via near_term_debt + long_term_debt, exactly matching the Story 12.1 prediction"
