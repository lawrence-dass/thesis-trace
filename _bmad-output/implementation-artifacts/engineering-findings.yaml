      - "ebit: FY2011-2025 (15 years, ALL 15 derived via ebit_pbt_plus_interest) — fully resolved for the first time in this project's history for this filer"
      - "cash_and_equivalents: FY2010-2017 ONLY (8 years, 0 derived) — STOPS at FY2017 exactly as intended; FY2018-2025 correctly insufficient_data rather than silently inheriting the restricted-cash-inclusive figure"
