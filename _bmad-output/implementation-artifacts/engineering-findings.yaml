  findings:
    - id: 1
      title: "CPB's pre-2017 revenue tag REJECTED; ZTS's pre-2016 revenue tag ACCEPTED — same-shaped candidate, opposite outcome"
      detail: >
        Both filers have a legacy pre-ASC-606 revenue tag not in us-gaap_v8.yaml's
        current fallback chain (Revenues, RevenueFromContractWithCustomerExcluding
        AssessedTax): CPB tags SalesRevenueGoodsNet FY2008-2018, ZTS tags
        SalesRevenueNet FY2011-2017. Checked overlap-year equality against
        Revenues before treating either as admissible, per this project's standing
        rule that a same-named-sounding tag needs proof, not assumption.

        ZTS: SalesRevenueNet == Revenues to the dollar in both overlap years
        (FY2016: $4,888M both; FY2017: $5,307M both). This is a clean tag switch,
        not a measurement change. Adding it as a fallback extends ZTS revenue to
        FY2011-2025 and SPECIFICALLY RESOLVES the FY2014 single-year gap flagged
        in the 2026-09-01 ticker-selection check (FY2014 value: $4,785,000,000,
        accession 0001555280-16-000344, confirmed present).

        CPB: SalesRevenueGoodsNet differs from Revenues in both overlap years
        (FY2017: $7,890M vs $5,837M, +35.17%; FY2018: $8,685M vs $6,615M,
        +31.29%). SEC metadata describes SalesRevenueGoodsNet as net goods revenue
        after returns, allowances and discounts; the finding must not call it gross
        or pre-allowance. CPB's 2019 10-K reclassifies sold businesses as discontinued
        operations for all periods presented, which plausibly explains the gap as
        total net sales versus continuing-operations Revenues. REJECTED for the
        current continuing-operations canonical basis, pending an explicit filed
        reconciliation; CPB's pre-FY2017 revenue-dependent signals remain
        insufficient_data rather than receiving an unproven value.
      action: >
        Story 12.3: add SalesRevenueNet as a revenue fallback source for ZTS only
        (do not add SalesRevenueGoodsNet for CPB). Bump us-gaap mapping spec
        version and record the overlap-year proof in its note field, matching the
        QSR restricted-cash and SHOP/OTEX gross-profit precedents already in that
        file.
    - id: 2
      title: "Neither filer has a qualifying annual gross_profit fact — expected, matches QSR's existing shape"
      detail: >
        ZTS never tags GrossProfit at all. CPB tags 88 GrossProfit USD facts in the
        live payload, but only 80 are from 10-K filings (the other 8 are 8-K facts);
        all 80 10-K instances are quarterly sub-periods from the 10-K's "selected
        quarterly financial data" footnote, with no 350-380 day full-year fact.
        This is the exact quarterly-footnote sharp edge already documented in
        project-context.md's 2026-07-29 learnings, confirmed live rather than
        assumed. Consequently gross_profit has no qualifying annual fact for either
        filer.

        This is NOT a defect. derivations_v4.yaml's revenue_minus_cost_of_sales
        rule is deliberately scoped to ifrs-full only (requires_source restricts
        it to the CostOfSales tag) — us-gaap filers were excluded on purpose after
        the QSR investigation found the subtraction unsafe there. beneish.py's
        _gross_profit_validated() already handles a filer with zero gross_profit
        coverage correctly when all other Beneish indices compute: GMI is still
        computed from revenue/cogs directly, and the run carries a
        "computed_with_caveat" (unvalidated margin) annotation rather than
        insufficient_data — the same mechanism already live for QSR. However,
        compute_beneish returns insufficient_data first when any required index is
        missing, so the caveat is conditional on a fully computed run, not a
        permanent status for every filer-year.
      action: "None for gross_profit. Story 12.4 golden entries must expect a conditional caveat only on otherwise-computed Beneish runs."
    - id: 3
      title: "CPB's long_term_debt crosses a tag switch at FY2014 — verified a clean rename, not a measurement change"
      detail: >
        CPB tags LongTermDebtNoncurrent FY2009-2014 then switches to
        LongTermDebtAndCapitalLeaseObligations FY2014-2025 (the same variant CP
        uses, per us-gaap_v8.yaml's existing note). The one overlap year
        (FY2014) agrees exactly: $2,244,000,000 both tags. Unlike CP — which has
        NO non-lease-inclusive tag at all, making the two measurement bases
        genuinely different — CPB's single shared year shows no lease component
        distorting the figure at the switch point. Weaker evidence than ZTS's
        3-year cash-tag proof or QSR's cash proof (only one overlap year exists
        here), stated plainly rather than overstated.
      action: >
        No mapping change needed — us-gaap_v8.yaml's existing fallback order
        (LongTermDebtNoncurrent, then LongTermDebtAndCapitalLeaseObligations)
        already covers CPB correctly. Record the live verification so a future
        session doesn't re-flag this switch as a suspected bug (the exact BCE
        debt-tag trap from the 2026-08-14 learnings).
    - id: 4
      title: "ZTS has NO ebit under the current us-gaap mapping — real gap; reconstruction remains a design decision"
      detail: >
        ZTS never tags OperatingIncomeLoss in any year (confirmed absent from its
        full us-gaap concept list, not just missing from the coverage window).
        Altman's X3 (EBIT / total assets) will read insufficient_data for ZTS in
        every fiscal year unless this is fixed. derivations_v4.yaml already has an
        ebit_pbt_plus_interest DECISION rule (pretax income + interest expense),
        but its operands (profit_before_tax, interest_expense) are currently
        mapped under ifrs-full ONLY — us-gaap_v8.yaml maps neither, so the rule is
        de facto unreachable for any us-gaap filer today, ZTS included.

        Checked feasibility: ZTS tags InterestExpense and
        IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItems
        NoncontrollingInterest for ALL 15 years, FY2011-2025, with zero gaps. The
        proposed pretax tag is a us-gaap continuing-operations concept; it is not
        the same source tag as ifrs-full:ProfitLossBeforeTax. A us-gaap extension
        could give ZTS complete ebit coverage, but only after the continuing-
        operations basis is reconciled and the scope of the mapping is decided.
      action: >
        Story 12.3 decision, not a Story 12.1 fix (D8 consequence 3 — a
        reconstruction is a DECISION, needs its own rationale on the methodology
        page, and changing derivations_v4.yaml's scope is exactly the kind of
        change that belongs in its own reviewed step). Do not map the candidate
        operands globally until the filed basis and impact on every us-gaap filer
        are verified; if issuer scope is required, the mapping schema must express
        that scope rather than silently applying a ZTS choice to the universe.
    - id: 5
      title: "ZTS's cash_and_equivalents crosses to the restricted-inclusive tag at FY2018 — overlap proof is insufficient"
      detail: >
        ZTS tags CashAndCashEquivalentsAtCarryingValue only through FY2017, then
        relies on CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents
        for FY2018-2025 — structurally the exact QSR pattern this project's
        mapping spec documents and gates behind proof. The two tags agree to the
        dollar in all 3 overlap years (FY2015: $1,154M; FY2016: $727M; FY2017:
        $1,564M), but that does not prove the relationship persists after the
        switch. ZTS's 2019 10-K discloses restricted cash of $5M at FY2018 and
        $2M at FY2019, so the inclusive values are not unrestricted cash in those
        years. The raw tag coverage is real; the fallback is not semantically safe.

        CORRECTION verified independently 2026-09-01: restricted cash is not new
        at the switch. ZTS's own RestrictedCashCurrent tag reports $6,000,000 as
        of FY2017-end (0001555280-18-000053, ZTS's ORIGINAL FY2017 10-K, and
        confirmed again as a comparative in the FY2018 10-K) — the exact same
        fiscal year the two cash tags above match to the dollar. That is the
        harder problem: the "restricted-inclusive" tag's FY2017 value equals the
        plain tag's FY2017 value exactly, despite ZTS separately disclosing $6M
        of restricted cash for that same date — the combined tag does not appear
        to actually include it, contradicting its own name for at least that
        year. The 3-year overlap match is real data, but it does not demonstrate
        "no restricted cash"; it demonstrates the combined tag not moving when
        restricted cash is nonzero, which is a different and less reassuring
        fact. Do not read the overlap match as proof of anything beyond itself.
      action: >
        Keep the global fallback from applying to ZTS until the versioned mapping
        design has issuer-specific exclusion or another filed-value solution. The
        existing generic overlap test is not sufficient: it proves only FY2015-2017
        equality and cannot certify post-switch restricted cash.
