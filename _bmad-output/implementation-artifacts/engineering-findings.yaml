story_12_1_coverage_spike:
  status: done
  resolved: 2026-09-01
  question: >
    Does every concept the four models and the reverse-DCF solver actually read —
    not just revenue — have live, per-year coverage against real data.sec.gov
    company-facts for CPB (CIK 0000016732) and ZTS (CIK 0001555280)? And is ZTS's
    single-year FY2014 revenue gap (found in the earlier ticker-selection check) a
    tag switch or a real gap?
  verdict: >
    23 concepts checked: the deduplicated union of the four scoring specs' declared
    inputs (9 Piotroski, 8 Altman, 13 Beneish including its gross-margin guard, and
    3 Sloan inputs) plus all 11 concepts in valuation.overview.DCF_CONCEPTS. The
    per-year rows, selected source, accession, form and candidate count are now
    committed below. CPB's current canonical revenue begins FY2017; its legacy
    SalesRevenueGoodsNet candidate is not admitted until the continuing-operations
    basis is reconciled. ZTS's FY2014 revenue gap is explained by a validated
    SalesRevenueNet tag switch, but the fallback remains a Story 12.3 mapping change,
    not a production fix. ZTS has a real ebit gap under the current us-gaap mapping.
    ZTS's restricted-inclusive cash fallback is not safe to approve: the overlap
    equality is real, but filed restricted-cash disclosures appear after the switch.
  method_note: >
    Fetched live data.sec.gov/api/xbrl/companyfacts JSON for both CIKs directly
    (SEC fair-access User-Agent, matching backend/ingestion/edgar.py's
    EDGAR_CONTACT convention) — nothing is ingested yet, so raw_facts had nothing
    to read from. Bucketed every fact on its own `end` date against each issuer's
    real fiscal-year-end (CPB 08/03, ZTS 12/31, both from the submissions API's
    own fiscalYearEnd field, not assumed), filtered to form 10-K/10-K/A, and for
    duration concepts required a 350-380 day span to exclude quarterly and
    "selected quarterly financial data" footnote sub-periods (see CPB's GrossProfit
    below — exactly that trap). Concept list and its us-gaap source tags read
    directly from the live mapping spec (us-gaap_v8.yaml) and derivations_v4.yaml,
    not re-derived from scratch.
  per_concept_coverage:
    note: >-
      The ranges below are a convenience summary. The durable machine-readable
      evidence is in coverage_evidence: every selected annual row records its
      period_end, period_start where applicable, value, unit, form, accession,
      source tag, candidate count and selection status. "clean" means no internal
      gaps within the stated range; missing years are explicit in both records.
