# QSR gross-profit re-verification (2026-08-02). Asked: should the gross_profit
# derivation extend to us-gaap cost tags, accepting a golden F-score change 6 -> 7?
# Answered against live EDGAR (CIK 0001618756). ANSWER: NO. Golden value 6 stands.
qsr_gross_profit_reverification:
  verdict: "Do not extend. The derived figure is wrong, not a missing signal."
  evidence:
    - "QSR is primarily a franchisor: Revenues bundles royalties, property and advertising revenue with supply-chain and company-restaurant sales, while CostOfGoodsAndServicesSold covers only the latter. It is 49% of total costs and expenses; advertising expense alone (FY2023 $1,201M) sits outside cogs while its revenue sits inside Revenues."
    - "The apparent improvement that would have flipped Piotroski's margin signal is a revenue-mix artefact: FY2022->FY2023 revenue +7.9%, cost of sales +5.3%, advertising expense +16.4%. A zero-cogs stream growing at twice revenue lifts the ratio 0.87pp with no underlying margin change."
    - "Control: SHOP and OTEX both file GrossProfit AND revenue - cogs reproduces it to the dollar. QSR files no GrossProfit line at all — the filer signalling the subtraction is not meaningful for its income statement. CP tags no cogs and is unaffected."
    - "Structurally identical to Suncor's inventories-only cogs, from the revenue side: a partial cost base against a full revenue base. Both excluded by the same requires_source constraint."
  guarded_by: "backend/tests/test_concept_mappings.py::test_gross_profit_derivation_stays_scoped_to_true_cost_of_sales_tags"
  follow_up_resolved:
    - item: "Beneish's GMI computed QSR's gross margin from the same (revenue - cogs) / revenue ratio, so the distortion was live in production for QSR's M-score."
      status: done
      resolved: 2026-08-02
      evidence: "New `gross_margin_validation` guard in formulas/specs/beneish_v1.yaml, applied in scoring/beneish.py. QSR and Suncor are flagged computed_with_caveat; SHOP, OTEX, Cameco and BCE are not. The M-score is UNCHANGED — QSR FY2023 still -2.219847, the hand-verified golden value, so no golden re-verification was needed after all. Guarded by tests/test_beneish_gross_margin_guard.py."
      design_note: "The test is filer-level, not year-level: a filer that reports a gross profit line ANYWHERE has demonstrated revenue - cogs is meaningful for its income statement. A year-level test would wrongly flag SHOP, whose fixture carries GrossProfit for FY2024 only. Stated limitation: validation once is validation throughout, so a filer that restructured after last reporting gross profit would not be re-flagged — accepted because the cases caught are structural (business model / presentation basis), not year-specific."
      note: "Suncor's Beneish never resolves anyway (no SG&A line -> SGAI unresolvable), so the guard is real but unreachable for it. Pinned by a test so its absence is not later mistaken for a coverage bug."


# Story 5.1 — debt-maturity coverage spike (2026-08-04). Asked: is the debt maturity
# schedule actually tagged for every filer, before Story 5.6 assumes it? Answered
# against live data.sec.gov company-facts for all 7 universe CIKs.
# ANSWER: No. Only 2 of 7 filers carry a usable ladder. Scope Story 5.6 accordingly.
story_5_1_debt_maturity_spike:
  status: done
  resolved: 2026-08-04
  question: "Is a year-by-year debt maturity schedule reachable from EDGAR company-facts for every universe filer?"
  verdict: "NO for the full ladder — 2 of 7. But a narrower NEAR-TERM SHARE metric is reachable for 6 of 7 with usable history, and is genuinely comparable across filers."
  ladder_coverage:
    - filer: "CP"
      finding: "Full years 1-5 for FY2015-2025. 'AfterYearFive' (thereafter) only from FY2022 — so for FY2015-2021 the ladder does NOT sum to total debt and must not be used as its own denominator. Tags no LongTermDebtCurrent/Noncurrent at all; its InNextTwelveMonths bucket IS its current portion."
    - filer: "QSR"
      finding: "Best coverage in the universe. Full 5-year ladder + thereafter, FY2014-2024. FY2025 is missing thereafter. Also tags the current/noncurrent split for 13 years."
    - filer: "OTEX"
      finding: "NEVER tags years 2-5 — the ladder does not exist for it in any year. Worse, it switched near-term tags mid-history: InNextTwelveMonths (FY2011-2015) -> RemainderOfFiscalYear (FY2016-2020) -> back to InNextTwelveMonths (FY2021-2025), and AfterYearFive only FY2012-2020. Recent years carry a near-term bucket and nothing else."
    - filer: "SHOP"
      finding: "No debt maturity ladder at all. Tags the LEASE maturity ladder (LesseeOperatingLeaseLiability...AfterYearFive) but not a debt one — consistent with convertible notes having a single maturity. Current/noncurrent convertible split exists for FY2023-2024 only."
    - filer: "CCJ / BCE / SU (all ifrs-full)"
      finding: "ZERO maturity or repayment-of-principal concepts, all three. Not a tagging-quality gap: under IFRS the maturity analysis is a liquidity-risk disclosure expressed with axis/member DIMENSIONS, and the EDGAR company-facts API exposes only non-dimensional facts. It is structurally unreachable by this ingestion path, not merely absent. Reaching it would require dimensional-fact ingestion from Inline XBRL — a real architecture change, not a mapping addition."
  recommended_scope: >
    Redefine the metric rather than restrict it. Near-term debt share (debt due within
    12 months / total debt) is ONE concept, identically defined whether it comes from a
    ladder's first bucket or from a current/noncurrent split, so it stays comparable
    across filers with no caveat: CP via its ladder, QSR/OTEX via either, CCJ FY2017-2025,
    BCE FY2016-2025, SU FY2016-2025 via the split. SHOP resolves for FY2023-2024 only and
    is honestly insufficient_data elsewhere. The full maturity PROFILE (years 2-5 and
    thereafter) then becomes a display enrichment available for CP and QSR alone —
    presented as extra detail where it exists, never as a metric other filers "fail".
  decided: "2026-08-04 — Lawrence chose the redefinition. Story 5.6 is now 'near-term debt share'; the year-by-year profile moves to new Story 5.7 as a CP+QSR display enrichment that may be deferred indefinitely. Recorded in prd.md section 8 OQ9 and epics.md Epic 5."
  method_note: >
    Two documented project anti-patterns both reproduced here, which is why the spike
    was worth running: 'a tag exists but does not cover the years you need' (CP's missing
    thereafter bucket) and 'a filer switches tags mid-history' (OTEX, twice). Checking
    tag presence alone would have reported OTEX as covered and CP's ladder as summable.
  corrected_by_story_5_6: >
    2026-08-04, during Story 5.6 implementation. Two findings above are WRONG and the
    live re-verification the story mandated caught both.

    (1) "CP tags no LongTermDebtCurrent/Noncurrent at all" — CP tags no concept by that
    exact name, but has tagged LongTermDebtAndCapitalLeaseObligationsCurrent for 17
    consecutive years (FY2009-2025) and the matching noncurrent and including-current
    -maturities variants. CP never needed its ladder. This spike checked one tag name
    rather than the family, which is the same failure mode it correctly warns about.

    (2) "CCJ FY2017-2025" — Cameco does not tag CurrentPortionOfLongtermBorrowings in
    FY2020 or FY2021. A real two-year gap, now insufficient_data.

    Also disproved, and it was the spike's central recommendation: a maturity ladder's
    first bucket and a current-portion tag are NOT one concept. They differ in 11 of 15
    shared years for CP, 10 of 10 for OTEX, 2 of 12 for QSR — undiscounted contractual
    principal vs balance-sheet carrying amount. Story 5.6 shipped on the current/
    noncurrent split alone, which is available for every filer that has a ladder and
    gives one measurement basis across the universe. The maturity ladder is not mapped.

    The lesson is not that the spike was careless — it is that a spike's finding is a
    hypothesis until the build re-checks it, which is exactly why the story carried
    "to be re-confirmed at build time, not trusted from here".


# Found 2026-08-04 while building Story 5.2's diff engine. NOT a Story 5.2 defect —
# the engine handles it correctly; this is an upstream canonicalization gap that the
# diff work exposed. Needs its own decision, so it is recorded rather than fixed here.
canonical_facts_amendment_gap:
  status: done
  resolved: 2026-09-02
  pr: "116, 117"
  merged_commit: "190d6a1 (#116), 2fd9206 (#117)"
  fixed: 2026-09-02
  merge_note: >
    PR #116 (the base fix below) merged to main 2026-09-02 17:42 UTC. A Codex
    review of #116 found real gaps in that base fix and Lawrence applied the
    fixes as two commits (0258d65, f0922de) — but PR #116 had ALREADY merged
    eleven minutes earlier, so those two commits landed on a now-stranded
    branch, not on main. Cherry-picked onto a fresh branch off updated main as
    PR #117, merged 2026-09-02. `main` now has both the base fix and the
    hardening below.
  hardening_2026_09_02: >
    Codex-found, Lawrence-fixed, independently re-verified (full suite +
    rollback dry run over the dev DB, unchanged: still 0 figures move for
    CP/OTEX's 115 amendment-selected facts): (a) scoring/runner.py's
    `_canonical_fact_for_year` didn't filter by mapping_version, so during a
    mapping-version rebuild — both versions legitimately non-superseded — it
    could pick either one via an arbitrary ORDER BY, not necessarily the
    version the scorer actually loaded; same gap fixed in validation/checks.py.
    (b) the "identical value, no rewrite" skip now also compares unit,
    period_end and source (taxonomy, concept) — an amendment restating the
    same number in a different currency, period, or source tag no longer
    hides behind the old row. (c) a filing-metadata correction (e.g. a
    restated fiscal_year_end) can make an already-canonicalized fact's raw-fact
    group disappear entirely; such rows are now retired rather than left
    current with no justifying candidate. (d) a derived fact whose operand
    disappeared or stopped satisfying `requires_source` is now retired instead
    of surviving on stale operands. (e) the migration downgrade now refuses
    whenever ANY row is superseded, not only when the pre-migration unique
    constraint would literally fail — catching the case where a superseded
    row has no replacement at all (a retired derived fact) and would
    otherwise silently look current to a downgraded reader.
  fix: >
    Option (1), not the recommended (3). Option 3 ("narrow the skip, no migration")
    is structurally impossible: when re-resolution picks a different winner the full
    unique key leaves only UPDATE-in-place, which mutates a row prior score_inputs
    point at — AD-2/AD-19 forbid exactly that. Shipped instead: canonical_facts gains
    `superseded`/`superseded_by` (AD-6's score_runs pattern one layer down) and the
    unique constraint becomes a PARTIAL unique index over `NOT superseded`; the
    canonicalizer's guard is now "the same raw fact still wins" rather than "the key
    exists", superseding the old row when a different winner carries a DIFFERENT
    figure (an identical re-filed value rewrites nothing); derived facts are
    re-derived and superseded when an operand moved; the six current-fact readers
    filter `superseded IS FALSE`, the two id-join readers (diff engine, data-quality
    join) deliberately do not. Migration c7e1f4a92b06.
  spec_consequence: >
    AD-3 gained rule (1a): within the originally-filed tier an amendment of that same
    year outranks the original it amends. Without it the fix was hollow — a 10-K/A's
    restated value could only ever TIE with the original in AD-3's top tier and be
    flagged ambiguous, so AD-6's "referencing the new canonical_facts" was
    unsatisfiable by construction. The two ADs contradicted each other and nobody had
    noticed because no amendment in the universe carries a value the original lacks.
    Recorded in ARCHITECTURE-SPINE.md AD-3 in the same change.
  fix_verification: >
    (1) Arrival-order tests in test_canonicalization.py simulate the production
    sequence (original canonicalized, THEN amendment ingested, THEN a second pass):
    supersession, identical-value no-op, single-pass amendment-wins-without-flag, and
    the derived-fact cascade on a synthetic Liabilities-less filer. (2) The diff-engine
    test that pinned the gap now asserts the positive: a restatement under one
    mapping_version IS a fact_change with both endpoints auditable. (3) Full suite 402
    passed, golden untouched. (4) ROLLBACK DRY RUN over the dev DB, all 9 filers,
    2026-09-02: under rule 1a CP selects 43 and OTEX 72 current facts from amendments,
    and in EVERY case the original filing carried the same value — 0 figures change in
    the current universe, consistent with the 2026-08-04 mechanism check. The dry run
    also showed only CPB/ZTS are canonicalized under concepts_v10 on the dev DB; the
    other seven are at v9 until the next pipeline pass (the half-degraded-page shape
    from the 2026-08-05 learning).
  found: 2026-08-04
  found_by: "Story 5.2 (diff engine) — a test asserting a restated fact produced a UniqueViolationError instead"
  issue: >
    A 10-K/A that restates a fiscal year's figures never reaches canonical_facts.
    canonical_facts is UNIQUE on (issuer_cik, canonical_concept, fiscal_year,
    mapping_version), and canonicalize_issuer skips any key already present under the
    current mapping_version to keep the pass idempotent (canonicalize.py, the `existing`
    set). That guard keys on the fiscal year and ignores the accession entirely, so once
    a year is canonicalized from the original 10-K, the amendment's restated values are
    skipped — and the unique constraint would reject them anyway.
  why_it_matters: >
    AD-6 and PRD open question 2 both say an amendment triggers a new append-only
    score_run "referencing the new canonical_facts". The run is genuinely new, but the
    facts it references are the stale pre-restatement ones, so the new run recomputes
    the same numbers. The amendment is invisible below the filing layer.
  note: >
    The ranking function DOES handle amendments correctly (it prefers as-originally-filed
    per AD-3) — but only when writing a key for the first time. The skip runs first, so
    re-selection never happens. This is a gap in the idempotency guard, not in AD-3.
  reachability: >
    CONFIRMED REACHABLE, verified 2026-08-04 against live company-facts for all 7 filers.
    Amendments exist for CP (650 amended fact rows across 8 accessions, 40-F/A + 10-K/A),
    OTEX (1660 rows, 3 accessions) and SHOP (2 rows). QSR, CCJ, BCE and SU file none.
    More importantly the amendments RESTATE canonical values, not just exhibits: 18
    canonical concepts for CP and 18 for OTEX carry a different value under the amended
    form than under the original.
  severity_by_filer: >
    OTEX is the live concern — its restated canonical concepts land in FY2010 and
    FY2012-2015, squarely inside its 24-year scored history, and they touch total_assets,
    current_assets, current_liabilities, cogs, sga, gross_profit, long_term_debt and
    shares_outstanding, i.e. inputs to all four models. CP's restatements are FY2008-2010,
    which predate its scoring window (its 10-K history starts 2016), so CP is very likely
    unaffected in practice. SHOP's single conflict is EntityPublicFloat, a dei cover-page
    fact that is not canonical. Net: OTEX needs checking against stored values; CP and
    SHOP almost certainly do not.
  crucial_nuance: >
    The bug is an INCREMENTAL-OPERATION bug, not a backfill bug, and this determines both
    severity and the fix. Within a SINGLE canonicalization pass, all of an issuer's raw
    facts — original and amended alike — are grouped together and resolved by AD-3's
    ranking, which handles the conflict correctly. The `existing` skip only takes effect
    ACROSS passes. So a clean backfill (ingest everything, then canonicalize once) produces
    correct values, while the production path (daily pipeline canonicalizes FY-N, a 10-K/A
    arrives months later, the next pass skips the year) permanently keeps whichever value
    was written first. A rebuild-from-scratch would therefore silently 'fix' the data and
    hide the bug — which also means reproducing it requires simulating arrival ORDER, not
    just the presence of an amendment.
  verification_result: >
    DONE 2026-08-04. VERDICT: the gap is LATENT, not biting — no score in the current
    universe is wrong because of it. Two independent checks agree.
    (1) ARRIVAL-ORDER REPRODUCTION on the real OTEX payload: ingest originals only ->
    canonicalize -> ingest amendments -> canonicalize again, versus ingest everything ->
    canonicalize once. Both orders produced identical values for all 325 canonical facts,
    0 disagreements. The experiment is valid rather than vacuous: 141 amended facts do
    survive the duration/FYE filters and 24 (concept, fiscal_year) groups have genuinely
    competing values.
    (2) MECHANISM CHECK explains why. The skip can only freeze a wrong value when an
    amendment carries a value that NO original filing has. OTEX has 0 such cases and
    SHOP 0 — every amended value is also carried by some original filing, typically a
    later 10-K's comparative, so the first canonicalization pass already sees the
    eventual winner. CP has 34 such cases, but all fall in FY2007-2010 while CP is only
    scored FY2013-2025, so they are outside the scored window.
  trigger_condition: >
    An amendment carrying a value no original filing has, in a year that is scored. The
    dangerous shape is a 10-K/A restating the MOST RECENT fiscal year, filed before the
    next 10-K exists to carry that year as a comparative — exactly the case none of the
    seven filers currently exhibits. CP demonstrably produces the condition, just aimed
    at years predating its scoring window. This is a near-miss, not an all-clear.
  severity: >
    Downgraded from the initial reading. Restatements of canonical concepts are real
    (18 concepts each for CP and OTEX), which is what the first pass established — but
    restatement alone is not sufficient to move a stored value, and none of them does.
    Priority is BELOW Story 5.3. Do not treat as won't-fix: OTEX is safe incidentally,
    because comparatives happen to carry the amended value, not by design, so a new
    filer or a differently-timed amendment could bite without warning.
  regression_guard_suggested: >
    Cheaper than fixing: assert in the pipeline (or a test) that no amendment introduces
    a candidate value absent from every original filing for a SCORED year. That detects
    the trigger condition arriving, rather than trying to detect a wrong number after the
    fact. Would have to run against live payloads, so it fits the existing live-data
    spot-check action item for Epic 4.
  consequence_for_story_5_2: >
    fact_change is unreachable within a single mapping_version — two runs under one
    mapping_version necessarily reference identical canonical_fact rows. The engine
    reports fact changes correctly when the mapping version moves, which is currently
    the only way inputs can differ. Pinned by
    tests/test_diff_engine.py::test_restatement_under_one_mapping_version_yields_no_fact_change,
    which asserts CURRENT behaviour and is designed to fail when this gap is fixed.
  options: >
    (1) Include accession_number in the canonical_facts unique key and supersede facts on
    amendment, mirroring AD-6's score_run pattern — most correct, needs a migration and a
    supersession column. (2) Re-canonicalize a fiscal year when a superseding filing
    arrives, deleting the prior rows — simpler but breaks the append-only/audit posture
    AD-2 exists to protect. (3) Narrow the `existing` skip so it re-resolves a
    (concept, fiscal_year) whose candidate raw_facts now include an accession not present
    when it was last written — smallest change, no migration, keeps append-only, but needs
    care not to rewrite history on every pass. Option 3 was NOT considered before the
    reachability data came in and now looks the best value; recommend (3), with (1) if the
    audit trail for superseded facts is judged worth a migration.
  status_note: >
    Option 3 supersedes the earlier '(3) accept and document' — accepting is no longer
    defensible now that restatement of canonical concepts is confirmed rather than
    hypothetical.


# Epic 6 (Reverse DCF) coverage spike, 2026-08-06. Asked, before any story is
# written: are the inputs a reverse DCF needs actually reachable for the universe?
# Run because Epic 6's acceptance criteria cannot be written honestly without it —
# and because Story 5.1 established that this class of question must be answered
# from data, not assumed. Epic 6 stays `deferred` in epic_catalog: this produces
# the evidence for decomposition, it does not perform it.
# Story 6.2 live verification, 2026-08-07. The EDGAR work is DONE and recorded here
# so the implementation does not need to re-fetch: all seven CIKs were fetched from
# data.sec.gov and bucketed by PERIOD_END against each issuer's own recognised
# fiscal-year-end, never by the payload's `fy` field. Story 6.2 itself is NOT done —
# no spec files were written. This is its first half.
story_6_2_live_verification:
  status: done
  resolved: 2026-08-07
  story: "6.2 — free-cash-flow canonical concepts, interest classification decided"
  what_remains: >
    NOTHING — completed 2026-08-11. us-gaap_v7, ifrs-full_v4 and derivations_v4
    written, registry bumped to concepts_v8, eight guards added in
    tests/test_free_cash_flow_concepts.py.
  build_time_reconfirmation: >
    Re-checked against real data at build time per Story 5.1's lesson, by
    canonicalizing the dev DB to concepts_v8. Every prediction held: capex resolves
    for 6 of 7 and Suncor has none; cash_and_equivalents resolves for 7 of 7; BCE's
    11 cash rows are 100% DERIVED, so the rule is what gives it a cash figure at all;
    QSR now covers FY2011-2025 with a clean switch from the plain tag at FY2018 to
    the fallback at FY2019. BCE's identity is exact in every year (FY2023: 547 + 225
    = 772), including years where it tags CashEquivalents as 0.

    ONE THING THE SPEC WORK CHANGED. The recorded plan said BCE's cash would be "a
    derivation", which was right, but the engine takes CANONICAL CONCEPTS as
    operands, not source tags — so `cash` and `cash_equivalents` had to become
    canonical concepts to be summable. They are ifrs-full-only and are operands, not
    metrics: neither is a usable cash figure alone, and a test pins them out of
    us-gaap so no filer can resolve a partial value that reads like its cash.
  coverage_verified_live:
    capex:
      SHOP: "PaymentsToAcquirePropertyPlantAndEquipment — 11y FY2015-2025"
      CP: "PaymentsToAcquirePropertyPlantAndEquipment — 18y FY2008-2025"
      QSR: "PaymentsToAcquirePropertyPlantAndEquipment — 14y FY2012-2025"
      OTEX: "PaymentsToAcquireProductiveAssets (VARIANT) — 20y FY2007-2026"
      CCJ: "PurchaseOfPropertyPlantAndEquipmentClassifiedAsInvestingActivities — 10y FY2016-2025"
      BCE: "PurchaseOfPropertyPlantAndEquipmentClassifiedAsInvestingActivities — 10y FY2016-2025"
      SU: "NONE — confirmed live. Suncor is insufficient_data for all of Epic 6."
    cash_and_equivalents:
      SHOP: "CashAndCashEquivalentsAtCarryingValue — 12y FY2014-2025"
      CP: "CashAndCashEquivalentsAtCarryingValue — 19y FY2007-2025"
      QSR: "plain tag 8y FY2011-2018 ONLY; restricted-inclusive tag 10y FY2016-2025 — see qsr_restricted_cash_proof"
      OTEX: "CashAndCashEquivalentsAtCarryingValue — 21y FY2006-2026"
      CCJ: "CashAndCashEquivalents — 11y FY2015-2025"
      BCE: "NO combined tag — tags Cash and CashEquivalents SEPARATELY, 11y each. Needs a derivation."
      SU: "CashAndCashEquivalents — 11y FY2015-2025"
  corrects_the_6_1_spike: >
    SHOP's capex and cash are 11y and 12y, not the 9y the spike reported. The spike
    bucketed on the payload's `fy` field; bucketing on period_end recovers the extra
    years. This is the correction the spike itself flagged as its own method error.
  interest_classification_verified: >
    IFRS gives filers explicit classification tags and the two IFRS filers CHOSE
    DIFFERENTLY, so this is proven from real tags rather than inferred from IAS 7.
    BCE: InterestPaidClassifiedAsOperatingActivities, 10y.
    CCJ: InterestPaidClassifiedAsFinancingActivities, 10y.
    CP / OTEX / QSR / SHOP: InterestPaid / InterestPaidNet — operating, mandated by
    US GAAP. SU: no interest-paid tag, and moot since it has no capex.

    CONSEQUENCE: Cameco's cash_from_operations EXCLUDES interest paid while every
    other filer's includes it, so `CFO - capex` is not the same measurement for
    Cameco and its free cash flow reads systematically high.
  qsr_restricted_cash_proof: >
    QSR files BOTH cash tags in FY2016, FY2017 and FY2018, and they are IDENTICAL to
    the dollar in all three years (1,476M / 1,097M / 913M, difference exactly 0). QSR
    therefore carries no restricted cash and the restricted-inclusive tag IS its
    unrestricted cash. That makes it an admissible priority-1 fallback — but the proof
    is FILER-SPECIFIC, not general, so it must be guarded by a test. Same overlap-year
    technique that validated `revenue - cogs` against filers who file GrossProfit
    directly. QSR does not disclose restricted cash separately after FY2014, so
    subtracting it is not an option.
  decisions_made:
    - "capex maps the us-gaap primary + OTEX's ProductiveAssets variant + the ifrs-full purchase tag."
    - >
      capex does NOT map CapitalExpendituresIncurredButNotYetPaid — an accrual
      disclosure, not cash capex. Confirmed live that SHOP (8y) and QSR (4y) both tag
      it, so the exclusion is load-bearing rather than theoretical.
    - >
      cash_and_equivalents for BCE is a DERIVATION, not a fallback:
      Cash + CashEquivalents, `kind: identity` because it is true by definition under
      IFRS. Belongs beside assets_minus_equity in derivations_v4.
    - >
      THE INTEREST CAVEAT MOVES TO STORY 6.3, deliberately. 6.2's AC says to annotate
      runs `computed_with_caveat`, but there are no runs yet — the solver is 6.3. The
      classification is recorded as versioned spec data here and 6.3 applies the
      caveat when it computes. Same shape as Story 5.3 departing from its own `since` AC.
  tests_required:
    - "Reject-list: CapitalExpendituresIncurredButNotYetPaid is never a capex source."
    - >
      QSR equality guard: for every universe filer that files BOTH cash tags, they must
      be equal. Fails loudly the day a filer with real restricted cash is added, instead
      of silently inflating cash and understating enterprise value.
    - "Suncor resolves no capex, pinned so its absence is never mistaken for a coverage bug."
    - "BCE's cash resolves via derivation and carries `derivation:` provenance, not a filed-line citation."
  carry_forward: >
    Per Story 5.1's lesson these remain hypotheses until the build re-checks them —
    though unlike 5.1 this pass WAS live, per-year, and bucketed correctly.


# Found by Codex's review of Story 6.5 (2026-08-11), confirmed and sharpened here.
market_price_dates_labelled_as_fiscal_year_end:
  status: done
  closed: 2026-08-13
  closed_by: >
    PR #72. Guard + backfill, applied to the dev store: 24 rows re-dated (20
    market_prices, 4 fx_rates), 0 remaining on a non-trading date, and the second
    --apply run is a no-op.
  correction_to_this_entry: >
    THE DIAGNOSIS ABOVE WAS WRONG ABOUT THE DATA, and the error would have caused
    data loss if the recorded fix had been followed. It says a corrected row sits
    beside the mislabelled one, the weekend row winning because it sorts later, so
    "one-time deletion ... followed by a re-ingest" would suffice. Checked first:
    NOT ONE of the 24 rows had a correctly-dated partner, because the corrected
    ingestion had never been re-run. Deleting first would have destroyed the only
    copy of each year's close, and a failed fetch would have left Altman and the
    reverse DCF with no market input for those years.
  what_it_actually_needed: >
    An UPDATE IN PLACE, not a delete and re-insert. The first implementation wrote
    the corrected row and deleted the stale one; Postgres refused, because
    score_inputs.market_price_id and .fx_rate_id are the AD-19 provenance links
    recording WHICH row each Altman run consumed — 69 and 38 of them respectively.
    Deleting would have orphaned every one. Relabelling in place is also the more
    truthful operation: it is the same observation, only its label was wrong, so
    each score run keeps citing exactly the quote it consumed. Verified after the
    run: 69/38 citations intact, 0 orphans, row counts unchanged at 69/11.
  verified: >
    Every provider close and rate matched the stored value EXACTLY — 0 mismatches
    across 24 rows — which confirms the original severity call: the label was
    wrong, the price was right. Every weekend fiscal-year-end still resolves to a
    price (get_fye_close takes the latest row within 7 days, and Friday is 1-2 days
    before), so no year lost its market cap. A test pins that property.
  guard: >
    upsert_fye_close and upsert_fx_rate now REFUSE a weekend date outright, and the
    bare-float form of fye_prices/fx_rates was removed from run_issuer — dating an
    observation to the fiscal-year-end was its only behaviour and the entire cause.
    Weekends only: a full exchange calendar needs a dependency, and every FYE in the
    universe is 31 December or 30 June, never a weekday holiday. A weekday holiday
    would still slip through — recorded in raw_store/observation_dates.py.
  also_caught: >
    The guard immediately found the GOLDEN DATASET doing the same thing: three
    golden years end on a Sunday (QSR and CP FY2023, OTEX FY2019) and the fixture
    seeded the quote AT the year end. Now seeded at the real trading day; no golden
    expected value moved.
  found: 2026-08-11
  found_by: "Codex code review of Story 6.5; consequence traced during verification"
  issue: >
    Ingestion stored Tiingo closes and Bank of Canada rates under the filer's
    FISCAL-YEAR-END date rather than the date the observation was actually made.
    Confirmed reachable: BCE, Cameco, CP and OTEX all carry Saturday- and
    Sunday-dated market_prices rows — quotes on days the market was shut.
  fixed_going_forward: >
    pipeline/run.py now accepts (observed_date, value) tuples and live ingestion
    supplies them. Backward compatible: a bare float still dates to the
    fiscal-year-end, so fixtures and older callers are unaffected.
  why_the_backfill_matters_more_than_tidiness: >
    uq_market_prices_key is (issuer_cik, price_date, source), so re-ingesting under
    the corrected date writes a SECOND row rather than updating the first. The
    lookup then takes the most recent row on or before the fiscal-year-end — and the
    mislabelled weekend row is LATER than the true Friday observation, so it wins.
    Until the legacy rows are removed the fix is INERT: correct dates are written
    and never read.
  severity: >
    No numerical impact today. Both rows carry the same Friday close; the date label
    was wrong, not the price. So this is a data-hygiene and correctness-of-provenance
    issue, not a wrong-score issue.
  fix: >
    One-time deletion of market_prices and fx_rates rows whose date falls on a
    non-trading day, followed by a re-ingest. Needs its own change: it touches the
    ingestion path and should carry a guard asserting no stored observation lands on
    a weekend.


