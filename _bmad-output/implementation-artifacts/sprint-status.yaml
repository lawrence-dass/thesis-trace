      us-gaap), so no fixed decade-long promise can be written into a story.
    decompose_when: >
      The workflow has demonstrated which trends it actually consumes. Do not
      decompose from the FR alone.
  epic-9:
    title: "Filing Q&A"
    decomposition: deferred
    deferred_under: D9
    reason: >
      Headline only, and last by design. D9 places it last because it is the heaviest
      lift in the roadmap and depends on a citation-evaluation framework that does not
