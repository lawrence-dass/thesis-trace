  epic-6:
    title: "Narrow Valuation — Reverse DCF"
    decomposition: decomposed
    decomposed_on: 2026-08-06
    note: >
      Decomposed WITHOUT a decision packet, deliberately, and the reasoning is recorded
      because it reverses this file's own earlier position. D9's binding criterion
      governs BUILD order — which feature is built next — not planning order. The "do
      not decompose" rule was an inference stated in epics.md, not a clause in D9, and
      it does not hold: acceptance criteria commit nothing, since a story can sit in
      the backlog unbuilt. Deferring Epics 6-9 as a block treated four epics with four
      different blockers as one case.

      The test applied instead is per-epic: can the acceptance criteria be written
      truthfully today? Epic 6's could, once Story 6.1's spike (2026-08-06) answered
      the data question. Its five remaining product questions are judgement calls, not
      evidence questions, and are recorded in epics.md as assumptions A-1..A-5 —
      horizon, terminal method, discount-rate treatment, solve-target and sensitivity
      axes — each explicitly reversible rather than presented as a finding.
    d9_still_governs: >
      What gets BUILT next is still chosen from the largest observed research failure,
      per D10's decision packet. A planned backlog is what that choice selects from.
      Decomposition is not a commitment to build.
    known_gap: >
      Suncor resolves no capex and is insufficient_data for the whole epic. Story 6.2
      must also settle an interest-classification decision: US GAAP mandates interest
      paid inside operating activities while IAS 7 permits operating or financing, so
      cash_from_operations is not comparable across regimes as filed. Same shape as D8
      consequence 3.
  epic-7:
    title: "Thesis Journal & Thesis Diff"
    decomposition: deferred
    deferred_under: D9
    reason: >
      Same criterion as Epic 6, one step further out. Scoped in epics.md (intent and
      FR coverage) but not decomposed, because its position depends on what Epic 6's
      decision packet exposes.
    decompose_when: >
      The increment before it has produced its own decision packet (D10) and this epic
      is what that packet's single largest research failure selects.
  epic-8:
    title: "Growth Trends"
    decomposition: deferred
    deferred_under: D9
    reason: >
      Headline only in epics.md — deliberately the least specified, because it is
      furthest from evidence. Its depth is explicitly meant to be set by "the depth
      the decision workflow proves it needs", which cannot be known yet. A further
      constraint is already recorded: trend depth must honestly reflect per-filer
      coverage (IFRS 40-F filers start ~FY2017, ~9 years, against OTEX's 24 under
      us-gaap), so no fixed decade-long promise can be written into a story.
    decompose_when: >
      The workflow has demonstrated which trends it actually consumes. Do not
      decompose from the FR alone.
  epic-9:
    title: "Filing Q&A"
    decomposition: deferred
    deferred_under: D9
    reason: >
      Headline only, and last by design. D9 places it last because it is the heaviest
      lift in the roadmap and depends on a citation-evaluation framework that does not
      yet exist; D7 additionally confines LangGraph to the explain/retrieve/cite
      surface. Both constraints have to be satisfied before stories are meaningful.
    decompose_when: >
      A citation-evaluation framework exists, and the earlier increments have been used
      for real research.


