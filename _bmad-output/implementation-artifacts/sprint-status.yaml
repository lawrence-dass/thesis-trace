# QSR gross-profit re-verification (2026-08-02). Asked: should the gross_profit
# derivation extend to us-gaap cost tags, accepting a golden F-score change 6 -> 7?
# Answered against live EDGAR (CIK 0001618756). ANSWER: NO. Golden value 6 stands.
qsr_gross_profit_reverification:
  verdict: "Do not extend. The derived figure is wrong, not a missing signal."
  evidence:
    - "QSR is primarily a franchisor: Revenues bundles royalties, property and advertising revenue with supply-chain and company-restaurant sales, while CostOfGoodsAndServicesSold covers only the latter. It is 49% of total costs and expenses; advertising expense alone (FY2023 $1,201M) sits outside cogs while its revenue sits inside Revenues."
    - "The apparent improvement that would have flipped Piotroski's margin signal is a revenue-mix artefact: FY2022->FY2023 revenue +7.9%, cost of sales +5.3%, advertising expense +16.4%. A zero-cogs stream growing at twice revenue lifts the ratio 0.87pp with no underlying margin change."
    - "Control: SHOP and OTEX both file GrossProfit AND revenue - cogs reproduces it to the dollar. QSR files no GrossProfit line at all — the filer signalling the subtraction is not meaningful for its income statement. CP tags no cogs and is unaffected."
    - "Structurally identical to Suncor's inventories-only cogs, from the revenue side: a partial cost base against a full revenue base. Both excluded by the same requires_source constraint."
  guarded_by: "backend/tests/test_concept_mappings.py::test_gross_profit_derivation_stays_scoped_to_true_cost_of_sales_tags"
  follow_up_resolved:
    - item: "Beneish's GMI computed QSR's gross margin from the same (revenue - cogs) / revenue ratio, so the distortion was live in production for QSR's M-score."
      status: done
      resolved: 2026-08-02
      evidence: "New `gross_margin_validation` guard in formulas/specs/beneish_v1.yaml, applied in scoring/beneish.py. QSR and Suncor are flagged computed_with_caveat; SHOP, OTEX, Cameco and BCE are not. The M-score is UNCHANGED — QSR FY2023 still -2.219847, the hand-verified golden value, so no golden re-verification was needed after all. Guarded by tests/test_beneish_gross_margin_guard.py."
      design_note: "The test is filer-level, not year-level: a filer that reports a gross profit line ANYWHERE has demonstrated revenue - cogs is meaningful for its income statement. A year-level test would wrongly flag SHOP, whose fixture carries GrossProfit for FY2024 only. Stated limitation: validation once is validation throughout, so a filer that restructured after last reporting gross profit would not be re-flagged — accepted because the cases caught are structural (business model / presentation basis), not year-specific."
      note: "Suncor's Beneish never resolves anyway (no SG&A line -> SGAI unresolvable), so the guard is real but unreachable for it. Pinned by a test so its absence is not later mistaken for a coverage bug."

# Story 5.1 — debt-maturity coverage spike (2026-08-04). Asked: is the debt maturity
# schedule actually tagged for every filer, before Story 5.6 assumes it? Answered
# against live data.sec.gov company-facts for all 7 universe CIKs.
# ANSWER: No. Only 2 of 7 filers carry a usable ladder. Scope Story 5.6 accordingly.
story_5_1_debt_maturity_spike:
  status: done
  resolved: 2026-08-04
  question: "Is a year-by-year debt maturity schedule reachable from EDGAR company-facts for every universe filer?"
  verdict: "NO for the full ladder — 2 of 7. But a narrower NEAR-TERM SHARE metric is reachable for 6 of 7 with usable history, and is genuinely comparable across filers."
  ladder_coverage:
    - filer: "CP"
      finding: "Full years 1-5 for FY2015-2025. 'AfterYearFive' (thereafter) only from FY2022 — so for FY2015-2021 the ladder does NOT sum to total debt and must not be used as its own denominator. Tags no LongTermDebtCurrent/Noncurrent at all; its InNextTwelveMonths bucket IS its current portion."
    - filer: "QSR"
      finding: "Best coverage in the universe. Full 5-year ladder + thereafter, FY2014-2024. FY2025 is missing thereafter. Also tags the current/noncurrent split for 13 years."
    - filer: "OTEX"
      finding: "NEVER tags years 2-5 — the ladder does not exist for it in any year. Worse, it switched near-term tags mid-history: InNextTwelveMonths (FY2011-2015) -> RemainderOfFiscalYear (FY2016-2020) -> back to InNextTwelveMonths (FY2021-2025), and AfterYearFive only FY2012-2020. Recent years carry a near-term bucket and nothing else."
    - filer: "SHOP"
      finding: "No debt maturity ladder at all. Tags the LEASE maturity ladder (LesseeOperatingLeaseLiability...AfterYearFive) but not a debt one — consistent with convertible notes having a single maturity. Current/noncurrent convertible split exists for FY2023-2024 only."
    - filer: "CCJ / BCE / SU (all ifrs-full)"
      finding: "ZERO maturity or repayment-of-principal concepts, all three. Not a tagging-quality gap: under IFRS the maturity analysis is a liquidity-risk disclosure expressed with axis/member DIMENSIONS, and the EDGAR company-facts API exposes only non-dimensional facts. It is structurally unreachable by this ingestion path, not merely absent. Reaching it would require dimensional-fact ingestion from Inline XBRL — a real architecture change, not a mapping addition."
  recommended_scope: >
    Redefine the metric rather than restrict it. Near-term debt share (debt due within
    12 months / total debt) is ONE concept, identically defined whether it comes from a
    ladder's first bucket or from a current/noncurrent split, so it stays comparable
    across filers with no caveat: CP via its ladder, QSR/OTEX via either, CCJ FY2017-2025,
    BCE FY2016-2025, SU FY2016-2025 via the split. SHOP resolves for FY2023-2024 only and
    is honestly insufficient_data elsewhere. The full maturity PROFILE (years 2-5 and
    thereafter) then becomes a display enrichment available for CP and QSR alone —
    presented as extra detail where it exists, never as a metric other filers "fail".
  decided: "2026-08-04 — Lawrence chose the redefinition. Story 5.6 is now 'near-term debt share'; the year-by-year profile moves to new Story 5.7 as a CP+QSR display enrichment that may be deferred indefinitely. Recorded in prd.md section 8 OQ9 and epics.md Epic 5."
  method_note: >
    Two documented project anti-patterns both reproduced here, which is why the spike
    was worth running: 'a tag exists but does not cover the years you need' (CP's missing
    thereafter bucket) and 'a filer switches tags mid-history' (OTEX, twice). Checking
    tag presence alone would have reported OTEX as covered and CP's ladder as summable.

# Found 2026-08-04 while building Story 5.2's diff engine. NOT a Story 5.2 defect —
# the engine handles it correctly; this is an upstream canonicalization gap that the
# diff work exposed. Needs its own decision, so it is recorded rather than fixed here.
canonical_facts_amendment_gap:
  status: open
  found: 2026-08-04
  found_by: "Story 5.2 (diff engine) — a test asserting a restated fact produced a UniqueViolationError instead"
  issue: >
    A 10-K/A that restates a fiscal year's figures never reaches canonical_facts.
    canonical_facts is UNIQUE on (issuer_cik, canonical_concept, fiscal_year,
    mapping_version), and canonicalize_issuer skips any key already present under the
    current mapping_version to keep the pass idempotent (canonicalize.py, the `existing`
    set). That guard keys on the fiscal year and ignores the accession entirely, so once
    a year is canonicalized from the original 10-K, the amendment's restated values are
    skipped — and the unique constraint would reject them anyway.
  why_it_matters: >
    AD-6 and PRD open question 2 both say an amendment triggers a new append-only
    score_run "referencing the new canonical_facts". The run is genuinely new, but the
    facts it references are the stale pre-restatement ones, so the new run recomputes
    the same numbers. The amendment is invisible below the filing layer.
  note: >
    The ranking function DOES handle amendments correctly (it prefers as-originally-filed
    per AD-3) — but only when writing a key for the first time. The skip runs first, so
    re-selection never happens. This is a gap in the idempotency guard, not in AD-3.
  reachability: >
    Real but not confirmed biting. CP is known to file 10-K/A rows (taxonomies.py cites
    live confirmation 2026-07-23). Many 10-K/A filings only add exhibits and restate
    nothing, so no wrong number is currently proven to be live. Worth checking against
    the four filers' actual amendment history before deciding urgency.
  consequence_for_story_5_2: >
    fact_change is unreachable within a single mapping_version — two runs under one
    mapping_version necessarily reference identical canonical_fact rows. The engine
    reports fact changes correctly when the mapping version moves, which is currently
    the only way inputs can differ. Pinned by
    tests/test_diff_engine.py::test_restatement_under_one_mapping_version_yields_no_fact_change,
    which asserts CURRENT behaviour and is designed to fail when this gap is fixed.
  options: >
    (1) Include accession_number in the canonical_facts unique key and supersede facts on
    amendment, mirroring AD-6's score_run pattern — most correct, needs a migration and a
    supersession column. (2) Re-canonicalize a fiscal year when a superseding filing
    arrives, deleting the prior rows — simpler but breaks the append-only/audit posture
    AD-2 exists to protect. (3) Accept and document, if amendment restatements turn out
    not to occur in the universe. Recommend (1), gated on the reachability check above.
