# EPIC CATALOG — epic titles and, for an epic with no stories, the decision that
# defers it. `development_status` is a flat map of scalars because that is what
# bmad-sprint-planning regenerates; a scalar has nowhere to put a title or a
# reason, so both live here and are pinned to it by tests rather than by hope.
#   decomposed  Stories exist in epics.md and are tracked above.
#   deferred    NO stories, deliberately. `deferred_under` names the decision;
#               `decompose_when` states what would end it. Both are required.

