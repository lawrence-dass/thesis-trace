# Render deployment (AD-13): FastAPI read API as a Web Service.
#
# DEMO CONFIG (2026-08-27): `plan: free` rather than `starter` — this is a
# free-tier link for a mentor demo, not the production target. Render's free
# web-service tier sleeps after ~15 min idle (first request after that takes
# ~30-60s to wake up); fine for a demo, not for a real launch.
#
# The cron pipeline service is OMITTED here on purpose: Render cron jobs are
# not available on the free tier, and a demo doesn't need the nightly batch
# running live — the dataset is seeded once from the local dev database
# (already ingested for the 7-filer universe) via pg_dump/pg_restore. Re-add
# a `type: cron` service on a paid plan when this goes from demo to real.
services:
  - type: web
    name: thesistrace-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install uv && uv sync --no-dev"
    startCommand: "uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: EDGAR_CONTACT
        sync: false
      - key: TIINGO_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
